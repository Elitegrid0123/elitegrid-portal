              </table>
            </div>
          </Card>
      }
    </div>
  );
}

function ARolesAccess({ user, contractors, setContractors, perms, setPerms, updatePerms }) {
  const [editPerm,setEditPerm]       = useState(null);
  const [tempClients,setTempClients] = useState([]);
  const admins = contractors.filter(c=>c.status==="Active"); // Super Admin sees all
  const openPerm = (admin) => {
    setEditPerm(admin);
    const key = Object.keys(perms).find(k=>k.toLowerCase()===(admin.username||"").toLowerCase());
    setTempClients((key && perms[key] && perms[key].assignedClients) || []);
  };
  const savePerm = () => {
    const newPerms = {...perms, [(editPerm.username||"").toLowerCase()]:{assignedClients:tempClients}};
    updatePerms(()=>newPerms);
    // Save to Sheet so it persists across devices
    if (!DEMO_MODE) callScript("savePerms", {username:editPerm.username, assignedClients:tempClients.join(",")}, ()=>{}, ()=>{});
    setEditPerm(null);
  };
  const toggleCl = (cl) => setTempClients(prev=>prev.includes(cl)?prev.filter(c=>c!==cl):[...prev,cl]);
  const changeRole = (un,role) => setContractors(prev=>prev.map(c=>c.username===un?{...c,role}:c));

  return (
    <div style={{ padding:"28px 20px", maxWidth:800, margin:"0 auto" }}>
      <div style={{ fontSize:20, fontWeight:800, marginBottom:6 }}>Roles and Access</div>
      <div style={{ fontSize:14, color:C.muted, marginBottom:24 }}>Manage admin roles and set which client accounts each admin can see.</div>
      <Card>
        <div style={{ fontSize:15, fontWeight:700, marginBottom:16 }}>Admin Users</div>
        {admins.map(a=>(
          <div key={a.username} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"14px 0", borderBottom:`1px solid ${C.border}`, flexWrap:"wrap", gap:10 }}>
            <div style={{ display:"flex", alignItems:"center", gap:12 }}>
              <Avatar name={a.name} photoUrl={a.photoUrl} size={40}/>
              <div>
                <div style={{ fontWeight:600, fontSize:14, color:C.navy }}>{a.name} <span style={{ color:C.muted, fontWeight:400 }}>@{a.username}</span></div>
                <div style={{ display:"flex", gap:6, alignItems:"center", marginTop:4, flexWrap:"wrap" }}>
                  <SBadge s={a.role}/>
                  {a.role==="admin"&&<span style={{ fontSize:12, color:C.muted }}>Sees: {(()=>{
                    const key = Object.keys(perms).find(k=>k.toLowerCase()===(a.username||"").toLowerCase());
                    const p = key ? perms[key] : null;
                    return p && p.assignedClients && p.assignedClients.length > 0 ? p.assignedClients.join(", ") : "No clients assigned";
                  })()}</span>}
                </div>
              </div>
            </div>
            <div style={{ display:"flex", gap:8 }}>
              {a.username!==user.username&&(
                <select value={a.role} onChange={e=>{ changeRole(a.username,e.target.value); if(!DEMO_MODE) callScript('updateContractor',{username:a.username,role:e.target.value},()=>{},()=>{}); }}
                  style={{ padding:"6px 10px", borderRadius:7, border:`1px solid ${C.border}`, fontSize:12, fontFamily:"inherit", outline:"none", background:"#fff" }}>
                  <option value="contractor">Contractor</option>
                  <option value="admin">Admin</option>
                  <option value="superadmin">Super Admin</option>
                </select>
              )}
              {a.role==="admin"&&<button onClick={()=>openPerm(a)} style={{ background:C.off, border:`1px solid ${C.border}`, borderRadius:7, padding:"6px 12px", fontSize:12, color:C.blue, fontWeight:600, cursor:"pointer" }}>Set Access</button>}
            </div>
          </div>
        ))}
      </Card>
      {editPerm&&(
        <div style={{ position:"fixed", inset:0, background:"rgba(27,42,74,0.65)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:700, padding:16 }} onClick={e=>e.target===e.currentTarget&&setEditPerm(null)}>
          <div style={{ background:"#fff", borderRadius:16, padding:32, width:"100%", maxWidth:440, boxShadow:"0 24px 80px rgba(0,0,0,0.3)" }}>
            <div style={{ fontSize:17, fontWeight:800, color:C.navy, marginBottom:4 }}>Set Client Access</div>
            <div style={{ fontSize:13, color:C.muted, marginBottom:20 }}>{editPerm.name} can see contractors from selected clients.</div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:10, marginBottom:24 }}>
              {ALL_CLIENTS.map(cl=>(
                <button key={cl} onClick={()=>toggleCl(cl)}
                  style={{ padding:"9px 8px", borderRadius:8, border:`1.5px solid ${tempClients.includes(cl)?C.blue:C.border}`, background:tempClients.includes(cl)?"#DBEAFE":"#fff", color:tempClients.includes(cl)?C.blue:C.muted, fontSize:13, fontWeight:tempClients.includes(cl)?700:500, cursor:"pointer", fontFamily:"inherit" }}>
                  {cl}
                </button>
              ))}
            </div>
            <div style={{ display:"flex", gap:10 }}>
              <Btn onClick={savePerm} style={{ flex:1, padding:11 }}>Save Access</Btn>
              <Btn variant="secondary" onClick={()=>setEditPerm(null)} style={{ flex:1, padding:11 }}>Cancel</Btn>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ERROR BOUNDARY — catches React render crashes instead of white screen
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError:false, error:null }; }
  static getDerivedStateFromError(error) { return { hasError:true, error }; }
  componentDidCatch(error, info) { console.error("Portal render error:", error, info); }
  render() {
    if (this.state.hasError) {
      return (
        React.createElement("div", {style:{minHeight:"100vh",background:"#0D1B2A",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"Inter,sans-serif",padding:24}},
          React.createElement("div", {style:{background:"#fff",borderRadius:16,padding:32,maxWidth:480,width:"100%",textAlign:"center"}},
            React.createElement("div", {style:{fontSize:32,marginBottom:16}}, "⚠️"),
            React.createElement("div", {style:{fontSize:18,fontWeight:800,color:"#1e3a5f",marginBottom:8}}, "Something went wrong"),
            React.createElement("div", {style:{fontSize:13,color:"#6B7280",marginBottom:24}}, "Please refresh the page to continue."),
            React.createElement("button", {onClick:()=>{ try{localStorage.removeItem("eg_session");}catch(e){} window.location.reload(); }, style:{background:"#1e3a5f",color:"#fff",border:"none",borderRadius:10,padding:"12px 28px",fontSize:14,fontWeight:700,cursor:"pointer"}}, "Refresh Page")
          )
        )
      );
    }
    return this.props.children;
  }
}

// ROOT APP
// ══════════════════════════════════════════════════════════
function App() {
  const [currentUser,   setCurrentUser]   = useState(() => {
    try {
      const saved = localStorage.getItem("eg_session");
      if (!saved) return null;
      const u = JSON.parse(saved);
      if (!u) return null;
      // Normalize role
      if (u.role) u.role = u.role==="Super Admin"?"superadmin":u.role==="Admin"?"admin":u.role==="Contractor"?"contractor":u.role;
      // Clear stale contractor sessions that lack profile — forces fresh login
      const _role = (u.role||"").toLowerCase();
      if (_role !== "superadmin" && _role !== "admin" && !u.profile) {
        try { localStorage.removeItem("eg_session"); localStorage.removeItem("eg_un"); localStorage.removeItem("eg_pw"); } catch(ex) {}
        return null;
      }
      return u;
    } catch(e) { return null; }
  });
  const [page,          setPage]          = useState(() => {
    try {
      const saved = localStorage.getItem("eg_session");
      if (!saved) return "c-dashboard";
      const u = JSON.parse(saved);
      return (u.role==="contractor")?"c-dashboard":"a-overview";
    } catch(e) { return "c-dashboard"; }
  });
  const [chPwOpen,      setChPwOpen]      = useState(false);
  const inactivityTimer = React.useRef(null);

  const [showTimeoutWarning, setShowTimeoutWarning] = useState(false);
  const warningTimer = React.useRef(null);

  const resetTimer = React.useCallback(() => {
    if (inactivityTimer.current) clearTimeout(inactivityTimer.current);
    if (warningTimer.current)    clearTimeout(warningTimer.current);
    setShowTimeoutWarning(false);
    // Show warning at 2 minutes
    warningTimer.current = setTimeout(() => {
      setShowTimeoutWarning(true);
    }, 2 * 60 * 1000);
    // Log out at 3 minutes
    inactivityTimer.current = setTimeout(() => {
      try { localStorage.removeItem("eg_session"); localStorage.removeItem("eg_un"); localStorage.removeItem("eg_pw"); } catch(e) {}
      setShowTimeoutWarning(false);
      setCurrentUser(null); setPage("c-dashboard"); setChPwOpen(false);
    }, 3 * 60 * 1000);
  }, []);

  React.useEffect(() => {
    if (!currentUser) return;
    const events = ["mousemove","keydown","click","scroll","touchstart"];
    events.forEach(e => window.addEventListener(e, resetTimer));
    resetTimer();
    return () => {
      events.forEach(e => window.removeEventListener(e, resetTimer));
      if (inactivityTimer.current) clearTimeout(inactivityTimer.current);
    };
  }, [currentUser, resetTimer]);

  const [contractors,   setContractors]   = useState([...INIT_CONTRACTORS]);
  const [payslips,      setPayslips]      = useState([...INIT_PAYSLIPS]);
  const [leaves,        setLeaves]        = useState([...INIT_LEAVES]);
  const [announcements, setAnnouncements] = useState([...INIT_ANNOUNCEMENTS]);
  const [auditLog,      setAuditLog]      = useState([...INIT_AUDIT]);
  const [clients,       setClients]       = useState([...INIT_CLIENTS]);
  const [perms, setPerms] = useState(() => {
    try {
      const saved = localStorage.getItem("eg_perms");
      if (!saved) return {...INIT_PERMS};
      const p = JSON.parse(saved);
      // Normalize all keys to lowercase
      const normalized = {};
      Object.keys(p).forEach(k => { normalized[k.toLowerCase()] = p[k]; });
      return normalized;
    } catch(e) { return {...INIT_PERMS}; }
  });

  // Persist perms whenever they change
  const updatePerms = (fn) => {
    setPerms(prev => {
      const next = typeof fn === 'function' ? fn(prev) : fn;
      try { localStorage.setItem("eg_perms", JSON.stringify(next)); } catch(e) {}
      return next;
    });
  };
  const [notifications, setNotifications] = useState([]);
  const [rateHistory,   setRateHistory]   = useState([]);

  // On refresh: re-fetch live data if session was restored from localStorage
  React.useEffect(() => {
    if (!currentUser || DEMO_MODE) return;
    const un = currentUser._username || currentUser.username || (()=>{ try{return localStorage.getItem("eg_un");}catch(e){return null;} })();
    const pw = currentUser._password || currentUser.password || (()=>{ try{return localStorage.getItem("eg_pw");}catch(e){return null;} })();
    if (!un || !pw) return;
    callScript("login", {username: un, password: pw}, (json) => {
      if (!json.success) return;
      const u = json.data;
      if (u.allContractors && u.allContractors.length > 0) setContractors(u.allContractors.map(c=>({...c,role:normalizeRoleStr(c.role)})));
      if (u.allLeaves && u.allLeaves.length > 0) setLeaves(u.allLeaves);
      if (u.leaveRequests) setLeaves(u.leaveRequests);
      if (u.clients && u.clients.length > 0) setClients(u.clients);
      if (u.announcements) setAnnouncements(u.announcements);
      if (u.allPayslips && u.allPayslips.length > 0) setPayslips(u.allPayslips);
      else if (u.payslips) setPayslips(u.payslips);
      if (u.teammates && u.teammates.length > 0 && !(u.allContractors && u.allContractors.length > 0)) {
        setContractors(u.teammates);
      }
      // CRITICAL: update currentUser with fresh profile + pto so liveContractor stays valid
      setCurrentUser(prev => ({
        ...prev,
        ...(u.profile                ? { profile:     u.profile     } : {}),
        ...(u.pto                    ? { pto:         u.pto         } : {}),
        ...(u.bankInfo   !== undefined ? { _bankInfo:   u.bankInfo   } : {}),
        ...(u.ptoHistory !== undefined ? { _ptoHistory: u.ptoHistory } : {}),
        ...(u.teamLeaves !== undefined ? { _teamLeaves: u.teamLeaves } : {}),
        ...(u.payslips   !== undefined ? { _payslips:   u.payslips   } : {}),
      }));
      if (u.adminPerms && Object.keys(u.adminPerms).length > 0) {
        const np = {};
        Object.keys(u.adminPerms).forEach(k => { np[k.toLowerCase()] = u.adminPerms[k]; });
        updatePerms(()=>np);
      }
    }, () => {});
  }, []);

  const addNotification = React.useCallback((title, body) => {
    const time = nowPHT().toLocaleTimeString("en-PH",{hour:"numeric",minute:"2-digit",timeZone:"Asia/Manila"});
    setNotifications(prev=>[{title,body,time,read:false},...prev].slice(0,20));
  }, []);

  const clearNotifs  = () => setNotifications([]);
  const markRead     = (i) => setNotifications(prev=>prev.map((n,idx)=>idx===i?{...n,read:true}:n));

  const login = (u) => {
    // If live data from Sheet, payslips/announcements come inside u directly
    // If demo data, use the local state arrays
    if (!DEMO_MODE && u.payslips !== undefined) {
      u._payslips      = u.payslips;
      u._announcements = u.announcements;
    } else {
      u._payslips      = payslips;
      u._announcements = announcements;
    }
    // Flatten profile fields onto u for compatibility
    if (u.profile) {
      u.name     = u.profile.name;
      u.username = u._username; // ensure username is always set for perms lookup
      // Normalize role to lowercase internal values
      const rawRole = u.profile.role || "contractor";
      u.role     = rawRole==="Super Admin"?"superadmin":rawRole==="Admin"?"admin":rawRole==="Contractor"?"contractor":rawRole.toLowerCase().replace(/\s+/g,"") || "contractor";
      u.photoUrl = u.profile.photoUrl || "";
    }
    // Also normalize if role is directly on u (demo mode)
    if (u.role) {
      u.role = u.role==="Super Admin"?"superadmin":u.role==="Admin"?"admin":u.role==="Contractor"?"contractor":u.role;
    }
    // Initialize live data from Sheet response
    if (!DEMO_MODE) {
      if (u.leaveRequests !== undefined) setLeaves(u.leaveRequests||[]);
      if (u.allLeaves !== undefined && u.allLeaves.length > 0) setLeaves(u.allLeaves||[]);
      if (u.clients !== undefined)       setClients(u.clients||[]);
      if (u.announcements !== undefined) setAnnouncements(u.announcements||[]);
      // Store ptoHistory on the user object for the PTO page
      if (u.ptoHistory !== undefined) u._ptoHistory = u.ptoHistory;
      if (u.bankInfo !== undefined)   u._bankInfo   = u.bankInfo;
      if (u.teamLeaves !== undefined) u._teamLeaves = u.teamLeaves;
      // Load all contractors - normalize roles
      if (u.allContractors !== undefined && u.allContractors.length > 0) {
        setContractors(u.allContractors.map(c=>({...c, role:normalizeRoleStr(c.role)})));
      }
      // For contractors: load teammates so team calendar works correctly
      if (u.teammates !== undefined && u.teammates.length > 0 && !(u.allContractors && u.allContractors.length > 0)) {
        setContractors(u.teammates);
      }
      // Load payslips immediately on login
      if (u.payslips !== undefined) setPayslips(u.payslips||[]);
      // Load ALL payslips for admin/superadmin
      if (u.allPayslips !== undefined && u.allPayslips.length > 0) setPayslips(u.allPayslips);
      // Load admin perms from Sheet - normalize keys to lowercase
      if (u.adminPerms && Object.keys(u.adminPerms).length > 0) {
        const normalizedPerms = {};
        Object.keys(u.adminPerms).forEach(k => {
          normalizedPerms[k.toLowerCase()] = u.adminPerms[k];
        });
        updatePerms(()=>normalizedPerms);
      }
    }
    try { 
      localStorage.setItem("eg_session", JSON.stringify(u));
      // Also save credentials separately for re-fetch on refresh
      if (u._username) localStorage.setItem("eg_un", u._username);
      if (u._password) localStorage.setItem("eg_pw", u._password);
    } catch(e) {}
    setCurrentUser(u);
    setPage(normalizeRoleStr(u.role||u.profile&&u.profile.role)==="contractor"?"c-dashboard":"a-overview");
  };

  const logout = () => { try { localStorage.removeItem("eg_session"); localStorage.removeItem("eg_un"); localStorage.removeItem("eg_pw"); } catch(e) {} setCurrentUser(null); setPage("c-dashboard"); setChPwOpen(false); };

  if (!currentUser) return <LoginScreen onLogin={login}/>;

  const _nr = normalizeRoleStr(currentUser.role); const isContractor = _nr!=="superadmin" && _nr!=="admin";
  // For live data, build contractor object from profile
  const liveContractor = currentUser.profile ? {
    username:       currentUser._username,
    name:           currentUser.profile.name,
    position:       currentUser.profile.position,
    client:         currentUser.profile.client,
    tier:           currentUser.profile.tier,
    rate:           currentUser.profile.rate,
    startDate:      currentUser.profile.startDate,
    email:          currentUser.profile.email,
    supervisor:     currentUser.profile.supervisor||"",
    dob:            currentUser.profile.dob||"",
    status:         currentUser.profile.status,
    role:           currentUser.profile.role||"contractor",
    photoUrl:       currentUser.profile.photoUrl||"",
    contractType:   currentUser.profile.contractType||"",
    addrStreet:     currentUser.profile.addrStreet||"",
    addrCity:       currentUser.profile.addrCity||"",
    addrProvince:   currentUser.profile.addrProvince||"",
    addrCountry:    currentUser.profile.addrCountry||"",
    addrZip:        currentUser.profile.addrZip||"",
    personalGmail:  currentUser.profile.personalGmail||"",
    vlAccrued:      currentUser.pto ? parseFloat(currentUser.pto.vlAccrued)||0 : 0,
    vlUsed:         currentUser.pto ? parseFloat(currentUser.pto.vlUsed)||0 : 0,
    vlPending:      currentUser.pto ? parseFloat(currentUser.pto.vlPending)||0 : 0,
    vlTotal:        currentUser.pto ? parseFloat(currentUser.pto.vlTotal)||160 : 160,
    vlMonthlyRate:  currentUser.pto ? parseFloat(currentUser.pto.vlMonthlyRate)||13.33 : 13.33,
    slTotal:        currentUser.pto ? parseFloat(currentUser.pto.slTotal)||40 : 40,
    slUsed:         currentUser.pto ? parseFloat(currentUser.pto.slUsed)||0 : 0,
    slPending:      currentUser.pto ? parseFloat(currentUser.pto.slPending)||0 : 0,
  } : null;
  const contractor = liveContractor || contractors.find(c=>c.username===currentUser._username) || contractors.find(c=>c.username===currentUser.username) || null;

  // Safety: if no contractor found, show loading with a logout escape hatch
  if (isContractor && !contractor) {
    return (
      <div style={{ minHeight:"100vh", background:C.navy, display:"flex", alignItems:"center", justifyContent:"center", fontFamily:"inherit", flexDirection:"column", gap:16 }}>
        <div style={{ color:"#fff", fontSize:16, fontWeight:600 }}>Loading your profile...</div>
        <div style={{ color:"rgba(255,255,255,0.5)", fontSize:12 }}>Taking too long?</div>
        <button onClick={logout} style={{ background:"rgba(255,255,255,0.12)", border:"1px solid rgba(255,255,255,0.2)", borderRadius:8, padding:"8px 20px", color:"#fff", fontSize:13, cursor:"pointer", fontFamily:"inherit" }}>
          Back to Login
        </button>
      </div>
    );
  }

  const contractorPages = {
    "c-dashboard":     <CDashboard    user={currentUser} contractor={contractor} leaves={leaves} setPage={setPage}/>,
    "c-profile":       <CProfile      contractor={contractor} setContractors={setContractors} currentUser={currentUser} setCurrentUser={setCurrentUser}/>,
    "c-payslips":      <CPayslips     user={currentUser}/>,
    "c-pto":           <CPTOPage      contractor={contractor} setPage={setPage} leaves={leaves} ptoHistory={currentUser._ptoHistory||[]}/>,
    "c-leave":         <CLeave        user={currentUser} contractor={contractor} leaves={leaves} setLeaves={setLeaves} setContractors={setContractors} onContractorNotify={addNotification}/>,
    "c-announcements": <CAnnouncements announcements={announcements}/>,
    "c-calendar":      <CLeaveCalendar contractor={contractor} leaves={leaves} contractors={contractors} teamLeaves={currentUser._teamLeaves||[]}/>,
  };

  const adminPages = {
    "a-overview":  <AOverview       user={currentUser} contractors={contractors} leaves={leaves} perms={perms} setPage={setPage} announcements={announcements}/>,
    "a-team":      <ATeam           user={currentUser} contractors={contractors} setContractors={setContractors} perms={perms} rateHistory={rateHistory} setRateHistory={setRateHistory}/>,
    "a-leave":     <ALeaveApprovals user={currentUser} leaves={leaves} setLeaves={setLeaves} setContractors={setContractors} contractors={contractors} perms={perms} onNotify={addNotification}/>,
    "a-pto":       <APTOManagement  user={currentUser} contractors={contractors} setContractors={setContractors} auditLog={auditLog} setAuditLog={setAuditLog} perms={perms}/>,
    "a-announce":  <AAnnouncements  user={currentUser} announcements={announcements} setAnnouncements={setAnnouncements}/>,
    "a-clients":   <AClients        user={currentUser} contractors={contractors} clients={clients} setClients={setClients}/>,
    "a-email":     <AEmailBlast     user={currentUser} contractors={contractors} perms={perms}/>,
    "a-audit":     <AAuditLog       auditLog={auditLog}/>,
    "a-roles":     <ARolesAccess    user={currentUser} contractors={contractors} setContractors={setContractors} perms={perms} setPerms={setPerms} updatePerms={updatePerms}/>,
    "a-payslips":  <APayslips       user={currentUser} contractors={contractors} payslips={payslips} setPayslips={setPayslips} perms={perms}/>,
    "a-calendar":     <ALeaveCalendar    user={currentUser} contractors={contractors} leaves={leaves} perms={perms}/>,
    "a-hr-calendar":  <AHRCalendar       contractors={contractors}/>,
    "a-payroll":      <APayrollSummary   payslips={payslips} contractors={contractors} perms={perms} user={currentUser}/>,
  };

  return (
    <ToastProvider>
      <div style={{ minHeight:"100vh", background:C.bg, fontFamily:"'Inter',sans-serif", color:C.text, display:"flex" }}>
        {isContractor
          ? <ContractorNav page={page} setPage={setPage} user={currentUser} onLogout={logout} onChPw={()=>setChPwOpen(true)} notifications={notifications} onClearNotifs={clearNotifs} onMarkRead={markRead}/>
          : <AdminNav      page={page} setPage={setPage} user={currentUser} onLogout={logout} notifications={notifications} onClearNotifs={clearNotifs} onMarkRead={markRead}/>
        }
        <div style={{ marginLeft:240, flex:1, minHeight:"100vh", display:"flex", flexDirection:"column" }}>
          <div style={{ position:"sticky", top:0, zIndex:40, background:"rgba(247,249,251,0.95)", backdropFilter:"blur(8px)", borderBottom:`1px solid ${C.border}`, padding:"10px 24px", display:"flex", justifyContent:"flex-end", alignItems:"center" }}>
            <TopBarBell notifications={notifications} onClear={clearNotifs} onMarkRead={markRead}/>
          </div>
          <div style={{ flex:1, overflowY:"auto" }}>
            <PageWrapper pageKey={page}>
              {isContractor?(contractorPages[page]||contractorPages["c-dashboard"]):(adminPages[page]||adminPages["a-overview"])}
            </PageWrapper>
          </div>
        </div>
        {chPwOpen&&<ChangePwModal user={currentUser} onClose={()=>setChPwOpen(false)}/>}
        {showTimeoutWarning && (
          <div style={{ position:"fixed", inset:0, background:"rgba(27,42,74,0.7)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:500, padding:16 }}>
            <div style={{ background:"#fff", borderRadius:16, padding:36, maxWidth:380, width:"100%", textAlign:"center", boxShadow:"0 24px 80px rgba(0,0,0,0.3)" }}>
              <div style={{ fontSize:36, marginBottom:12 }}>⏱</div>
              <div style={{ fontSize:18, fontWeight:800, color:C.navy, marginBottom:8 }}>Still there?</div>
              <div style={{ fontSize:14, color:C.muted, marginBottom:24, lineHeight:1.6 }}>You will be logged out in <b style={{ color:C.red }}>1 minute</b> due to inactivity.</div>
              <Btn onClick={()=>{ setShowTimeoutWarning(false); resetTimer(); }} style={{ width:"100%", padding:13, fontSize:15, marginBottom:10 }}>Stay Logged In</Btn>
              <Btn variant="secondary" onClick={logout} style={{ width:"100%", padding:12 }}>Log Out Now</Btn>
            </div>
          </div>
        )}
      </div>
    </ToastProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(ErrorBoundary, null, React.createElement(App)));
</script>
