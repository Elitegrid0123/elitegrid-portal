<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; }
  body { font-family: 'Inter', 'Segoe UI', sans-serif; background: #F7F9FB; min-height: 100vh; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #D6E4F0; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #B0C8E0; }
  #root { min-height: 100vh; }
  select, input, textarea, button { font-family: inherit; }
  @keyframes pageEnter { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  .page-enter { animation: pageEnter 0.28s cubic-bezier(0.22,1,0.36,1) both; }
  @keyframes toastIn  { from { opacity:0; transform:translateX(110%); } to { opacity:1; transform:translateX(0); } }
  @keyframes toastOut { from { opacity:1; transform:translateX(0); } to { opacity:0; transform:translateX(110%); } }
  .toast-enter { animation: toastIn  0.32s cubic-bezier(0.22,1,0.36,1) both; }
  .toast-leave { animation: toastOut 0.25s ease-in both; }
  .card-lift { transition: transform 0.18s ease, box-shadow 0.18s ease; }
  .card-lift:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(27,42,74,0.13) !important; }
  .btn-anim { transition: transform 0.1s ease, opacity 0.1s ease !important; }
  .btn-anim:active:not(:disabled) { transform: scale(0.96) !important; }
  .tr-hover { transition: background 0.15s ease; }
  .tr-hover:hover { background: #F0F6FF !important; }

function callScript(action, params, onSuccess, onError) {
  params = params || {};
  let qs = "action=" + encodeURIComponent(action);
  Object.keys(params).forEach(k => {
    qs += "&" + encodeURIComponent(k) + "=" + encodeURIComponent(params[k]);
  });

  const runJSONP = () => {
    const cbName = "_cb_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
    const timeout = setTimeout(() => {
      delete window[cbName];
      const el = document.getElementById(cbName);
      if (el) el.remove();
      if (onError) onError("timeout");
    }, action === "uploadPhoto" ? 60000 : 20000);
    window[cbName] = (data) => {
      clearTimeout(timeout);
      delete window[cbName];
      const el = document.getElementById(cbName);
      if (el) el.remove();
      if (onSuccess) onSuccess(data);
    };
    const script = document.createElement("script");
    script.id = cbName;
    script.src = APPS_SCRIPT_URL + "?" + qs + "&callback=" + cbName;
    script.onerror = () => {
      clearTimeout(timeout);
      delete window[cbName];
      script.remove();
      if (onError) onError("script_error");
    };
    document.head.appendChild(script);
  };

  // Photo uploads are large and Apps Script does not return CORS headers reliably.
  // Use JSONP directly so the upload is not executed once by fetch and then again by fallback.
  if (action === "uploadPhoto") {
    runJSONP();
    return;
  }

  fetch(APPS_SCRIPT_URL + "?" + qs, {
    method: "GET",
    redirect: "follow",
    mode: "cors",
    credentials: "omit",
    headers: { "Content-Type": "text/plain" }
  })
    .then(r => r.json())
    .then(json => { if (onSuccess) onSuccess(json); })
    .catch(runJSONP);
}

};

const formatPHTTime = (date, opts) => {
  const d = date instanceof Date ? date : new Date(date);
  return d.toLocaleString("en-PH", { timeZone:"Asia/Manila", ...opts });
};

const todayPHT = () => {
  const d = nowPHT();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
};

const fmtCur = (v) => {
  if (v === null || v === undefined || v === "") return "-";
  // Handle raw numbers from Sheet (e.g. 10 instead of "$10.00")
  if (typeof v === "number") return v < 0 ? "($"+Math.abs(v).toFixed(2)+")" : "$"+v.toFixed(2);
  const n = parseFloat(String(v).replace(/[^0-9.-]/g,""));
  if (isNaN(n)) return "-";
  return (n<0?"($"+Math.abs(n).toFixed(2)+")":"$"+n.toFixed(2));
};

// Format rate: "7" → "$7.00", "$7/hr" → "$7.00/hr", "1500" → "$1,500.00"
const fmtRate = (v) => {
  if (!v) return "-";
  const s = String(v).trim();
  const numMatch = s.match(/([\d,]+\.?\d*)/);
  if (!numMatch) return s;
  const num = parseFloat(numMatch[1].replace(/,/g,""));
  if (isNaN(num)) return s;
  const suffix = s.replace(/^[\s$]*[\d,]+\.?\d*/, "").trim();
  return "$" + num.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}) + (suffix?suffix:"");
};

// Robustly format any date value (ISO string, Apps Script date serial, or already-formatted string)
const fmtRelease = (v) => {
  if (!v || v === "") return "-";
  const s = String(v).trim();
  // Already formatted like "Jun 5, 2025" — return as is
  if (/^[A-Za-z]{3}\s+\d{1,2},\s*\d{4}$/.test(s)) return s;
  // Try parsing as a date
  try {
    const d = new Date(s);
    if (!isNaN(d.getTime()) && d.getFullYear() > 2000) {
      return d.toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" });
    }
  } catch(e) {}
  return s;
};

const isAdmin      = (r) => r==="admin"||r==="Admin"||isSuperAdmin(r);

const normalizeRoleStr = (r) => {
  if (!r) return "contractor";
  const v = String(r).trim().toLowerCase().replace(/\s+/g,"");
  if (v==="superadmin") return "superadmin";
  if (v==="admin") return "admin";
  return "contractor";
};

const getVisible = (user, contractors, perms) => {
  const role = normalizeRoleStr(user.role);
  if (role === "superadmin") return contractors;
  const uname = (user.username || user._username || "").toLowerCase();
  // Try all perm keys case-insensitively
  const permKey = Object.keys(perms).find(k => k.toLowerCase() === uname);
  const p = permKey ? perms[permKey] : null;
  // If no perms assigned yet, show nothing - admin must be given access first
  if (!p || !p.assignedClients || p.assignedClients.length === 0) return [];
  return contractors.filter(c => p.assignedClients.includes(c.client));
};

const workingDays = (start, end) => {
  let days = 0, cur = new Date(start), e = new Date(end);
  while (cur <= e) { if (cur.getDay() !== 0 && cur.getDay() !== 6) days++; cur.setDate(cur.getDate()+1); }
  return days;
};

// ── PHOTO UPLOAD COMPONENT ────────────────────────────────
function PhotoUpload({ currentUrl, onSave, onClose, username }) {
  const [tab,      setTab]      = useState("upload");
  const [url,      setUrl]      = useState(currentUrl&&!currentUrl.startsWith("data:")?currentUrl:"");
  const [preview,  setPreview]  = useState(currentUrl||"");
  const [b64,      setB64]      = useState("");
  const [mimeType, setMimeType] = useState("image/jpeg");
  const [uploading,setUploading]= useState(false);
  const [err,      setErr]      = useState("");
  const fileRef = useRef();

  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith("image/")) { setErr("Please select an image file."); return; }
    if (file.size > 8*1024*1024) { setErr("Image must be under 8MB."); return; }
    setErr("Preparing photo...");

    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const maxSide = 420;
        let w = img.width;
        let h = img.height;
        const scale = Math.min(1, maxSide / Math.max(w, h));
        w = Math.max(1, Math.round(w * scale));
        h = Math.max(1, Math.round(h * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        const compressed = canvas.toDataURL("image/jpeg", 0.72);
        setMimeType("image/jpeg");
        setB64(compressed);
        setPreview(compressed);
        setErr("");
      };
      img.onerror = () => setErr("Could not read this image. Please try another file.");
      img.src = ev.target.result;
    };
    reader.onerror = () => setErr("Could not read this image. Please try again.");
    reader.readAsDataURL(file);
  };

  const handleUrl = (v) => { setUrl(v); setPreview(v); setB64(""); setErr(""); };

  const save = () => {
    if (tab === "upload") {
      if (!b64) { setErr("Please select a photo first."); return; }
      if (!DEMO_MODE && username) {
        // Upload to Google Drive via backend
        setUploading(true);
        callScript("uploadPhoto", { username, imageData:b64, mimeType }, (json) => {
          setUploading(false);
          if (json && json.success) {
            onSave(json.photoUrl);
            toast("Profile photo saved to Drive ✓");
          } else {
            setErr((json&&json.error)||"Upload failed. Please try again.");
          }
        }, () => { setUploading(false); setErr("Connection error. Please try again."); });
      } else {
        // Demo mode — save b64 locally
        onSave(b64);
      }
    } else {
      if (!url.trim()) { setErr("Please enter an image URL."); return; }
      if (!url.startsWith("http")) { setErr("URL must start with http or https."); return; }
      onSave(url.trim());
    }
  };

  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(27,42,74,0.65)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:300, padding:16 }} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{ background:"#fff", borderRadius:16, padding:32, width:"100%", maxWidth:440, boxShadow:"0 24px 80px rgba(0,0,0,0.3)" }}>
        <div style={{ fontSize:18, fontWeight:800, color:C.navy, marginBottom:6 }}>Profile Photo</div>

        {preview && (
          <div style={{ display:"flex", justifyContent:"center", marginBottom:20 }}>
            <img src={preview} alt="preview" style={{ width:100, height:100, borderRadius:"50%", objectFit:"cover", border:`3px solid ${C.cyan}` }} onError={()=>{setPreview("");setErr("Could not load image from that URL.");}}/>
          </div>
        )}

        <div style={{ display:"flex", gap:8, marginBottom:14 }}>
          {[["upload","Upload File"],["url","Use URL"]].map(([t,l]) => (
            <button key={t} onClick={()=>{ setTab(t); setErr(""); }}
              style={{ flex:1, padding:"8px", borderRadius:8, border:`1.5px solid ${tab===t?C.blue:C.border}`, background:tab===t?"#DBEAFE":"#fff", color:tab===t?C.blue:C.muted, fontSize:12, fontWeight:tab===t?700:500, cursor:"pointer", fontFamily:"inherit" }}>
              {l}
            </button>
          ))}
        </div>

        {tab === "upload" ? (
          <div style={{ marginBottom:14 }}>
            <div onClick={()=>fileRef.current.click()} style={{ border:`2px dashed ${C.border}`, borderRadius:10, padding:"24px 20px", textAlign:"center", cursor:"pointer" }}>
              <div style={{ fontSize:28, marginBottom:6 }}>📷</div>
              <div style={{ fontSize:13, color:C.muted }}>{b64?"Photo selected ✓ — click to change":"Click to choose a photo"}</div>
              <div style={{ fontSize:11, color:C.muted, marginTop:4 }}>JPG, PNG up to 5MB · Saved to Elite Grid Drive</div>
            </div>
            <input ref={fileRef} type="file" accept="image/*" onChange={handleFile} style={{ display:"none" }}/>
            {b64 && <div style={{ fontSize:11, color:C.green, marginTop:6, padding:"6px 10px", background:C.greenBg, borderRadius:6, lineHeight:1.5 }}>
              ✓ Photo ready — click Save to upload to Google Drive
            </div>}
          </div>
        ) : (
          <div style={{ marginBottom:14 }}>
            <FieldLabel>Image URL</FieldLabel>
            <FieldInput value={url} onChange={e=>handleUrl(e.target.value)} placeholder="https://drive.google.com/uc?id=..."/>
            <div style={{ fontSize:11, color:C.muted, marginTop:5, lineHeight:1.5 }}>Paste a direct link to your hosted photo.</div>
          </div>
        )}

        {err && <Alert type="error">{err}</Alert>}
        <div style={{ display:"flex", gap:10, marginTop:4 }}>
          <Btn onClick={save} disabled={uploading} style={{ flex:1, padding:11 }}>{uploading?"Uploading...":"Save Photo"}</Btn>
          <Btn variant="secondary" onClick={onClose} disabled={uploading} style={{ flex:1, padding:11 }}>Cancel</Btn>
        </div>
      </div>
    </div>
  );
}

function LoginScreen({ onLogin }) {
  const [u,setU]         = useState("");
  const [p,setP]         = useState("");
  const [err,setErr]     = useState("");
  const [loading,setLoading] = useState(false);

  const go = () => {
    if (!u||!p) { setErr("Please enter your username and password."); return; }
    setErr(""); setLoading(true);
    if (DEMO_MODE || !APPS_SCRIPT_URL || APPS_SCRIPT_URL === "YOUR_APPS_SCRIPT_URL_HERE") {
      setTimeout(() => {
        const found = DEMO_USERS.find(d => d.username===u.trim().toLowerCase() && d.password===p);
        if (found) onLogin({...found});
        else { setErr("Invalid username or password."); setLoading(false); }
      }, 600);
    } else {
      callScript("login", {username: u.trim(), password: p}, (json) => {
        if (json.success) {
          const userData = json.data;
          userData._username = u.trim().toLowerCase();
          userData._password = p;
          onLogin(userData);
        } else {
          setErr(json.error || "Invalid username or password.");
          setLoading(false);
        }
      }, (errType) => {
        if (errType === "timeout") {
          setErr("Request timed out. Check your internet and try again.");
        } else {
          setErr("Could not reach the server. Please try again in a moment.");
        }
        setLoading(false);
      });
    }
  };

  return (
    <div style={{ minHeight:"100vh", background:`linear-gradient(135deg,${C.navy} 0%,${C.navyLt} 40%,#1d3a6b 100%)`, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"24px 16px", fontFamily:"'Inter',sans-serif" }}>

        <Logo size={48}/>
        <div>
          <div style={{ color:"#fff", fontWeight:900, fontSize:20, letterSpacing:2 }}>ELITE GRID</div>
          <div style={{ color:C.cyan, fontSize:10, letterSpacing:3, fontWeight:600 }}>TEAM PORTAL</div>
        </div>
      </div>
      <div style={{ background:"#fff", borderRadius:16, padding:"40px 36px", width:"100%", maxWidth:420, boxShadow:"0 24px 80px rgba(0,0,0,0.35)" }}>
        <div style={{ fontSize:22, fontWeight:800, color:C.navy, marginBottom:6 }}>Sign In</div>
        <div style={{ fontSize:14, color:C.muted, marginBottom:28, lineHeight:1.6 }}>Access your profile, payslips, and leave records.</div>
        <FieldLabel>Username</FieldLabel>
        <FieldInput value={u} onChange={e=>setU(e.target.value)} placeholder="e.g. jdelacruz" style={{ marginBottom:16 }}/>
        <FieldLabel>Password</FieldLabel>
        <PasswordInput value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} placeholder="Your password" style={{ marginBottom:err?8:18 }}/>
        {err && <Alert type="error">{err}</Alert>}
        <Btn onClick={go} disabled={loading} style={{ width:"100%", padding:13, fontSize:15 }}>{loading?"Signing in...":"Sign In"}</Btn>

      </div>
    </div>
  );
}

// ── TOAST SYSTEM ─────────────────────────────────────────────────────
var _toastFn = null;
function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const add = useCallback(function(msg, type) {
    if (!type) type = "success";
    var id = Date.now() + Math.random();
    setToasts(function(prev) { return prev.concat([{ id:id, msg:msg, type:type, out:false }]); });
    setTimeout(function() {
      setToasts(function(prev) { return prev.map(function(t){ return t.id===id ? Object.assign({},t,{out:true}) : t; }); });
      setTimeout(function() {
        setToasts(function(prev) { return prev.filter(function(t){ return t.id!==id; }); });
      }, 280);
    }, 3400);
  }, []);
  _toastFn = add;
  var icons = { success:"✓", error:"✕", info:"ℹ" };
  var colors = {
    success:{ bg:"#ECFDF5", border:"#86EFAC", txt:"#166534", icon:"#16A34A" },
    error:  { bg:"#FEF2F2", border:"#FECACA", txt:"#991B1B", icon:"#DC2626" },
    info:   { bg:"#EFF6FF", border:"#BFDBFE", txt:"#1E40AF", icon:"#2563EB" },
  };
  return (
    <React.Fragment>
      {children}
      {toasts.length > 0 && (
        <div style={{ position:"fixed", top:58, right:20, zIndex:9999, display:"flex", flexDirection:"column", gap:10, pointerEvents:"none" }}>
          {toasts.map(function(t) {
            var s = colors[t.type] || colors.success;
            return (
              <div key={t.id} className={t.out ? "toast-leave" : "toast-enter"}
                style={{ background:s.bg, border:"1.5px solid "+s.border, borderRadius:12, padding:"12px 18px", minWidth:280, maxWidth:360, display:"flex", alignItems:"flex-start", gap:12, boxShadow:"0 4px 20px rgba(0,0,0,0.12)", pointerEvents:"auto" }}>
                <div style={{ width:22, height:22, borderRadius:"50%", background:s.icon, color:"#fff", display:"flex", alignItems:"center", justifyContent:"center", fontSize:12, fontWeight:800, flexShrink:0, marginTop:1 }}>{icons[t.type]}</div>
                <div style={{ fontSize:13, fontWeight:600, color:s.txt, lineHeight:1.5 }}>{t.msg}</div>
              </div>
            );
          })}
        </div>
      )}
    </React.Fragment>
  );
}
function toast(msg, type) { if (_toastFn) _toastFn(msg, type || "success"); }

// ── CHANGE PASSWORD ───────────────────────────────────────
function ChangePwModal({ user, onClose }) {
  const [cur,setCur]       = useState("");
  const [nw,setNw]         = useState("");
  const [conf,setConf]     = useState("");
  const [err,setErr]       = useState("");
  const [ok,setOk]         = useState(false);
  const [loading,setLoading] = useState(false);
  const strength = nw.length===0?null:nw.length<6?"weak":nw.length<10?"fair":"strong";
  const sColor = { weak:C.red, fair:C.amber, strong:C.green }[strength]||C.border;
  const submit = () => {
    setErr("");
    if (!cur||!nw||!conf)        { setErr("Please fill in all fields."); return; }
    const storedPw = user._password || user.password || "";
    if (cur!==storedPw)          { setErr("Current password is incorrect."); return; }
    if (nw.length<6)             { setErr("New password must be at least 6 characters."); return; }
    if (nw!==conf)               { setErr("New passwords do not match."); return; }
    if (nw===cur)                { setErr("Must be different from current password."); return; }
    setLoading(true);
    if (!DEMO_MODE) {
      callScript("changePassword", { username:user._username||user.username, currentPassword:cur, newPassword:nw }, (json) => {
        if (json && json.success) {
          user._password = nw; user.password = nw;
          setOk(true); setLoading(false);
          toast("Password updated successfully ✓");
          setTimeout(onClose, 2000);
        } else {
          setErr((json&&json.error)||"Failed to update. Please try again."); setLoading(false);
        }
      }, () => { setErr("Connection error. Please try again."); setLoading(false); });
    } else {
      setTimeout(()=>{ user._password=nw; user.password=nw; setOk(true); setLoading(false); toast("Password updated successfully ✓"); setTimeout(onClose,2000); },700);
    }
  };
  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(27,42,74,0.65)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:300, padding:16 }} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{ background:"#fff", borderRadius:16, padding:32, width:"100%", maxWidth:420, boxShadow:"0 24px 80px rgba(0,0,0,0.3)" }}>
        <div style={{ fontSize:18, fontWeight:800, color:C.navy, marginBottom:6 }}>Change Password</div>
        <div style={{ fontSize:13, color:C.muted, marginBottom:24, lineHeight:1.5 }}>Enter your current password, then choose a new one.</div>
        {ok  && <Alert type="success">Password changed successfully!</Alert>}
        {err && <Alert type="error">{err}</Alert>}
        {[["Current Password",cur,setCur,"Your current password"],["New Password",nw,setNw,"At least 6 characters"],["Confirm New Password",conf,setConf,"Repeat new password"]].map(([label,val,setter,ph],i) => (
          <div key={label}>
            <FieldLabel>{label}</FieldLabel>
            <PasswordInput value={val} onChange={e=>setter(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} placeholder={ph} style={{ marginBottom:i===1?6:16 }}/>
            {i===1 && <div style={{ height:4, borderRadius:4, background:strength?sColor:C.border, marginBottom:16, width:strength?({weak:"33%",fair:"66%",strong:"100%"}[strength]):"100%", transition:"all 0.3s" }}/>}
          </div>
        ))}
        <Btn onClick={submit} disabled={loading||ok} style={{ width:"100%", padding:13, fontSize:15, marginBottom:8 }}>{loading?"Updating...":ok?"Updated!":"Update Password"}</Btn>
        <Btn variant="secondary" onClick={onClose} style={{ width:"100%", padding:12 }}>Cancel</Btn>
      </div>
    </div>
  );
}

const DOC_CATEGORIES = ["201 File","Evaluation","Contract","ID","Certificate","Other"];

function ContractorDocs({ contractor, user, canManage }) {
  const [docs,     setDocs]     = useState([]);
  const [loading,  setLoading]  = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [form,     setForm]     = useState({ docName:"", category:"201 File", driveLink:"", expiryDate:"" });
  const [err,      setErr]      = useState("");
  const [ok,       setOk]       = useState("");
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  // Load docs on mount
  React.useEffect(() => {
    if (!contractor || DEMO_MODE) { setLoading(false); return; }
    callScript("getDocs", {username: contractor.username}, (json) => {
      if (json && json.success) setDocs(Array.isArray(json.docs) ? json.docs : []);
      setLoading(false);
    }, () => setLoading(false));
  }, [contractor && contractor.username]);

  const addDoc = () => {
    setErr("");
    if (!form.docName.trim()) { setErr("Document name is required."); return; }
    if (!form.driveLink.trim()) { setErr("Google Drive link is required."); return; }
    if (!form.driveLink.startsWith("http")) { setErr("Please enter a valid URL starting with http."); return; }
    const entry = {
      docId:     "DOC-" + Date.now(),
      username:  contractor.username,
      docName:   form.docName,
      category:  form.category,
      driveLink: form.driveLink,
      dateAdded: formatPHT(nowPHT(),{month:"short",day:"numeric",year:"numeric"}),
      uploadedBy: user.name || user._username,
    };
    if (!DEMO_MODE) {
      callScript("addDoc", entry, (json) => {
        if (json.success) {
          setDocs(prev=>[entry,...prev]);
          setForm({ docName:"", category:"201 File", driveLink:"" });
          setShowForm(false);
          setOk("Document added successfully.");
          setTimeout(()=>setOk(""),3000);
        } else {
          setErr(json.error||"Failed to save.");
        }
      }, ()=>setErr("Connection error. Try again."));
    } else {
      setDocs(prev=>[entry,...prev]);
      setForm({ docName:"", category:"201 File", driveLink:"" });
      setShowForm(false);
      setOk("Document added. (Demo)");
      setTimeout(()=>setOk(""),3000);
    }
  };

  const deleteDoc = (docId) => {
    if (!window.confirm("Remove this document?")) return;
    if (!DEMO_MODE) callScript("deleteDoc", {docId}, ()=>{}, ()=>{});
    setDocs(prev=>prev.filter(d=>d.docId!==docId));
  };

  const catColor = { "201 File":C.navy, "Evaluation":C.blue, "Contract":C.cyan, "ID":C.blueDk, "Certificate":C.green, "Other":C.muted };

  return (
    <div style={{ marginTop:24 }}>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:16 }}>
        <div style={{ fontSize:15, fontWeight:700, color:C.navy }}>Documents</div>
        {canManage && <Btn onClick={()=>{ setShowForm(!showForm); setErr(""); }} style={{ padding:"7px 16px", fontSize:12 }}>+ Add Document</Btn>}
      </div>

      {ok && <Alert type="success">{ok}</Alert>}

      {showForm && canManage && (
        <div style={{ background:C.off, borderRadius:10, padding:16, marginBottom:16 }}>
          {err && <Alert type="error">{err}</Alert>}
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))", gap:12, marginBottom:12 }}>
            <div>
              <FieldLabel required>Document Name</FieldLabel>
              <FieldInput value={form.docName} onChange={e=>set("docName",e.target.value)} placeholder="e.g. Resume, NBI Clearance"/>
            </div>
            <div>
              <FieldLabel>Category</FieldLabel>
              <select value={form.category} onChange={e=>set("category",e.target.value)}
                style={{ width:"100%", padding:"10px 13px", borderRadius:8, border:`1.5px solid ${C.border}`, fontSize:14, fontFamily:"inherit", outline:"none", background:"#fff" }}>
                {DOC_CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div style={{ gridColumn:"1 / -1" }}>
              <FieldLabel required>Google Drive Link</FieldLabel>
              <FieldInput value={form.driveLink} onChange={e=>set("driveLink",e.target.value)} placeholder="https://drive.google.com/file/d/..."/>
            </div>
          </div>
          <div style={{ display:"flex", gap:10 }}>
            <Btn onClick={addDoc} style={{ padding:"8px 20px" }}>Save</Btn>
            <Btn variant="secondary" onClick={()=>{ setShowForm(false); setErr(""); }} style={{ padding:"8px 20px" }}>Cancel</Btn>
          </div>
        </div>
      )}

      {loading
        ? <div style={{ color:C.muted, fontSize:13, padding:"12px 0" }}>Loading documents...</div>
        : (!Array.isArray(docs) || docs.length===0)
          ? <div style={{ color:C.muted, fontSize:13, padding:"12px 0", fontStyle:"italic" }}>No documents on file yet.</div>
          : <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
              {docs.filter(Boolean).map(d=>(
                <div key={d.docId || d.driveLink || d.docName} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 14px", background:"#fff", borderRadius:8, border:`1px solid ${C.border}`, gap:10, flexWrap:"wrap" }}>
                  <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                    <span style={{ background:catColor[d.category]||C.muted, color:"#fff", fontSize:10, fontWeight:700, padding:"2px 9px", borderRadius:20, whiteSpace:"nowrap" }}>{d.category}</span>
                    <div>
                      <a href={d.driveLink} target="_blank" rel="noopener noreferrer"
                        style={{ fontSize:13, fontWeight:600, color:C.blue, textDecoration:"none" }}>
                        {d.docName}
                      </a>
                      <div style={{ fontSize:11, color:C.muted, marginTop:1 }}>Added {d.dateAdded} by {d.uploadedBy}</div>
                    </div>
                  </div>
                  <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                    <a href={d.driveLink} target="_blank" rel="noopener noreferrer"
                      style={{ background:C.off, border:`1px solid ${C.border}`, borderRadius:6, padding:"4px 10px", fontSize:11, color:C.blue, fontWeight:600, cursor:"pointer", textDecoration:"none" }}>
                      Open
                    </a>
                    {canManage && (
                      <button onClick={()=>deleteDoc(d.docId)}
                        style={{ background:C.redBg, border:"1px solid #FECACA", borderRadius:6, padding:"4px 10px", fontSize:11, color:C.red, fontWeight:600, cursor:"pointer" }}>
                        Remove
                      </button>
                    )}
                  </div>
                </div>
              ))}
            </div>
      }
    </div>
  );
}

function CProfile({ contractor, setContractors, currentUser, setCurrentUser }) {
  const [photoModal,    setPhotoModal]    = useState(false);
  const [chPw,          setChPw]          = useState(false);
  const [editPersonal,  setEditPersonal]  = useState(false);
  const [bankModal,     setBankModal]     = useState(false);
  const [personalForm,  setPersonalForm]  = useState({});
  const [bankForm,      setBankForm]      = useState({});
  const [personalErr,   setPersonalErr]   = useState("");
  const [bankErr,       setBankErr]       = useState("");
  const [savingPersonal,setSavingPersonal]= useState(false);
  const [savingBank,    setSavingBank]    = useState(false);

  // Guard AFTER hooks (Rules of Hooks: no hooks after early return)
  const c = contractor;
  if (!c) return null;

  const initials  = c.name ? String(c.name).split(" ").map(n=>n[0]).join("").slice(0,2).toUpperCase() : "?";
  const bankInfoRaw = currentUser && currentUser._bankInfo;
  const bankInfo  = (bankInfoRaw && typeof bankInfoRaw === "object" && !Array.isArray(bankInfoRaw)) ? bankInfoRaw : {};
  const payslipsRaw = currentUser && currentUser._payslips;
  const payslips  = Array.isArray(payslipsRaw) ? payslipsRaw : [];
  const myUn      = String((currentUser&&(currentUser._username||currentUser.username))||"").toLowerCase();
  const mySlips   = payslips.filter(p=>p && (!p.username||String(p.username).toLowerCase()===myUn));

  // Tenure calculation
  const calcTenure = (sd) => {
    if (!sd) return "—";
    const start = new Date(sd);
    if (isNaN(start.getTime())) return sd;
    const now   = new Date();
    let yrs  = now.getFullYear() - start.getFullYear();
    let mons = now.getMonth()    - start.getMonth();
    if (mons < 0) { yrs--; mons += 12; }
    if (yrs === 0) return mons + " mo";
    return yrs + " yr" + (yrs!==1?"s":"") + (mons>0?" "+mons+" mo":"");
  };

  const savePhoto = (url) => {
    setContractors(prev=>prev.map(ct=>ct.username===c.username?{...ct,photoUrl:url}:ct));
    if (!DEMO_MODE) callScript("updateContractor",{username:c.username,photoUrl:url},()=>{},()=>{});
    setPhotoModal(false);
    toast("Profile photo updated ✓");
  };

  const openPersonal = () => {
    // c comes from liveContractor (currentUser.profile) which is now kept up-to-date after saves
    setPersonalForm({
      dob:          c.dob||"",
      personalGmail:c.personalGmail||"",
      addrStreet:   c.addrStreet||"",
      addrCity:     c.addrCity||"",
      addrProvince: c.addrProvince||"",
      addrCountry:  c.addrCountry||"",
      addrZip:      c.addrZip||"",
    });
    setPersonalErr("");
    setEditPersonal(true);
  };

  const savePersonal = () => {
    if (personalForm.personalGmail && personalForm.personalGmail.trim() !== "") {
      if (!personalForm.personalGmail.trim().toLowerCase().endsWith("@gmail.com")) {
        setPersonalErr("Personal email must be a valid @gmail.com address."); return;
      }
    }
    setSavingPersonal(true);
    const updates = { username:c.username, ...personalForm };
    const applyUpdates = () => {
      // Update contractors state (for admin/team views)
      setContractors(prev=>prev.map(ct=>ct.username===c.username?{...ct,...personalForm}:ct));
      // CRITICAL: also update currentUser.profile so re-opening the modal shows saved values
      if (setCurrentUser) {
        setCurrentUser(prev => ({
          ...prev,
          profile: prev.profile ? { ...prev.profile, ...personalForm } : prev.profile
        }));
      }
      setSavingPersonal(false);
      setEditPersonal(false);
      toast("Personal info saved ✓");
    };
    if (!DEMO_MODE) {
      callScript("updateContractor", updates, applyUpdates,
        () => { setPersonalErr("Failed to save. Try again."); setSavingPersonal(false); });
    } else {
      applyUpdates();
    }
  };

  const openBank = () => {
    const PH_BANKS = ["1st Valley Bank","AllBank","Asia United Bank (AUB)","Bank of Commerce","Bank of the Philippine Islands (BPI)","BDO Unibank","BPI Direct BanKo","China Banking Corporation (Chinabank)","CIMB Bank Philippines","Citibank Philippines","CTBC Bank Philippines","Development Bank of the Philippines (DBP)","Dungganon Bank","EastWest Bank","Enterprise Bank","GCash (G-Xchange Inc.)","GoTyme Bank","HSBC Philippines","ING Bank Philippines","Land Bank of the Philippines","Maybank Philippines","Metrobank","OFBank (Overseas Filipino Bank)","PayMaya / Maya Bank","PBB (Philippine Business Bank)","Philippine Bank of Communications (PBCom)","Philippine National Bank (PNB)","Producers Savings Bank","PSBank (Philippine Savings Bank)","RCBC (Rizal Commercial Banking Corporation)","Robinsons Bank","Rural Bank of Batangas","SB Finance","SeaBank Philippines","Security Bank","Standard Chartered Philippines","Sterling Bank of Asia","Tonik Digital Bank","UnionBank of the Philippines","Wealth Development Bank"];
    const existing = bankInfo.bankName||"";
    const preset = PH_BANKS.includes(existing) ? existing : (existing ? "__manual__" : "");
    setBankForm({
      bankName:     existing,
      accountNumber:bankInfo.accountNumber||"",
      swiftCode:    bankInfo.swiftCode||"",
      wiseEmail:    bankInfo.wiseEmail||"",
      payoutMethod: bankInfo.payoutMethod||"Wise",
      _bankPreset:  preset,
    });
    setBankErr("");
    setBankModal(true);
  };

  const saveBank = () => {
    if (!String(bankForm.bankName||"").trim())     { setBankErr("Bank name is required."); return; }
    if (!String(bankForm.accountNumber||"").trim()){ setBankErr("Account number is required."); return; }
    if (!bankForm.payoutMethod)        { setBankErr("Payout method is required."); return; }
    setSavingBank(true);
    const payload = { username:c.username, ...bankForm };
    if (!DEMO_MODE) {
      callScript("saveBankInfo", payload, () => {
        if (setCurrentUser) setCurrentUser(prev=>({...prev, _bankInfo:{...bankForm}}));
        setSavingBank(false); setBankModal(false);
        toast("Payment info saved ✓");
      }, () => { setBankErr("Failed to save. Try again."); setSavingBank(false); });
    } else {
      if (setCurrentUser) setCurrentUser(prev=>({...prev, _bankInfo:{...bankForm}}));
      setSavingBank(false); setBankModal(false);
      toast("Payment info saved ✓");
    }
  };

  const sp = (k,v) => setPersonalForm(f=>({...f,[k]:v}));
  const sb = (k,v) => setBankForm(f=>({...f,[k]:v}));

  const fieldStyle = { padding:"10px 0", borderBottom:`1px solid ${C.border}` };
  const labelStyle = { fontSize:11, fontWeight:700, color:C.muted, textTransform:"uppercase", letterSpacing:"0.6px", marginBottom:3 };
  const valStyle   = { fontSize:14, fontWeight:500, color:C.navy };
  const mutedVal   = { fontSize:13, color:C.muted, fontStyle:"italic" };

  const SectionCard = ({icon, title, action, children}) => (
    <div style={{ background:"#fff", borderRadius:12, border:`1px solid ${C.border}`, overflow:"hidden", marginBottom:14 }}>
      <div style={{ padding:"14px 18px 10px", display:"flex", alignItems:"center", justifyContent:"space-between", borderBottom:`1px solid ${C.border}` }}>
        <div style={{ fontSize:12, fontWeight:700, color:C.muted, textTransform:"uppercase", letterSpacing:"0.6px", display:"flex", alignItems:"center", gap:7 }}>
          <span>{icon}</span>{title}
        </div>
        {action}
      </div>
      {children}
    </div>
  );

  const LockBadge = () => (
    <span style={{ fontSize:11, color:C.muted, display:"flex", alignItems:"center", gap:4 }}>🔒 Admin edits only</span>
  );

  const tiers = { LAUNCH:"Starter", ANCHOR:"Core Team", ELEVATE:"Senior/Specialist" };
  const fullAddr = [c.addrStreet, c.addrCity, c.addrProvince, c.addrCountry, c.addrZip].filter(Boolean).join(", ");

  return (
    <div style={{ padding:"28px 20px", maxWidth:900, margin:"0 auto" }}>
      <div style={{ fontSize:20, fontWeight:800, marginBottom:20 }}>My Profile</div>

      <div style={{ display:"grid", gridTemplateColumns:"220px 1fr", gap:16, alignItems:"start" }}>

        {/* ── LEFT PANEL ── */}
        <div>
          {/* Avatar card */}
          <div style={{ background:"#fff", borderRadius:12, border:`1px solid ${C.border}`, padding:20, textAlign:"center", marginBottom:14 }}>
            <div style={{ position:"relative", display:"inline-block", marginBottom:10 }}>
              {c.photoUrl
                ? <img src={c.photoUrl} alt={c.name} style={{ width:80, height:80, borderRadius:"50%", objectFit:"cover", border:`3px solid ${C.cyan}` }} onError={e=>{e.target.style.display="none"; const fallback=e.target.parentNode&&e.target.parentNode.querySelector(".avatar-initials"); if(fallback) fallback.style.display="flex";}}/>
                : <div style={{ width:80, height:80, borderRadius:"50%", background:`linear-gradient(135deg,${C.cyan},${C.blueDk})`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:26, fontWeight:800, color:"#fff" }}>{initials}</div>
              }
            </div>
            <div style={{ fontSize:16, fontWeight:800, color:C.navy, marginBottom:2 }}>{c.name}</div>
            <div style={{ fontSize:12, color:C.muted, marginBottom:10 }}>{c.position}</div>
            <div style={{ display:"flex", gap:6, justifyContent:"center", flexWrap:"wrap", marginBottom:14 }}>
              {c.client && <span style={{ fontSize:10, fontWeight:700, background:"#DBEAFE", color:"#1D4ED8", padding:"2px 9px", borderRadius:20 }}>{c.client}</span>}
              {c.tier   && <span style={{ fontSize:10, fontWeight:700, background:"#DCFCE7", color:"#166534", padding:"2px 9px", borderRadius:20 }}>{c.tier}</span>}
              {c.status && <span style={{ fontSize:10, fontWeight:700, background:c.status==="Active"?C.greenBg:C.off, color:c.status==="Active"?C.green:C.muted, padding:"2px 9px", borderRadius:20 }}>{c.status}</span>}
            </div>
            <div style={{ borderTop:`1px solid ${C.border}`, paddingTop:12, display:"flex", flexDirection:"column", gap:8 }}>
              <button onClick={()=>setPhotoModal(true)} style={{ width:"100%", background:C.off, border:`1px solid ${C.border}`, borderRadius:8, padding:"7px 12px", fontSize:12, color:C.blue, fontWeight:600, cursor:"pointer", fontFamily:"inherit", display:"flex", alignItems:"center", justifyContent:"center", gap:6 }}>
                📷 {c.photoUrl?"Change Photo":"Add Photo"}
              </button>
              {c.photoUrl && (
                <button onClick={()=>{
                  if (!window.confirm("Remove profile photo?")) return;
                  setContractors(prev=>prev.map(ct=>ct.username===c.username?{...ct,photoUrl:""}:ct));
                  if (!DEMO_MODE) callScript("updateContractor",{username:c.username,photoUrl:""},()=>{},()=>{});
                  toast("Profile photo removed");
                }} style={{ width:"100%", background:C.redBg, border:"1px solid #FECACA", borderRadius:8, padding:"7px 12px", fontSize:12, color:C.red, fontWeight:600, cursor:"pointer", fontFamily:"inherit", display:"flex", alignItems:"center", justifyContent:"center", gap:6 }}>
                  🗑 Remove Photo
                </button>
              )}
              <button onClick={()=>setChPw(true)} style={{ width:"100%", background:C.off, border:`1px solid ${C.border}`, borderRadius:8, padding:"7px 12px", fontSize:12, color:C.muted, fontWeight:600, cursor:"pointer", fontFamily:"inherit", display:"flex", alignItems:"center", justifyContent:"center", gap:6 }}>
                🔒 Change Password
              </button>
            </div>
          </div>

          {/* Quick stats card */}
          <div style={{ background:"#fff", borderRadius:12, border:`1px solid ${C.border}`, padding:"16px 18px" }}>
            <div style={{ fontSize:11, fontWeight:700, color:C.muted, textTransform:"uppercase", letterSpacing:"0.6px", marginBottom:12 }}>Quick Stats</div>
            {[
              ["Tenure",         calcTenure(c.startDate)],
              ["Contract",       c.contractType||"—"],
              ["Payslips on file",mySlips.length||"0"],
              ["Rate",           fmtRate(c.rate)],
              ["VL Balance",     Math.max(0,parseFloat(((c.vlAccrued||0)-(c.vlUsed||0)-(c.vlPending||0)).toFixed(2)))+" hrs"],
              ["SL Balance",     Math.max(0,parseFloat(((c.slTotal||0)-(c.slUsed||0)-(c.slPending||0)).toFixed(2)))+" hrs"],
            ].map(([l,v])=>(
              <div key={l} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"6px 0", borderBottom:`1px solid ${C.border}` }}>
                <span style={{ fontSize:12, color:C.muted }}>{l}</span>
                <span style={{ fontSize:12, fontWeight:600, color:l==="VL Balance"?C.blue:l==="SL Balance"?C.cyan:C.navy }}>{v}</span>
              </div>
            ))}
          </div>
        </div>

        {/* ── RIGHT PANEL ── */}
        <div>

          {/* Work Information */}
          <SectionCard icon="💼" title="Work Information" action={<LockBadge/>}>
            <div style={{ padding:"4px 18px 14px" }}>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"0 20px" }}>
                {[
                  ["Full Name",        c.name],
                  ["Work Email",       c.email],
                  ["Position",         c.position],
                  ["Supervisor",       c.supervisor||"Not set"],
                  ["Client Account",   c.client],
                  ["Start Date",       c.startDate],
                  ["Service Tier",     c.tier ? c.tier + (tiers[c.tier]?" — "+tiers[c.tier]:"") : "—"],
                  ["Status",           c.status],
                ].map(([l,v])=>(
                  <div key={l} style={fieldStyle}>
                    <div style={labelStyle}>{l}</div>
                    <div style={{...valStyle, color:l==="Status"?(c.status==="Active"?C.green:C.muted):C.navy}}>{v||"—"}</div>
                  </div>
                ))}
              </div>
              <div style={{ marginTop:12, padding:"8px 12px", background:C.off, borderRadius:8, fontSize:11, color:C.muted }}>
                ℹ️ To update work info, contact your admin or <b>hr@elitegrid.co</b>
              </div>
            </div>
          </SectionCard>

          {/* Personal Information */}
          <SectionCard icon="👤" title="Personal Information"
            action={<button onClick={openPersonal} style={{ fontSize:11, color:C.blue, border:`0.5px solid ${C.blue}`, background:"transparent", borderRadius:6, padding:"3px 10px", cursor:"pointer", fontFamily:"inherit" }}>Edit</button>}>
            <div style={{ padding:"4px 18px 14px" }}>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"0 20px" }}>
                <div style={fieldStyle}>
                  <div style={labelStyle}>Date of Birth</div>
                  <div style={valStyle}>{c.dob||<span style={mutedVal}>Not set</span>}</div>
                </div>
                <div style={fieldStyle}>
                  <div style={labelStyle}>Personal Gmail</div>
                  <div style={valStyle}>{c.personalGmail||<span style={mutedVal}>Not set</span>}</div>
                </div>
                <div style={{ ...fieldStyle, gridColumn:"1/-1", borderBottom:"none" }}>
                  <div style={labelStyle}>Address</div>
                  <div style={valStyle}>{fullAddr||<span style={mutedVal}>Not set</span>}</div>
                </div>
              </div>
            </div>
          </SectionCard>

          {/* Payment Information */}
          <SectionCard icon="🏦" title="Payment Information"
            action={<span style={{ fontSize:11, color:C.muted }}>🔒 Submit once — contact HR to update</span>}>
            <div style={{ padding:"14px 18px" }}>
              {bankInfo.bankName ? (
                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:10 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:12 }}>
                    <div style={{ width:38, height:38, borderRadius:10, background:"#DBEAFE", display:"flex", alignItems:"center", justifyContent:"center", fontSize:20 }}>🏦</div>
                    <div>
                      <div style={{ fontSize:14, fontWeight:700, color:C.navy }}>{bankInfo.bankName}</div>
                      <div style={{ fontSize:12, color:C.muted }}>••••  ••••  {String(bankInfo.accountNumber||"").slice(-4)}</div>
                    </div>
                  </div>
                  <span style={{ fontSize:11, fontWeight:700, background:C.greenBg, color:C.green, padding:"3px 10px", borderRadius:20 }}>{bankInfo.payoutMethod||"—"}</span>
                </div>
              ) : (
                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                  <span style={{ fontSize:13, color:C.muted, fontStyle:"italic" }}>No payment info on file</span>
                  <button onClick={openBank} style={{ background:`linear-gradient(135deg,${C.blue},${C.blueDk})`, color:"#fff", border:"none", borderRadius:20, padding:"8px 18px", fontSize:13, fontWeight:700, cursor:"pointer", fontFamily:"inherit" }}>
                    + Add Payment Info
                  </button>
                </div>
              )}
            </div>
          </SectionCard>

        </div>
      </div>

      {/* Documents section below the grid */}
      <ContractorDocs contractor={c} user={{name:"",_username:c.username}} canManage={false}/>

      {/* ── MODALS ── */}
      {photoModal && <PhotoUpload currentUrl={c.photoUrl} username={c.username} onSave={savePhoto} onClose={()=>setPhotoModal(false)}/>}
      {chPw && <ChangePwModal user={contractor} onClose={()=>setChPw(false)}/>}

      {/* Personal info edit modal */}
      {editPersonal && (
        <div style={{ position:"fixed", inset:0, background:"rgba(27,42,74,0.65)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:300, padding:16 }} onClick={e=>e.target===e.currentTarget&&setEditPersonal(false)}>
          <div style={{ background:"#fff", borderRadius:16, padding:32, width:"100%", maxWidth:500, boxShadow:"0 24px 80px rgba(0,0,0,0.3)", maxHeight:"90vh", overflowY:"auto" }}>
            <div style={{ fontSize:18, fontWeight:800, color:C.navy, marginBottom:20 }}>Edit Personal Information</div>
            {personalErr && <Alert type="error">{personalErr}</Alert>}
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14, marginBottom:14 }}>
              <div style={{ gridColumn:"1/-1" }}>
                <FieldLabel>Date of Birth</FieldLabel>
                <FieldInput type="date" value={personalForm.dob||""} onChange={e=>sp("dob",e.target.value)}/>
              </div>
              <div style={{ gridColumn:"1/-1" }}>
                <FieldLabel>Personal Gmail</FieldLabel>
                <FieldInput value={personalForm.personalGmail||""} onChange={e=>sp("personalGmail",e.target.value)} placeholder="yourname@gmail.com"/>
              </div>
              <div style={{ gridColumn:"1/-1" }}>
                <FieldLabel>Street Address</FieldLabel>
                <FieldInput value={personalForm.addrStreet||""} onChange={e=>sp("addrStreet",e.target.value)} placeholder="e.g. 123 Rizal Street"/>
              </div>
              <div>
                <FieldLabel>City</FieldLabel>
                <FieldInput value={personalForm.addrCity||""} onChange={e=>sp("addrCity",e.target.value)} placeholder="e.g. Quezon City"/>
              </div>
              <div>
                <FieldLabel>Province / State</FieldLabel>
                <FieldInput value={personalForm.addrProvince||""} onChange={e=>sp("addrProvince",e.target.value)} placeholder="e.g. Metro Manila"/>
              </div>
              <div>
                <FieldLabel>Country</FieldLabel>
                <FieldInput value={personalForm.addrCountry||""} onChange={e=>sp("addrCountry",e.target.value)} placeholder="e.g. Philippines"/>
              </div>
              <div>
                <FieldLabel>ZIP / Postal Code</FieldLabel>
                <FieldInput value={personalForm.addrZip||""} onChange={e=>sp("addrZip",e.target.value)} placeholder="e.g. 1100"/>
              </div>
            </div>
            <div style={{ display:"flex", gap:10 }}>
              <Btn onClick={savePersonal} disabled={savingPersonal} style={{ flex:1, padding:11 }}>{savingPersonal?"Saving...":"Save Changes"}</Btn>
              <Btn variant="secondary" onClick={()=>setEditPersonal(false)} style={{ flex:1, padding:11 }}>Cancel</Btn>
            </div>
          </div>
        </div>
      )}

      {/* Bank info modal */}
      {bankModal && (
        <div style={{ position:"fixed", inset:0, background:"rgba(27,42,74,0.65)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:300, padding:16 }} onClick={e=>e.target===e.currentTarget&&setBankModal(false)}>
          <div style={{ background:"#fff", borderRadius:16, padding:32, width:"100%", maxWidth:480, boxShadow:"0 24px 80px rgba(0,0,0,0.3)" }}>
            <div style={{ fontSize:18, fontWeight:800, color:C.navy, marginBottom:6 }}>Payment Information</div>
            <div style={{ fontSize:13, color:C.muted, marginBottom:20, lineHeight:1.5 }}>This information is used for payroll processing. Only you can update it.</div>
            {bankErr && <Alert type="error">{bankErr}</Alert>}
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14 }}>
              <div style={{ gridColumn:"1/-1" }}>
                <FieldLabel required>Bank Name</FieldLabel>
                <select value={bankForm._bankPreset||""} onChange={e=>{
                  const v = e.target.value;
                  sb("_bankPreset", v);

function CPayslips({ user }) {
  const [sel,setSel] = useState(null);

    p && (!p.username || String(p.username).toLowerCase()===myUsername)
  );

  // Recalculate net from components — fixes cases where stored net didn't include allowance
  const calcDisplayNet = (p) => {
    const toN = (v) => { if (!v) return 0; const n=parseFloat(String(v).replace(/[^0-9.-]/g,"")); return isNaN(n)?0:n; };
    // Allowance is always a positive addition to gross; force absolute value
    const computed = toN(p.gross) + Math.abs(toN(p.allowance)) - Math.abs(toN(p.deductions)) + toN(p.adjustments);
    const stored   = toN(p.net);
    // If the stored net is clearly wrong (doesn't match computed within $0.01), show computed
    return Math.abs(computed - stored) > 0.02 ? computed : stored;
  };
  return (
    <div style={{ padding:"28px 20px", maxWidth:860, margin:"0 auto" }}>
      <div style={{ fontSize:20, fontWeight:800, marginBottom:20 }}>Payslip Records</div>

              {payslips.length===0
                ? <tr><td colSpan={7} style={{ padding:32, textAlign:"center", color:C.muted, fontSize:14 }}>No payslips on record.</td></tr>

                  <tr key={i} className="tr-hover" style={{ borderBottom:`1px solid ${C.border}` }}>
                    <td style={{ padding:"12px 14px", fontWeight:600, fontSize:14 }}>{p.period}</td>
                    <td style={{ padding:"12px 14px", fontSize:14 }}>{fmtCur(p.gross)}</td>
                    <td style={{ padding:"12px 14px", fontSize:14 }}>{fmtCur(p.allowance)}</td>
                    <td style={{ padding:"12px 14px", fontSize:14 }}>{fmtCur(p.deductions)}</td>

                    <td style={{ padding:"12px 14px", fontSize:14, fontWeight:700, color:C.blue }}>{fmtCur(calcDisplayNet(p))}</td>
                    <td style={{ padding:"12px 14px" }}><SBadge s={p.status}/></td>
                    <td style={{ padding:"12px 14px", fontSize:13, color:C.muted }}>{fmtRelease(p.released)}</td>
                    <td style={{ padding:"12px 14px" }}>
                      <button onClick={()=>setSel(p)} style={{ background:C.off, border:`1px solid ${C.border}`, borderRadius:7, padding:"5px 12px", fontSize:12, color:C.blue, fontWeight:600, cursor:"pointer" }}>View</button>
                    </td>

function CPTOPage({ contractor, setPage, leaves, ptoHistory }) {
  const [histModal, setHistModal] = useState(null);
  const c = contractor;
  if (!c) return null;

  const vlBal = Math.max(0,parseFloat((c.vlAccrued-c.vlUsed-c.vlPending).toFixed(2)));
  const slBal = Math.max(0,parseFloat((c.slTotal-c.slUsed-c.slPending).toFixed(2)));
  const atCap = parseFloat(c.vlAccrued)>=200;
  const items = [
    { key:"VL", label:"Vacation Leave (VL)", note:"Accrues monthly - max 200 hrs (25 days)", total:c.vlTotal, used:c.vlUsed, pending:c.vlPending, balance:vlBal, color:C.blue, atCap },
    { key:"SL", label:"Sick Leave (SL)",     note:"Annual lump sum - resets Jan 1",           total:c.slTotal, used:c.slUsed, pending:c.slPending, balance:slBal, color:C.cyan, atCap:false },
  ];

  // Build PTO timeline for the modal
  const buildTimeline = (type) => {
    const events = [];
    const monthlyRate = parseFloat(c.vlMonthlyRate)||13.33;
    const isVL = type === "VL";

    if (c.startDate) {
      const start = new Date(c.startDate);
      if (!isNaN(start.getTime())) {
        // Opening entry
        const initHrs = isVL ? 0 : (parseFloat(c.slTotal)||40);
        events.push({
          date: c.startDate,
          label: "Hired — " + (isVL ? "VL starts at 0, accrues on 1st of each month" : "SL initial allocation (" + initHrs + " hrs)"),
          change: isVL ? "0 hrs" : "+" + initHrs + " hrs",
          type: "hire",
          _balance: initHrs
        });

        if (isVL) {
          // Calculate each monthly accrual from start date up to today
          const today = new Date();
          let cur = new Date(start.getFullYear(), start.getMonth() + 1, 1); // first day of month after hire
          let running = 0;
          while (cur <= today) {
            running = Math.min(200, parseFloat((running + monthlyRate).toFixed(2)));
            const mon = cur.toLocaleDateString("en-US", { month:"short", year:"numeric" });
            events.push({
              date: cur.toISOString().substring(0, 10),
              label: "Monthly accrual — " + mon,
              change: "+" + monthlyRate + " hrs",
              type: "accrual",
              _balance: running
            });
            cur.setMonth(cur.getMonth() + 1);
          }
        }

        if (!isVL) {
          // Annual SL resets - Jan 1 of each year after hire year
          const today2 = new Date();
          for (let yr = start.getFullYear() + 1; yr <= today2.getFullYear(); yr++) {
            events.push({
              date: yr + "-01-01",
              label: "Annual SL reset — Jan 1, " + yr + " (balance restored to " + (parseFloat(c.slTotal)||40) + " hrs)",
              change: "Reset → " + (parseFloat(c.slTotal)||40) + " hrs",
              type: "hire",
              _balance: parseFloat(c.slTotal)||40
            });
          }
        }
      }
    }

    // Leave deductions from approved leaves
    (leaves||[]).filter(l => l.leaveType === type && l.status === "Approved").forEach(l => {
      const hrs = parseFloat(l.hours)||0;
      events.push({
        date: String(l.start).substring(0, 10),
        label: "Leave taken" + (l.isHalfDay ? " (half day)" : "") + (l.reason ? " — " + l.reason : ""),
        change: "-" + hrs + " hrs",
        type: "leave",
        _hrs: -hrs
      });
    });

    // HR adjustments from PTOAuditLog (if any exist)
    (ptoHistory||[]).filter(e => {
      const f = e.field||"";
      return isVL ? f.startsWith("vl") : f.startsWith("sl");
    }).forEach(e => {
      const oldV = parseFloat(e.oldVal)||0;
      const newV = parseFloat(e.newVal)||0;
      const diff = newV - oldV;
      const sign = diff >= 0 ? "+" : "";
      events.push({
        date: e.timestamp,
        label: "HR adjustment" + (e.reason ? " — " + e.reason : "") + " (" + e.field + ")",
        change: sign + diff.toFixed(2) + " hrs",
        type: "adjust",
        _balance: newV
      });
    });

    // Sort oldest first to compute running balance
    events.sort((a, b) => String(a.date).localeCompare(String(b.date)));

    // Thread running balance through all events
    let running = 0;
    events.forEach(e => {
      if (e._balance !== undefined) {
        running = e._balance;
      } else if (e._hrs !== undefined) {
        running = Math.max(0, parseFloat((running + e._hrs).toFixed(2)));
      }
      e.balance = running;
    });

    // Reverse to show newest first
    events.reverse();
    return events;
  };

  return (
    <div style={{ padding:"28px 20px", maxWidth:700, margin:"0 auto" }}>
      <div style={{ fontSize:20, fontWeight:800, marginBottom:20 }}>PTO & Leave Balances</div>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))", gap:16, marginBottom:20 }}>
        {items.map(p => {
          const uP = Math.min((p.used/p.total)*100,100);
          const pP = Math.min((p.pending/p.total)*100,100-uP);
          return (
            <div key={p.label} onClick={()=>setHistModal(p.key)} className="card-lift"
              style={{ background:"#fff", borderRadius:12, padding:22, border:`1px solid ${C.border}`, borderLeft:`4px solid ${p.color}`, cursor:"pointer" }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:14 }}>
                <div>
                  <div style={{ fontWeight:700, fontSize:15, color:C.navy }}>{p.label}</div>
                  <div style={{ fontSize:12, color:C.muted, marginTop:2 }}>{p.note}</div>
                  {p.atCap && <span style={{ fontSize:10, fontWeight:700, background:C.amberBg, color:C.amber, padding:"2px 8px", borderRadius:20, marginTop:4, display:"inline-block" }}>Accrual paused - at 200hr cap</span>}
                </div>
                <div style={{ textAlign:"right" }}>
                  <div style={{ fontSize:30, fontWeight:900, color:p.color }}>{p.balance}</div>
                  <div style={{ fontSize:11, color:C.muted }}>hrs available</div>
                </div>
              </div>
              <div style={{ height:10, background:C.border, borderRadius:10, overflow:"hidden", display:"flex" }}>
                <div style={{ width:`${uP}%`, background:p.color }}/>
                <div style={{ width:`${pP}%`, background:C.amber }}/>
              </div>
              <div style={{ display:"flex", gap:16, marginTop:12, fontSize:12, color:C.muted }}>
                <span>Used: <b style={{ color:C.navy }}>{p.used} hrs</b></span>
                {p.pending>0 && <span>Pending: <b style={{ color:C.amber }}>{p.pending} hrs</b></span>}
                <span>Total: <b style={{ color:C.navy }}>{p.total} hrs</b></span>
              </div>
              <div style={{ marginTop:10, fontSize:11, color:p.color, fontWeight:600 }}>📋 Click to view history</div>
            </div>
          );
        })}
      </div>
      <div style={{ background:`linear-gradient(135deg,${C.navy},${C.navyLt})`, borderRadius:12, padding:24 }}>
        <div style={{ fontWeight:700, fontSize:15, color:"#fff", marginBottom:6 }}>File a Leave Request</div>
        <div style={{ fontSize:13, color:"#8AAABF", marginBottom:16, lineHeight:1.5 }}>VL must be filed before your leave date. SL can be filed same day or retroactively. Half day = 4 hrs.</div>
        <button onClick={()=>setPage("c-leave")} style={{ background:C.cyan, color:C.navy, padding:"9px 20px", borderRadius:8, fontWeight:700, fontSize:13, border:"none", cursor:"pointer" }}>File a Request</button>
      </div>

      {/* PTO History Modal */}
      {histModal && (()=>{
        const isVL = histModal==="VL";
        const color = isVL ? C.blue : C.cyan;
        const timeline = buildTimeline(histModal);
        return (
          <div style={{ position:"fixed", inset:0, background:"rgba(27,42,74,0.7)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:300, padding:16 }} onClick={e=>e.target===e.currentTarget&&setHistModal(null)}>
            <div style={{ background:"#fff", borderRadius:16, width:"100%", maxWidth:620, maxHeight:"85vh", display:"flex", flexDirection:"column", boxShadow:"0 24px 80px rgba(0,0,0,0.3)", overflow:"hidden" }}>
              {/* Header */}
              <div style={{ background:`linear-gradient(135deg,${C.navy},${C.blueDk})`, padding:"20px 24px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                <div>
                  <div style={{ fontSize:16, fontWeight:800, color:"#fff" }}>{isVL?"Vacation Leave (VL)":"Sick Leave (SL)"} History</div>
                  <div style={{ fontSize:12, color:"#8AAABF", marginTop:2 }}>{c.name} · Current balance: <b style={{ color:isVL?C.cyan:"#fff" }}>{isVL?vlBal:slBal} hrs</b></div>
                </div>
                <button onClick={()=>setHistModal(null)} style={{ background:"rgba(255,255,255,0.1)", border:"none", borderRadius:8, padding:"6px 12px", color:"#fff", cursor:"pointer", fontSize:20, lineHeight:1 }}>×</button>
              </div>
              {/* Timeline */}
              <div style={{ overflowY:"auto", flex:1, padding:"0 0 8px" }}>
                {timeline.length===0
                  ? <div style={{ padding:32, textAlign:"center", color:C.muted, fontSize:14 }}>No history available yet.</div>
                  : (
                    <table style={{ width:"100%", borderCollapse:"collapse" }}>
                      <thead style={{ position:"sticky", top:0, background:"#F7F9FB", zIndex:1 }}>
                        <tr>
                          {["Date","Event","Change","Balance"].map(h=>(
                            <th key={h} style={{ padding:"10px 16px", textAlign:"left", fontSize:11, fontWeight:700, color:C.muted, textTransform:"uppercase", letterSpacing:"0.5px", borderBottom:`1px solid ${C.border}` }}>{h}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {timeline.map((e,i)=>{
                          const isPos = String(e.change).startsWith("+");
                          const isNeg = String(e.change).startsWith("-");
                          const typeIcon = e.type==="hire"?"🎉":e.type==="accrual"?"📈":e.type==="leave"?"🌴":e.type==="adjust"?"⚙️":"•";
                          return (
                            <tr key={i} className="tr-hover" style={{ borderBottom:`1px solid ${C.border}` }}>
                              <td style={{ padding:"11px 16px", fontSize:12, color:C.muted, whiteSpace:"nowrap" }}>{fmtRelease(e.date)}</td>
                              <td style={{ padding:"11px 16px", fontSize:13 }}>
                                <span style={{ marginRight:6 }}>{typeIcon}</span>
                                {e.label}
                              </td>
                              <td style={{ padding:"11px 16px", fontSize:13, fontWeight:700, color:isPos?C.green:isNeg?C.red:C.muted, whiteSpace:"nowrap" }}>{e.change}</td>
                              <td style={{ padding:"11px 16px", fontSize:13, fontWeight:600, color:e.balance!==null?C.navy:C.muted }}>
                                {e.balance!==null ? e.balance+" hrs" : "—"}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  )
                }
              </div>
              {/* Footer legend */}
              <div style={{ padding:"12px 24px", borderTop:`1px solid ${C.border}`, display:"flex", gap:16, flexWrap:"wrap", fontSize:11, color:C.muted }}>
