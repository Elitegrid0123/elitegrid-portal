                <span>🌴 Leave taken</span>
                <span>⚙️ HR adjustment</span>
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

function CLeave({ user, contractor, leaves, setLeaves, setContractors, onContractorNotify }) {
  const [lvType,setLvType]   = useState("VL");
  const [isHalf,setIsHalf]   = useState(false);
  const [start,setStart]     = useState("");
  const [end,setEnd]         = useState("");
  const [reason,setReason]   = useState("");
  const [err,setErr]              = useState("");
  const [success,setSuccess]      = useState("");
  const [loading,setLoading]      = useState(false);
  const [approvalFile,setApprovalFile] = useState(null);
  const [approvalPreview,setApprovalPreview] = useState("");
  const fileInputRef = React.useRef();

  if (!contractor) return null;

  const handleApprovalFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const allowed = ["image/jpeg","image/png","image/gif","application/pdf"];
    if (!allowed.includes(file.type)) { setErr("Only JPG, PNG, GIF, or PDF files are accepted."); return; }
    if (file.size > 5*1024*1024) { setErr("File must be under 5MB."); return; }
    const reader = new FileReader();
    reader.onload = (ev) => {
      setApprovalFile(ev.target.result);
      setApprovalPreview(file.name);
      setErr("");
    };
    reader.readAsDataURL(file);
  };

  const c = contractor;
  const days  = !isHalf&&start&&end&&new Date(end)>=new Date(start)?workingDays(start,end):(isHalf?1:0);
  const hours = isHalf?4:days*8;
  const vlBal = parseFloat((c.vlAccrued-c.vlUsed-c.vlPending).toFixed(2));
  const slBal = parseFloat((c.slTotal-c.slUsed-c.slPending).toFixed(2));
  const balance = lvType==="VL"?vlBal:slBal;
  const isLWOP = hours>0&&hours>balance;
  const needsMedCert = !isHalf&&lvType==="SL"&&days>3;
  const myLeaves = leaves.filter(l=>l.username===user.username);

  const submit = () => {
    setErr(""); setSuccess("");
    if (!start) { setErr("Please select a start date."); return; }
    if (!isHalf&&!end) { setErr("Please select an end date."); return; }
    if (!isHalf&&new Date(end)<new Date(start)) { setErr("End date cannot be before start date. Please check your dates."); return; }
    if (!isHalf&&days===0) { setErr("No working days in selected range (Mon-Fri only)."); return; }
    if (lvType==="VL"&&start<todayPHT()) { setErr("Vacation Leave must be filed before your leave date."); return; }
    if (lvType==="VL" && !approvalFile) { setErr("Vacation Leave requires a supervisor approval attachment. Please attach the approval email or document."); return; }
    // Check if contractor has enough leave credits
    if (hours > 0 && balance <= 0) {
      setErr("You have no available " + lvType + " balance. Please contact your admin.");
      return;
    }
    if (hours > 0 && hours > balance) {
      setErr("Insufficient " + lvType + " balance. You need " + hours + " hrs but only have " + Math.max(0, balance).toFixed(2) + " hrs available. Your request will be flagged as LWOP — contact your admin first.");
      return;
    }
    setLoading(true);
    setTimeout(()=>{
      const newLeave = {
        leaveId:"LV-"+Date.now(), username:user.username, name:user.name,
        leaveType:lvType, isHalfDay:isHalf, start, end:isHalf?start:end,
        days:isHalf?1:days, hours, reason, status:"Pending",
        filedOn:formatPHT(nowPHT(),{month:"short",day:"numeric",year:"numeric"}),
        actionedBy:"", isLWOP, needsMedCert,
        approvalAttachment: approvalFile||"",
        approvalFileName: approvalPreview||"",
      };
      if (!DEMO_MODE) callScript("submitLeave", {username:user._username, leaveType:lvType, isHalfDay:String(isHalf), startDate:start, endDate:isHalf?start:end, reason}, ()=>{}, ()=>{});
      setLeaves(prev=>[...prev,newLeave]);
      setContractors(prev=>prev.map(ct=>{
        if (ct.username!==user.username&&ct.username!==user._username) return ct;
        if (lvType==="VL") return {...ct, vlPending:parseFloat((ct.vlPending+hours).toFixed(2))};
        return {...ct, slPending:parseFloat((ct.slPending+hours).toFixed(2))};
      }));
      const notifMsg = !DEMO_MODE ? "Email notification sent to admin." : "(Demo) Email sent to hr@elitegrid.co and all admins.";
      if (onContractorNotify) onContractorNotify("Leave Filed", "Your "+lvType+(isHalf?" (Half Day)":"")+" request was submitted and is pending approval.");
      setSuccess(`Request submitted. ${isHalf?"Half day":days+" day"+(days>1?"s":"")} (${hours} hrs) is now pending.${isLWOP?" Flagged as LWOP.":""}${needsMedCert?" Medical certificate required.":""} ${notifMsg}`);
      setStart(""); setEnd(""); setReason(""); setApprovalFile(null); setApprovalPreview(""); setLoading(false);
    },700);
  };

  return (
    <div style={{ padding:"28px 20px", maxWidth:760, margin:"0 auto" }}>
      <div style={{ fontSize:20, fontWeight:800, marginBottom:20 }}>My Leave Requests</div>
      <Card style={{ marginBottom:20 }}>
        <div style={{ fontSize:15, fontWeight:700, marginBottom:16 }}>File a New Request</div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))", gap:14, marginBottom:14 }}>
          <div>
            <FieldLabel>Leave Type</FieldLabel>
            <select value={lvType} onChange={e=>setLvType(e.target.value)} style={{ width:"100%", padding:"10px 13px", borderRadius:8, border:`1.5px solid ${C.border}`, fontSize:14, fontFamily:"inherit", outline:"none", background:"#fff" }}>
              <option value="VL">Vacation Leave (VL)</option>
              <option value="SL">Sick Leave (SL)</option>
            </select>
          </div>
          <div>
            <FieldLabel>Duration</FieldLabel>
            <div style={{ display:"flex", gap:8 }}>
              {[["Full Day",false],["Half Day (4hrs)",true]].map(([label,val]) => (
                <button key={label} onClick={()=>setIsHalf(val)}
                  style={{ flex:1, padding:"10px 6px", borderRadius:8, border:`1.5px solid ${isHalf===val?C.blue:C.border}`, background:isHalf===val?"#DBEAFE":"#fff", color:isHalf===val?C.blue:C.muted, fontSize:12, fontWeight:isHalf===val?700:500, cursor:"pointer", fontFamily:"inherit" }}>
                  {label}
                </button>
              ))}
            </div>
          </div>
          <div>
            <FieldLabel required>{isHalf?"Date":"Start Date"}</FieldLabel>
            <FieldInput type="date" value={start} onChange={e=>setStart(e.target.value)}/>
          </div>
          {!isHalf && (
            <div>
              <FieldLabel required>End Date</FieldLabel>
              <FieldInput type="date" value={end} min={start||undefined}
                onChange={e=>{
                  if (start && e.target.value < start) {
                    setErr("End date cannot be before start date.");
                  } else {
                    setErr("");
                  }
                  setEnd(e.target.value);
                }}/>
            </div>
          )}
        </div>
        <div style={{ marginBottom:14 }}>
          <FieldLabel>Reason <span style={{ fontWeight:400, color:C.muted }}>(optional{lvType==="SL"?" - med cert required if SL over 3 consecutive days":""})</span></FieldLabel>
          <textarea value={reason} onChange={e=>setReason(e.target.value)} rows={2} placeholder="Brief reason..." style={{ width:"100%", padding:"10px 13px", borderRadius:8, border:`1.5px solid ${C.border}`, fontSize:14, fontFamily:"inherit", outline:"none", resize:"vertical", boxSizing:"border-box" }}/>
        </div>
        {start&&hours>0&&(
          <div style={{ padding:"10px 14px", background:isLWOP?C.amberBg:C.off, borderRadius:8, fontSize:13, color:isLWOP?"#92400E":C.navy, marginBottom:14 }}>
            {isHalf?"Half day = ":days+" working day"+(days>1?"s":"")+" = "}<b>{hours} hours</b> from your {lvType} balance.
            {isLWOP&&<b> Balance is {balance} hrs - will be flagged as LWOP for admin review.</b>}
            {needsMedCert&&<b> Medical certificate will be required.</b>}
          </div>
        )}
        {/* Supervisor Approval Attachment */}
        <div style={{ marginBottom:14 }}>
          <FieldLabel required={lvType==="VL"}>
            Supervisor Approval {lvType==="VL"?<span style={{color:C.red}}>*</span>:<span style={{color:C.muted,fontWeight:400}}>(optional for SL)</span>}
          </FieldLabel>
          <div style={{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap" }}>
            <button type="button" onClick={()=>fileInputRef.current.click()}
              style={{ background:C.off, border:`1.5px dashed ${approvalFile?C.green:C.border}`, borderRadius:8, padding:"9px 16px", fontSize:13, color:approvalFile?C.green:C.muted, cursor:"pointer", fontWeight:600, fontFamily:"inherit" }}>
              {approvalFile ? "✓ "+approvalPreview : "+ Attach approval (JPG, PNG, PDF — max 5MB)"}
            </button>
            {approvalFile && (
              <button type="button" onClick={()=>{setApprovalFile(null);setApprovalPreview("");}}
                style={{ background:C.redBg, border:"1px solid #FECACA", borderRadius:7, padding:"7px 12px", fontSize:12, color:C.red, cursor:"pointer", fontWeight:600, fontFamily:"inherit" }}>
                Remove
              </button>
            )}
            <input ref={fileInputRef} type="file" accept="image/*,.pdf" onChange={handleApprovalFile} style={{display:"none"}}/>
          </div>
          {lvType==="VL" && !approvalFile && <div style={{fontSize:11,color:C.amber,marginTop:5,fontWeight:600}}>Required for Vacation Leave — attach your supervisor's approval email or message.</div>}
        </div>
        {err     && <Alert type="error">{err}</Alert>}
        {success && <Alert type="success">{success}</Alert>}
        <Btn onClick={submit} disabled={loading} style={{ padding:"11px 28px" }}>{loading?"Submitting...":"Submit Leave Request"}</Btn>
      </Card>
      <Card style={{ padding:0, overflow:"hidden" }}>
        <div style={{ padding:"16px 20px", fontWeight:700, fontSize:15 }}>Leave History</div>
        {myLeaves.length===0
          ? <div style={{ textAlign:"center", color:C.muted, padding:28, fontSize:14 }}>No leave requests yet.</div>
          : <div style={{ overflowX:"auto" }}>
              <table style={{ width:"100%", borderCollapse:"collapse" }}>
                <thead><tr style={{ background:C.off }}>
                  {["Type","Dates","Days","Hours","Filed","Approval","Status",""].map(h => (
                    <th key={h} style={{ padding:"9px 14px", textAlign:"left", fontSize:11, fontWeight:700, color:C.muted, textTransform:"uppercase", letterSpacing:"0.5px", borderBottom:`1px solid ${C.border}` }}>{h}</th>
                  ))}
                </tr></thead>
                <tbody>
                  {myLeaves.map((l,i) => (
                    <tr key={i} className="tr-hover" style={{ borderBottom:`1px solid ${C.border}` }}>
                      <td style={{ padding:"11px 14px" }}>
                        <span style={{ background:"#DBEAFE", color:"#1D4ED8", fontSize:10, fontWeight:700, padding:"2px 8px", borderRadius:20 }}>{l.leaveType}{l.isHalfDay?" HD":""}</span>
                      </td>
                      <td style={{ padding:"11px 14px", fontSize:13 }}>{String(l.start).substring(0,10)}{!l.isHalfDay&&l.end!==l.start?" to "+String(l.end).substring(0,10):""}</td>
                      <td style={{ padding:"11px 14px", fontWeight:600 }}>{l.isHalfDay?"0.5":l.days}</td>
                      <td style={{ padding:"11px 14px" }}>{l.hours} hrs</td>
                      <td style={{ padding:"11px 14px", fontSize:12, color:C.muted }}>{l.filedOn}</td>
                      <td style={{ padding:"11px 14px" }}>
                        {l.approvalFileName
                          ? <a href={l.approvalAttachment} download={l.approvalFileName} style={{fontSize:11,color:C.blue,fontWeight:600}}>📎 {l.approvalFileName}</a>
                          : <span style={{fontSize:11,color:C.muted}}>—</span>}
                      </td>
                      <td style={{ padding:"11px 14px" }}><SBadge s={l.status}/></td>
                      <td style={{ padding:"11px 14px" }}>
                        {l.status==="Pending" && (
                          <button onClick={()=>{
                            if (!window.confirm("Cancel this leave request?")) return;
                            const hrs = parseFloat(l.hours)||0;
                            setLeaves(prev=>prev.filter(x=>x.leaveId!==l.leaveId));
                            setContractors(prev=>prev.map(ct=>{
                              if (ct.username!==user.username&&ct.username!==user._username) return ct;
                              if (l.leaveType==="VL") return {...ct, vlPending:Math.max(0,parseFloat((ct.vlPending-hrs).toFixed(2)))};
                              return {...ct, slPending:Math.max(0,parseFloat((ct.slPending-hrs).toFixed(2)))};
                            }));
                            if (!DEMO_MODE) callScript("cancelLeave",{leaveId:l.leaveId},()=>{},()=>{});
                          }}
                          style={{ background:C.redBg, border:"1px solid #FECACA", borderRadius:6, padding:"4px 10px", fontSize:11, color:C.red, fontWeight:600, cursor:"pointer" }}>
                            Cancel
                          </button>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
        }
      </Card>
    </div>
  );
}


// ── CONTRACTOR LEAVE CALENDAR ────────────────────────────────────────
function CLeaveCalendar({ contractor, leaves, contractors, teamLeaves }) {
  const today   = new Date();
  const [year,  setYear]  = useState(today.getFullYear());
  const [month, setMonth] = useState(today.getMonth());

  const myClient = contractor ? contractor.client : "";

  // Use teamLeaves from backend if available (real data), otherwise fall back to
  // filtering contractors state (which may contain demo data)
  const hasRealTeamLeaves = teamLeaves && teamLeaves.length > 0;

  // Build the approved team leaves to show
  const teamApprovedLeaves = hasRealTeamLeaves
    ? teamLeaves.filter(l => l.status === "Approved")
    : leaves.filter(l => l.status === "Approved");

  // Determine who is on the team for the legend
  // If we have real teammates from contractors state (non-demo), use them
  // Otherwise derive from teamLeaves usernames
  const isDemoContractors = contractors.some(c => c.username === "jdelacruz" || c.username === "mjangelica");
  const teammates = isDemoContractors && hasRealTeamLeaves
    ? [...new Map(teamApprovedLeaves.map(l => [l.username, { username:l.username, name:l.name, client:myClient, status:"Active" }])).values()]
    : contractors.filter(c => c.client === myClient && c.status === "Active");

  const CLIENT_COLORS = ["#2E86C1","#5BC8E8","#16A34A","#D97706","#7C3AED","#DC2626","#0E7490"];
  const colorMap = {};
  teammates.forEach((c,i) => colorMap[(c.username||"").toLowerCase()] = CLIENT_COLORS[i % CLIENT_COLORS.length]);

  const daysInMonth = new Date(year, month+1, 0).getDate();
  const firstDay    = new Date(year, month, 1).getDay();
  const monthName   = new Date(year, month, 1).toLocaleString("en-US",{month:"long",year:"numeric"});

  const pad = (n) => String(n).padStart(2,"0");
  const getLeavesForDay = (day) => {
    const dStr = `${year}-${pad(month+1)}-${pad(day)}`;
    return teamApprovedLeaves.filter(l => {
      const s = String(l.start).substring(0,10);
      const e = String(l.end||l.start).substring(0,10);
      return dStr >= s && dStr <= e;
    });
  };

  const prevMonth = () => { if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1); };
  const nextMonth = () => { if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1); };

  const cells = [];
  for(let i=0;i<firstDay;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);

  const isToday = (d) => d && year===today.getFullYear() && month===today.getMonth() && d===today.getDate();

  return (
    <div style={{ padding:"28px 20px", maxWidth:900, margin:"0 auto" }}>
      <div style={{ fontSize:20, fontWeight:800, marginBottom:6 }}>Team Leave Calendar</div>
      <div style={{ fontSize:14, color:C.muted, marginBottom:16 }}>{myClient} team · Approved leaves only</div>

      {/* Legend */}
      <div style={{ display:"flex", gap:12, flexWrap:"wrap", marginBottom:16 }}>
        {teammates.map(c=>(
          <div key={c.username} style={{ display:"flex", alignItems:"center", gap:6 }}>
            <div style={{ width:10, height:10, borderRadius:3, background:colorMap[c.username.toLowerCase()]||C.blue }}/>
            <span style={{ fontSize:12, color:C.muted, fontWeight:600 }}>{String(c.name || c.username || "").split(" ")[0]}</span>
          </div>
        ))}
      </div>

      <Card>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:16 }}>
          <button onClick={prevMonth} style={{ background:C.off, border:`1px solid ${C.border}`, borderRadius:8, padding:"6px 14px", cursor:"pointer", fontSize:16, fontFamily:"inherit" }}>‹</button>
          <div style={{ fontSize:16, fontWeight:800, color:C.navy }}>{monthName}</div>
          <button onClick={nextMonth} style={{ background:C.off, border:`1px solid ${C.border}`, borderRadius:8, padding:"6px 14px", cursor:"pointer", fontSize:16, fontFamily:"inherit" }}>›</button>
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:2, marginBottom:4 }}>
          {["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>(
            <div key={d} style={{ textAlign:"center", fontSize:11, fontWeight:700, color:C.muted, textTransform:"uppercase", padding:"4px 0" }}>{d}</div>
          ))}
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:2 }}>
          {cells.map((d,i)=>{
            const dayLeaves = d ? getLeavesForDay(d) : [];
            return (
              <div key={i} style={{ minHeight:72, borderRadius:8, padding:"4px 6px", background:isToday(d)?"#EFF6FF":d?"#fff":"transparent", border:isToday(d)?`2px solid ${C.blue}`:`1px solid ${C.border}` }}>
                {d && (
                  <>
                    <div style={{ fontSize:12, fontWeight:isToday(d)?800:500, color:isToday(d)?C.blue:C.navy, marginBottom:3 }}>{d}</div>
                    {dayLeaves.slice(0,3).map((l,j)=>{
                      const bg  = colorMap[(l.username||"").toLowerCase()]||C.blue;
                      const ct  = teammates.find(c=>c.username.toLowerCase()===(l.username||"").toLowerCase());
                      return (
                        <div key={j} title={ct?ct.name:l.username} style={{ background:bg, color:"#fff", fontSize:9, fontWeight:700, padding:"2px 5px", borderRadius:4, marginBottom:2, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
                          {ct?String(ct.name || ct.username || "").split(" ")[0]:l.username} {l.leaveType}
                        </div>
                      );
                    })}
                    {dayLeaves.length>3 && <div style={{ fontSize:9, color:C.muted, fontWeight:600 }}>+{dayLeaves.length-3} more</div>}
                  </>
                )}
              </div>
            );
          })}
        </div>
      </Card>
    </div>
  );
}

function CAnnouncements({ announcements }) {
  const anns = announcements||INIT_ANNOUNCEMENTS;
  return (

      <div style={{ display:"flex", flexDirection:"column", gap:14 }}>

function AOverview({ user, contractors, leaves, perms, setPage, announcements }) {
  const visible  = getVisible(user,contractors,perms);
  const active   = visible.filter(c=>c.status==="Active").length;
  const noPhoto  = visible.filter(c=>c.status==="Active"&&!c.photoUrl).length;
  const pending  = leaves.filter(l=>l.status==="Pending"&&visible.find(c=>c.username===l.username)).length;
  const lwop     = leaves.filter(l=>l.isLWOP&&l.status==="Pending"&&visible.find(c=>c.username===l.username)).length;

  const stats = [
    { label:"Active Contractors", value:active,  sub:"in your scope",        color:C.blue,  page:"a-team" },
    { label:"Pending Leave",      value:pending, sub:"click to review",      color:C.amber, page:"a-leave" },
    { label:"Missing Photos",     value:noPhoto, sub:"profile incomplete",   color:C.gold,  page:"a-team" },
    { label:"LWOP Flags",         value:lwop,    sub:"zero balance filings", color:C.red,   page:"a-leave" },
  ];

  const pendingList = leaves.filter(l=>l.status==="Pending"&&visible.find(c=>c.username===l.username));

  return (
    <div style={{ padding:"28px 20px", maxWidth:960, margin:"0 auto" }}>
      <div style={{ marginBottom:22 }}>
        <div style={{ fontSize:22, fontWeight:800, marginBottom:4 }}>Good day, {String(user.name || user.profile?.name || user.username || "").split(" ")[0]}</div>
        <div style={{ fontSize:14, color:C.muted }}>Here is what needs your attention.</div>
      </div>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))", gap:14, marginBottom:24 }}>
        {stats.map(s => (
          <div key={s.label} onClick={()=>setPage(s.page)}
            style={{ background:C.white, borderRadius:14, padding:22, border:`1px solid ${C.border}`, borderLeft:`4px solid ${s.color}`, cursor:"pointer", transition:"all 0.15s", boxShadow:"0 1px 4px rgba(0,0,0,0.04)" }}>
            <div style={{ fontSize:11, fontWeight:700, color:C.muted, textTransform:"uppercase", letterSpacing:"0.6px", marginBottom:8 }}>{s.label}</div>
            <div style={{ fontSize:32, fontWeight:900, color:s.color, marginBottom:4 }}>{s.value}</div>
            <div style={{ fontSize:12, color:C.muted }}>{s.sub}</div>
          </div>
        ))}
      </div>
      <Card>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:16 }}>
          <div style={{ fontSize:15, fontWeight:700 }}>Pending Leave Requests</div>
          {pendingList.length>0 && (
            <button onClick={()=>setPage("a-leave")} style={{ background:"none", border:"none", color:C.blue, fontSize:13, fontWeight:600, cursor:"pointer" }}>Review all</button>
          )}
        </div>
        {pendingList.length===0
          ? <div style={{ color:C.muted, fontSize:14, padding:"8px 0" }}>No pending requests.</div>
          : pendingList.map(l => (
            <div key={l.leaveId} onClick={()=>setPage("a-leave")}
              style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"12px 0", borderBottom:`1px solid ${C.border}`, flexWrap:"wrap", gap:8, cursor:"pointer" }}>
              <div>
                <div style={{ fontWeight:600, fontSize:14, color:C.navy, marginBottom:3 }}>{l.name}</div>
                <div style={{ fontSize:13, color:C.muted, display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
                  <span style={{ background:"#DBEAFE", color:"#1D4ED8", fontSize:10, fontWeight:700, padding:"2px 8px", borderRadius:20 }}>{l.leaveType}{l.isHalfDay?" (Half)":""}</span>
                  {String(l.start).substring(0,10)}{l.end!==l.start?" to "+String(l.end).substring(0,10):""} - {l.hours} hrs
                  {l.isLWOP&&<SBadge s="LWOP"/>}
                  {l.needsMedCert&&<span style={{ background:"#FEF3C7", color:"#92400E", fontSize:10, fontWeight:700, padding:"2px 8px", borderRadius:20 }}>Med Cert</span>}
                </div>
              </div>
              <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                <div style={{ fontSize:12, color:C.muted }}>Filed {l.filedOn}</div>
                <span style={{ fontSize:11, color:C.blue, fontWeight:600 }}>Review</span>
              </div>
            </div>
          ))
        }
      </Card>

      {/* Upcoming Birthdays & Anniversaries */}
      {(()=>{
        const today = nowPHT();
        const events = contractors.filter(c=>c.status==="Active").flatMap(c=>{
          const evs = [];
          if (c.dob) {
            const dob = new Date(c.dob);
            if (!isNaN(dob.getTime())) {
              const thisY = new Date(today.getFullYear(), dob.getMonth(), dob.getDate());
              const next  = thisY >= today ? thisY : new Date(today.getFullYear()+1, dob.getMonth(), dob.getDate());
              const diff  = Math.ceil((next-today)/86400000);
              if (diff<=14) evs.push({type:"birthday", name:c.name, diff, label:diff===0?"Today":diff===1?"Tomorrow":"In "+diff+" days", color:"#EC4899"});
            }
          }
          if (c.startDate) {
            const s = new Date(c.startDate);
            if (!isNaN(s.getTime())) {
              const thisY = new Date(today.getFullYear(), s.getMonth(), s.getDate());
              const next  = thisY >= today ? thisY : new Date(today.getFullYear()+1, s.getMonth(), s.getDate());
              const diff  = Math.ceil((next-today)/86400000);
              const yrs   = today.getFullYear()-s.getFullYear()+(next.getFullYear()>today.getFullYear()?1:0);
              if (diff<=14) evs.push({type:"anniversary", name:c.name, diff, label:`${yrs}yr${yrs!==1?"s":""} · `+(diff===0?"Today":diff===1?"Tomorrow":"In "+diff+" days"), color:C.blue});
            }
          }
          return evs;
        }).sort((a,b)=>a.diff-b.diff).slice(0,5);
        if (events.length===0) return null;
        return (
          <Card style={{ marginTop:14 }}>
            <div style={{ fontSize:15, fontWeight:700, marginBottom:12 }}>Upcoming This Week</div>
            {events.map((e,i)=>(
              <div key={i} style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 0", borderBottom:i<events.length-1?`1px solid ${C.border}`:"none" }}>
                <span style={{ fontSize:20 }}>{e.type==="birthday"?"🎂":"🏆"}</span>
                <div style={{ flex:1 }}>
                  <span style={{ fontWeight:600, fontSize:13, color:C.navy }}>{e.name}</span>
                  <span style={{ fontSize:12, color:C.muted, marginLeft:8 }}>{e.type==="birthday"?"Birthday":"Work Anniversary"}</span>
                </div>
                <span style={{ fontSize:12, fontWeight:700, color:e.color }}>{e.label}</span>
              </div>
            ))}
          </Card>
        );
      })()}

      {/* Announcements on Overview */}
      <Card style={{ marginTop:14 }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:16 }}>
          <div style={{ fontSize:15, fontWeight:700 }}>Latest Announcements</div>
          <button onClick={()=>setPage("a-announce")} style={{ background:"none", border:"none", color:C.blue, fontSize:13, fontWeight:600, cursor:"pointer" }}>View all</button>
        </div>
        {(announcements||INIT_ANNOUNCEMENTS).slice(0,3).map((a,i) => (
          <div key={i} onClick={()=>setPage("a-announce")}
            style={{ padding:"12px 0", borderBottom:i<2?`1px solid ${C.border}`:"none", cursor:"pointer" }}>
            <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:5 }}>
              <span style={{ background:a.tagColor, color:"#fff", fontSize:10, fontWeight:700, padding:"2px 9px", borderRadius:20 }}>{a.tag}</span>
              <span style={{ fontSize:12, color:C.muted }}>{a.date}</span>
              <span style={{ fontSize:12, color:C.muted }}>— {a.postedBy}</span>
            </div>
            <div style={{ fontWeight:600, fontSize:14, color:C.navy, marginBottom:3 }}>{a.title}</div>
            <div style={{ fontSize:13, color:C.muted, lineHeight:1.5 }}>{a.body&&a.body.length>100?a.body.substring(0,100)+"...":a.body}</div>
          </div>
        ))}
      </Card>
    </div>
  );
}

function ATeam({ user, contractors, setContractors, perms, rateHistory, setRateHistory }) {
  const [showAdd,    setShowAdd]    = useState(false);
  const [editTarget, setEditTarget] = useState(null);
  const [viewTarget, setViewTarget] = useState(null);
  const [search,     setSearch]     = useState("");
  const [filterSt,   setFilterSt]   = useState("Active");
  const [bankInfoCache, setBankInfoCache] = useState({});
  const [adminBankEdit, setAdminBankEdit] = useState(null);
  const [adminBankErr,  setAdminBankErr]  = useState("");

  const visible = getVisible(user,contractors,perms)
    .filter(c=>filterSt==="All"||c.status===filterSt)
    .filter(c=>c.name.toLowerCase().includes(search.toLowerCase())||c.client.toLowerCase().includes(search.toLowerCase()));

  const softDelete   = (un) => { if(!canDo(user.role,"delete"))return; setContractors(p=>p.map(c=>c.username===un?{...c,status:"Inactive"}:c)); if(!DEMO_MODE) callScript("updateContractor",{username:un,status:"Inactive"},()=>{},()=>{}); };
  const archive      = (un) => { if(!canDo(user.role,"delete"))return; setContractors(p=>p.map(c=>c.username===un?{...c,status:"Archived"}:c)); };
  const reactivate   = (un) => { if(!canDo(user.role,"delete"))return; setContractors(p=>p.map(c=>c.username===un?{...c,status:"Active"}:c)); if(!DEMO_MODE) callScript("updateContractor",{username:un,status:"Active"},()=>{},()=>{}); };

  return (
    <div style={{ padding:"28px 20px", maxWidth:960, margin:"0 auto" }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20, flexWrap:"wrap", gap:10 }}>
        <div style={{ fontSize:20, fontWeight:800 }}>Team Management</div>
        {canDo(user.role,"addContractor")&&<Btn onClick={()=>setShowAdd(true)}>+ Add Contractor</Btn>}
      </div>
      <div style={{ display:"flex", gap:10, marginBottom:16, flexWrap:"wrap", alignItems:"center" }}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search by name or client..." style={{ padding:"8px 13px", borderRadius:8, border:`1.5px solid ${C.border}`, fontSize:13, fontFamily:"inherit", outline:"none", width:220 }}/>
        {["All","Active","Inactive","Archived"].map(f=>(
          <button key={f} onClick={()=>setFilterSt(f)} style={{ background:filterSt===f?C.navy:C.off, color:filterSt===f?"#fff":C.muted, border:`1px solid ${filterSt===f?C.navy:C.border}`, borderRadius:7, padding:"6px 14px", fontSize:12, fontWeight:600, cursor:"pointer", fontFamily:"inherit" }}>{f}</button>
        ))}
      </div>
      <Card style={{ padding:0, overflow:"hidden" }}>
        <div style={{ overflowX:"auto" }}>
          <table style={{ width:"100%", borderCollapse:"collapse" }}>
            <thead><tr style={{ background:C.off }}>
              {["","Name","Client","Tier","Rate","Status","Role",""].map(h=>(
                <th key={h} style={{ padding:"10px 14px", textAlign:"left", fontSize:11, fontWeight:700, color:C.muted, textTransform:"uppercase", letterSpacing:"0.5px", borderBottom:`1px solid ${C.border}`, whiteSpace:"nowrap" }}>{h}</th>
              ))}
            </tr></thead>
            <tbody>
              {visible.length===0
                ? <tr><td colSpan={8} style={{ padding:32, textAlign:"center", color:C.muted, fontSize:14 }}>No contractors found.</td></tr>
                : visible.map(c=>(
                  <tr key={c.username} style={{ borderBottom:`1px solid ${C.border}`, opacity:c.status==="Archived"?0.5:1 }}>
                    <td style={{ padding:"12px 10px 12px 14px" }}>
                      <div style={{ position:"relative" }}>
                        <Avatar name={c.name} photoUrl={c.photoUrl} size={38}/>
                        {!c.photoUrl&&c.status==="Active"&&<div style={{ position:"absolute", bottom:0, right:0, width:10, height:10, borderRadius:"50%", background:C.amber, border:"2px solid #fff" }}/>}
                      </div>
                    </td>
                    <td style={{ padding:"12px 14px" }}>
                      <div style={{ fontWeight:600, fontSize:14, color:C.blue, cursor:"pointer", textDecoration:"underline", textDecorationStyle:"dotted", textUnderlineOffset:3 }}
                        onClick={()=>{
                          setViewTarget(c);
                          if (!DEMO_MODE && !bankInfoCache[c.username]) {
                            callScript("getBankInfo",{username:c.username},(json)=>{
                              if (json && json.bankInfo) setBankInfoCache(prev=>({...prev,[c.username]:json.bankInfo}));
                            },()=>{});
                          }
                        }}>{c.name}</div>
                      <div style={{ fontSize:12, color:C.muted }}>@{c.username} - {c.position}</div>
                    </td>
                    <td style={{ padding:"12px 14px" }}><span style={{ background:"#DBEAFE", color:"#1D4ED8", fontSize:11, fontWeight:700, padding:"3px 9px", borderRadius:20 }}>{c.client}</span></td>
                    <td style={{ padding:"12px 14px", fontSize:13 }}>{c.tier}</td>
                    <td style={{ padding:"12px 14px", fontSize:13, fontWeight:600, color:C.blue }}>{fmtRate(c.rate)}</td>
                    <td style={{ padding:"12px 14px" }}><SBadge s={c.status}/></td>
                    <td style={{ padding:"12px 14px" }}>
                      {user.role==="superadmin"
                        ? <select
                            value={c.role}
                            onChange={e=>{
                              const newRole = e.target.value;
                              setContractors(p=>p.map(x=>x.username===c.username?{...x,role:newRole}:x));
                              if (!DEMO_MODE) callScript("updateContractor",{username:c.username,role:newRole},()=>{},()=>{});
                            }}
                            style={{ padding:"4px 8px", borderRadius:7, border:`1px solid ${C.border}`, fontSize:11, fontFamily:"inherit", outline:"none", background:"#fff", cursor:"pointer",
                              color: c.role==="superadmin"?C.gold : c.role==="admin"?"#1D4ED8" : C.muted,
                              fontWeight:700 }}>
                            <option value="contractor">Contractor</option>
                            <option value="admin">Admin</option>
                            <option value="superadmin">Super Admin</option>
                          </select>
                        : <SBadge s={c.role}/>
                      }
                    </td>
                    <td style={{ padding:"12px 14px" }}>
                      <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                        <button onClick={()=>setEditTarget(c)} style={{ background:C.off, border:`1px solid ${C.border}`, borderRadius:6, padding:"4px 10px", fontSize:11, color:C.blue, fontWeight:600, cursor:"pointer", whiteSpace:"nowrap" }}>Edit</button>
                        {canDo(user.role,"delete")&&c.status==="Active"   &&<button onClick={()=>softDelete(c.username)} style={{ background:C.redBg,  border:"1px solid #FECACA", borderRadius:6, padding:"4px 10px", fontSize:11, color:C.red,   fontWeight:600, cursor:"pointer", whiteSpace:"nowrap" }}>Deactivate</button>}
                        {canDo(user.role,"delete")&&c.status==="Inactive" &&<button onClick={()=>reactivate(c.username)} style={{ background:C.greenBg,border:"1px solid #86EFAC", borderRadius:6, padding:"4px 10px", fontSize:11, color:C.green, fontWeight:600, cursor:"pointer", whiteSpace:"nowrap" }}>Reactivate</button>}
                        {canDo(user.role,"delete")&&c.status==="Inactive" &&<button onClick={()=>archive(c.username)}    style={{ background:C.off,   border:`1px solid ${C.border}`,  borderRadius:6, padding:"4px 10px", fontSize:11, color:C.muted, fontWeight:600, cursor:"pointer", whiteSpace:"nowrap" }}>Archive</button>}
                      </div>
                    </td>
                  </tr>
                ))
              }
            </tbody>
          </table>
        </div>
      </Card>
      {showAdd    && <ContractorModal user={user} onClose={()=>setShowAdd(false)}    onSave={c=>{
        if (!DEMO_MODE) callScript("addContractor", {...c, vlTotal:c.vlTotal||160, vlAccrued:c.vlAccrued||0, vlMonthlyRate:c.vlMonthlyRate||13.33, slTotal:c.slTotal||40}, ()=>{}, ()=>{});
        setContractors(p=>[...p,c]); setShowAdd(false);
      }} mode="add"/>}
      {editTarget && <ContractorModal user={user} onClose={()=>setEditTarget(null)}  onSave={(c, rateNote) => {
        if (!DEMO_MODE) callScript("updateContractor", c, ()=>{}, ()=>{});
        // Log rate change if rate was changed
        if (rateNote && editTarget.rate !== c.rate) {
          const entry = {
            id: "RC-"+Date.now(), contractorName: c.name, username: c.username,
            oldRate: editTarget.rate, newRate: c.rate, reason: rateNote,
            changedBy: user.name, timestamp: formatPHTTime(nowPHT(),{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"})
          };
          if (setRateHistory) setRateHistory(prev=>[entry,...prev]);
        }
        setContractors(p=>p.map(x=>x.username===c.username?c:x)); setEditTarget(null);
      }} mode="edit" existing={editTarget} rateHistory={rateHistory}/>}

      {/* Admin contractor profile view modal — mirrors CProfile layout */}
      {/* Superadmin edit bank info modal */}
      {adminBankEdit && (() => {
        const ab = adminBankEdit;
        const sab = (k,v) => setAdminBankEdit(p=>({...p,[k]:v}));
        const PH_BANKS_A = ["1st Valley Bank","AllBank","Asia United Bank (AUB)","Bank of Commerce","Bank of the Philippine Islands (BPI)","BDO Unibank","BPI Direct BanKo","China Banking Corporation (Chinabank)","CIMB Bank Philippines","Citibank Philippines","CTBC Bank Philippines","Development Bank of the Philippines (DBP)","Dungganon Bank","EastWest Bank","Enterprise Bank","GCash (G-Xchange Inc.)","GoTyme Bank","HSBC Philippines","ING Bank Philippines","Land Bank of the Philippines","Maybank Philippines","Metrobank","OFBank (Overseas Filipino Bank)","PayMaya / Maya Bank","PBB (Philippine Business Bank)","Philippine Bank of Communications (PBCom)","Philippine National Bank (PNB)","Producers Savings Bank","PSBank (Philippine Savings Bank)","RCBC (Rizal Commercial Banking Corporation)","Robinsons Bank","Rural Bank of Batangas","SB Finance","SeaBank Philippines","Security Bank","Standard Chartered Philippines","Sterling Bank of Asia","Tonik Digital Bank","UnionBank of the Philippines","Wealth Development Bank"];
        const saveAdminBank = () => {
          if (!ab.bankName||!ab.accountNumber) { setAdminBankErr("Bank name and account number are required."); return; }
          const payload = { username:ab.username, bankName:ab.bankName, accountNumber:ab.accountNumber, swiftCode:ab.swiftCode||"", wiseEmail:ab.wiseEmail||"", payoutMethod:ab.payoutMethod||"Wise" };
          if (!DEMO_MODE) callScript("saveBankInfo", payload, ()=>{}, ()=>{});
          setBankInfoCache(prev=>({...prev,[ab.username]:payload}));
          toast("Payment info updated for "+ab.username);
          setAdminBankEdit(null); setAdminBankErr("");
        };
        return (
          <div style={{ position:"fixed", inset:0, background:"rgba(27,42,74,0.7)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:400, padding:16 }} onClick={e=>e.target===e.currentTarget&&setAdminBankEdit(null)}>
            <div style={{ background:"#fff", borderRadius:16, width:"100%", maxWidth:480, padding:28, boxShadow:"0 24px 80px rgba(0,0,0,0.3)" }}>
              <div style={{ fontSize:16, fontWeight:800, color:C.navy, marginBottom:18 }}>Edit Payment Info — {ab.username}</div>
              <FieldLabel required>Bank Name</FieldLabel>
              <select value={ab._bankPreset||""} onChange={e=>{ const v=e.target.value; sab("_bankPreset",v); if(v!=="__manual__") sab("bankName",v); else sab("bankName",""); }} style={{ width:"100%", padding:"10px 13px", borderRadius:10, border:`1.5px solid ${C.border}`, fontSize:14, fontFamily:"inherit", outline:"none", background:"#fff", marginBottom:8 }}>
                <option value="">Select a bank...</option>
                {PH_BANKS_A.map(b=>(<option key={b} value={b}>{b}</option>))}
                <option value="__manual__">Other (type manually)</option>
              </select>
              {(ab._bankPreset==="__manual__"||(ab.bankName&&!PH_BANKS_A.includes(ab.bankName)))&&(
                <FieldInput value={ab.bankName||""} onChange={e=>sab("bankName",e.target.value)} placeholder="Enter bank name manually" style={{ marginBottom:8 }}/>
              )}
              <FieldLabel required>Account Number</FieldLabel>
              <FieldInput value={ab.accountNumber||""} onChange={e=>sab("accountNumber",e.target.value)} placeholder="Account number" style={{ marginBottom:8 }}/>
              <FieldLabel>SWIFT / BIC (optional)</FieldLabel>
              <FieldInput value={ab.swiftCode||""} onChange={e=>sab("swiftCode",e.target.value)} placeholder="e.g. BNORPHMM" style={{ marginBottom:8 }}/>
              <FieldLabel>Wise Email (optional)</FieldLabel>
              <FieldInput value={ab.wiseEmail||""} onChange={e=>sab("wiseEmail",e.target.value)} placeholder="wise@email.com" style={{ marginBottom:8 }}/>
              <FieldLabel>Preferred Payout</FieldLabel>
              <select value={ab.payoutMethod||"Wise"} onChange={e=>sab("payoutMethod",e.target.value)} style={{ width:"100%", padding:"10px 13px", borderRadius:10, border:`1.5px solid ${C.border}`, fontSize:14, fontFamily:"inherit", outline:"none", background:"#fff", marginBottom:16 }}>
                <option>Wise</option><option>Bank Transfer</option>
              </select>
              {adminBankErr&&<div style={{ color:C.red, fontSize:12, marginBottom:10 }}>{adminBankErr}</div>}
              <div style={{ display:"flex", gap:10, justifyContent:"flex-end" }}>
                <button onClick={()=>{setAdminBankEdit(null);setAdminBankErr("");}} style={{ background:C.off, border:`1px solid ${C.border}`, borderRadius:8, padding:"8px 18px", fontSize:13, cursor:"pointer", fontFamily:"inherit" }}>Cancel</button>
                <Btn onClick={saveAdminBank}>Save</Btn>
              </div>
            </div>
          </div>
        );
      })()}

      {viewTarget && (()=>{
        const vt = viewTarget;
        const vtBankInfo = bankInfoCache[vt.username] || null;
        const vtInitials = vt.name ? String(vt.name || vt.username || "").split(" ").map(n=>n[0]).join("").slice(0,2).toUpperCase() : "?";
        const vtVLBal = Math.max(0, parseFloat(((vt.vlAccrued||0)-(vt.vlUsed||0)-(vt.vlPending||0)).toFixed(2)));
        const vtSLBal = Math.max(0, parseFloat(((vt.slTotal||0)-(vt.slUsed||0)-(vt.slPending||0)).toFixed(2)));
        const vtTenure = (() => {
          if (!vt.startDate) return "—";
          const start = new Date(vt.startDate);
          if (isNaN(start.getTime())) return vt.startDate;
          const now = new Date();
          let yrs = now.getFullYear()-start.getFullYear();
          let mons = now.getMonth()-start.getMonth();
          if (mons<0){yrs--;mons+=12;}
          if (yrs===0) return mons+" mo";
          return yrs+" yr"+(yrs!==1?"s":"")+(mons>0?" "+mons+" mo":"");
        })();
        const tiers = { LAUNCH:"Starter", ANCHOR:"Core Team", ELEVATE:"Senior/Specialist" };
        const fullAddr = [vt.addrStreet,vt.addrCity,vt.addrProvince,vt.addrCountry,vt.addrZip].filter(Boolean).join(", ");
        const fieldStyle2 = { padding:"10px 0", borderBottom:`1px solid ${C.border}` };
        const labelStyle2 = { fontSize:11, fontWeight:700, color:C.muted, textTransform:"uppercase", letterSpacing:"0.6px", marginBottom:3 };
        const valStyle2   = { fontSize:14, fontWeight:500, color:C.navy };

        return (
          <div style={{ position:"fixed", inset:0, background:"rgba(27,42,74,0.7)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:300, padding:16 }} onClick={e=>e.target===e.currentTarget&&setViewTarget(null)}>
            <div style={{ background:"#F7F9FB", borderRadius:16, width:"100%", maxWidth:860, maxHeight:"92vh", overflowY:"auto", boxShadow:"0 24px 80px rgba(0,0,0,0.3)" }}>

              {/* Modal top bar */}
              <div style={{ background:`linear-gradient(135deg,${C.navy},${C.blueDk})`, padding:"16px 24px", display:"flex", justifyContent:"space-between", alignItems:"center", borderRadius:"16px 16px 0 0" }}>
                <div style={{ fontSize:16, fontWeight:800, color:"#fff" }}>Contractor Profile</div>
                <div style={{ display:"flex", gap:10 }}>
                  <Btn onClick={()=>{ setEditTarget(vt); setViewTarget(null); }} style={{ padding:"7px 16px", fontSize:13 }}>Edit Profile</Btn>
                  <button onClick={()=>setViewTarget(null)} style={{ background:"rgba(255,255,255,0.15)", border:"none", borderRadius:8, padding:"6px 14px", color:"#fff", cursor:"pointer", fontSize:18, lineHeight:1 }}>×</button>
                </div>
              </div>

              <div style={{ padding:"20px", display:"grid", gridTemplateColumns:"200px 1fr", gap:16, alignItems:"start" }}>

                {/* Left panel */}
                <div>
                  <div style={{ background:"#fff", borderRadius:12, border:`1px solid ${C.border}`, padding:18, textAlign:"center", marginBottom:14 }}>
                    {vt.photoUrl
                      ? <img src={vt.photoUrl} alt={vt.name} style={{ width:76, height:76, borderRadius:"50%", objectFit:"cover", border:`3px solid ${C.cyan}`, marginBottom:10 }} onError={e=>{e.target.style.display="none";}}/>
                      : <div style={{ width:76, height:76, borderRadius:"50%", background:`linear-gradient(135deg,${C.cyan},${C.blueDk})`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:24, fontWeight:800, color:"#fff", margin:"0 auto 10px" }}>{vtInitials}</div>
                    }
                    <div style={{ fontSize:15, fontWeight:800, color:C.navy, marginBottom:2 }}>{vt.name}</div>
                    <div style={{ fontSize:12, color:C.muted, marginBottom:10 }}>{vt.position}</div>
                    <div style={{ display:"flex", gap:5, justifyContent:"center", flexWrap:"wrap" }}>
                      {vt.client && <span style={{ fontSize:10, fontWeight:700, background:"#DBEAFE", color:"#1D4ED8", padding:"2px 8px", borderRadius:20 }}>{vt.client}</span>}
                      {vt.tier   && <span style={{ fontSize:10, fontWeight:700, background:"#DCFCE7", color:"#166534", padding:"2px 8px", borderRadius:20 }}>{vt.tier}</span>}
                      {vt.status && <span style={{ fontSize:10, fontWeight:700, background:vt.status==="Active"?C.greenBg:C.off, color:vt.status==="Active"?C.green:C.muted, padding:"2px 8px", borderRadius:20 }}>{vt.status}</span>}
                    </div>
                  </div>

                  {/* Quick stats */}
                  <div style={{ background:"#fff", borderRadius:12, border:`1px solid ${C.border}`, padding:"14px 16px" }}>
                    <div style={{ fontSize:11, fontWeight:700, color:C.muted, textTransform:"uppercase", letterSpacing:"0.6px", marginBottom:10 }}>Quick Stats</div>
                    {[
                      ["Tenure",       vtTenure],
                      ["Contract",     vt.contractType||"—"],
                      ["Rate",         fmtRate(vt.rate)],
                      ["VL Balance",   vtVLBal+" hrs"],
                      ["VL Used",      (vt.vlUsed||0)+" hrs"],
                      ["SL Balance",   vtSLBal+" hrs"],
                      ["SL Used",      (vt.slUsed||0)+" hrs"],
                    ].map(([l,v])=>(
                      <div key={l} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"5px 0", borderBottom:`1px solid ${C.border}` }}>
                        <span style={{ fontSize:11, color:C.muted }}>{l}</span>
                        <span style={{ fontSize:11, fontWeight:700, color:l.includes("VL")&&l==="VL Balance"?C.blue:l.includes("SL")&&l==="SL Balance"?C.cyan:C.navy }}>{v}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Right panel */}
                <div>

                  {/* Work Information */}
                  <div style={{ background:"#fff", borderRadius:12, border:`1px solid ${C.border}`, marginBottom:14, overflow:"hidden" }}>
                    <div style={{ padding:"12px 18px 8px", borderBottom:`1px solid ${C.border}`, fontSize:12, fontWeight:700, color:C.muted, textTransform:"uppercase", letterSpacing:"0.6px" }}>💼 Work Information</div>
                    <div style={{ padding:"4px 18px 14px" }}>
                      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"0 20px" }}>
                        {[
                          ["Full Name",     vt.name],
                          ["Work Email",    vt.email],
                          ["Position",      vt.position],
                          ["Supervisor",    vt.supervisor||"Not set"],
                          ["Client",        vt.client],
                          ["Start Date",    vt.startDate],
                          ["Service Tier",  vt.tier+(tiers[vt.tier]?" — "+tiers[vt.tier]:"")],
                          ["Contract Type", vt.contractType||"Not set"],
                          ["Status",        vt.status],
                          ["Role",          vt.role],
                        ].map(([l,v])=>(
                          <div key={l} style={fieldStyle2}>
                            <div style={labelStyle2}>{l}</div>
                            <div style={{...valStyle2, color:l==="Status"?(vt.status==="Active"?C.green:C.muted):C.navy}}>{v||"—"}</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Personal Information */}
                  <div style={{ background:"#fff", borderRadius:12, border:`1px solid ${C.border}`, marginBottom:14, overflow:"hidden" }}>
                    <div style={{ padding:"12px 18px 8px", borderBottom:`1px solid ${C.border}`, fontSize:12, fontWeight:700, color:C.muted, textTransform:"uppercase", letterSpacing:"0.6px" }}>👤 Personal Information</div>
                    <div style={{ padding:"4px 18px 14px" }}>
                      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"0 20px" }}>
                        <div style={fieldStyle2}>
                          <div style={labelStyle2}>Date of Birth</div>
                          <div style={valStyle2}>{vt.dob||<span style={{ color:C.muted, fontStyle:"italic" }}>Not set</span>}</div>
                        </div>
                        <div style={fieldStyle2}>
                          <div style={labelStyle2}>Personal Gmail</div>
                          <div style={valStyle2}>{vt.personalGmail||<span style={{ color:C.muted, fontStyle:"italic" }}>Not set</span>}</div>
                        </div>
                        <div style={{ ...fieldStyle2, gridColumn:"1/-1", borderBottom:"none" }}>
                          <div style={labelStyle2}>Address</div>
                          <div style={valStyle2}>{fullAddr||<span style={{ color:C.muted, fontStyle:"italic" }}>Not set</span>}</div>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Payment Information — view only for admin, editable for superadmin */}
                  <div style={{ background:"#fff", borderRadius:12, border:`1px solid ${C.border}`, overflow:"hidden" }}>
                    <div style={{ padding:"12px 18px 8px", borderBottom:`1px solid ${C.border}`, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                      <span style={{ fontSize:12, fontWeight:700, color:C.muted, textTransform:"uppercase", letterSpacing:"0.6px" }}>🏦 Payment Information</span>
                      {user.role==="superadmin" && (
                        <button onClick={()=>{
                          const bk = vtBankInfo||{};
                          const PH_BANKS_A = ["1st Valley Bank","AllBank","Asia United Bank (AUB)","Bank of Commerce","Bank of the Philippine Islands (BPI)","BDO Unibank","BPI Direct BanKo","China Banking Corporation (Chinabank)","CIMB Bank Philippines","Citibank Philippines","CTBC Bank Philippines","Development Bank of the Philippines (DBP)","Dungganon Bank","EastWest Bank","Enterprise Bank","GCash (G-Xchange Inc.)","GoTyme Bank","HSBC Philippines","ING Bank Philippines","Land Bank of the Philippines","Maybank Philippines","Metrobank","OFBank (Overseas Filipino Bank)","PayMaya / Maya Bank","PBB (Philippine Business Bank)","Philippine Bank of Communications (PBCom)","Philippine National Bank (PNB)","Producers Savings Bank","PSBank (Philippine Savings Bank)","RCBC (Rizal Commercial Banking Corporation)","Robinsons Bank","Rural Bank of Batangas","SB Finance","SeaBank Philippines","Security Bank","Standard Chartered Philippines","Sterling Bank of Asia","Tonik Digital Bank","UnionBank of the Philippines","Wealth Development Bank"];
                          const existing = bk.bankName||"";
                          const preset = PH_BANKS_A.includes(existing)?existing:(existing?"__manual__":"");
                          setAdminBankEdit({username:vt.username, bankName:existing, accountNumber:bk.accountNumber||"", swiftCode:bk.swiftCode||"", wiseEmail:bk.wiseEmail||"", payoutMethod:bk.payoutMethod||"Wise", _bankPreset:preset});
                        }} style={{ fontSize:11, fontWeight:700, color:C.blue, background:"none", border:"none", cursor:"pointer", padding:0 }}>✏️ Edit</button>
                      )}
                    </div>
                    <div style={{ padding:"14px 18px" }}>
                      {vtBankInfo && vtBankInfo.bankName ? (
                        <div>
                          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"0 20px" }}>
                            {[
                              ["Bank Name",    vtBankInfo.bankName],
                              ["Account",      "••••  ••••  "+String(vtBankInfo.accountNumber||"").slice(-4)],
                              ["SWIFT/BIC",    vtBankInfo.swiftCode||"—"],

                      )}
                    </div>

}

// ── ADMIN PAYSLIPS PAGE ──────────────────────────────────────────────
function APayslips({ user, contractors, payslips, setPayslips, perms }) {
  const [showForm,    setShowForm]    = useState(false);
  const [searchName,  setSearchName]  = useState("");
  const [filterClient,setFilterClient]= useState("All");
  const [filterPeriod,setFilterPeriod]= useState("");
  const [form,        setForm]        = useState({ username:"", period:"", gross:"", allowance:"", deductions:"", adjustments:"", net:"", status:"Paid", released:"" });
  const [err,         setErr]         = useState("");
  const [ok,          setOk]          = useState("");
  const [loading,     setLoading]     = useState(false);

  const visible   = getVisible(user, contractors, perms);
  const visUnames = new Set(visible.map(c=>c.username.toLowerCase()));
  const set       = (k,v) => setForm(f=>({...f,[k]:v}));

  const clientsInScope = ["All", ...new Set(visible.map(c=>c.client))];

  const allPeriods = [...new Set(payslips.filter(p=>visUnames.has((p.username||"").toLowerCase())).map(p=>p.period).filter(Boolean))];

  // Filter payslips to only those in scope + apply search filters
  const filtered = payslips.filter(p => {
    if (!p.username) return false;
    const un = p.username.toLowerCase();
    if (!visUnames.has(un)) return false;
    if (searchName && !p.username.toLowerCase().includes(searchName.toLowerCase()) &&
        !(p.name||"").toLowerCase().includes(searchName.toLowerCase())) return false;
    if (filterClient !== "All") {
      const c = visible.find(ct=>ct.username.toLowerCase()===un);
      if (!c || c.client !== filterClient) return false;
    }
    if (filterPeriod && !(p.period||"").toLowerCase().includes(filterPeriod.toLowerCase())) return false;
    return true;
  });

  const calcNet = (f) => {
    const g  = parseFloat(String(f.gross||"").replace(/[^0-9.]/g,""))||0;
    const al = parseFloat(String(f.allowance||"").replace(/[^0-9.]/g,""))||0;
    const d  = parseFloat(String(f.deductions||"").replace(/[^0-9.]/g,""))||0;
    const aj = parseFloat(String(f.adjustments||"").replace(/[^0-9.-]/g,""))||0;
    return g + al - d + aj;
  };

  const save = () => {
    setErr("");
    if (!form.username||!form.period||!form.gross) { setErr("Contractor, period, and gross pay are required."); return; }
    setLoading(true);
    const net = "$"+calcNet(form).toFixed(2);
    const cInfo = contractors.find(c=>c.username===form.username)||{};
    const entry = { ...form, net, name: cInfo.name||form.username };
    if (!DEMO_MODE) {
      callScript("addPayslip", {...form, net}, ()=>{
        setPayslips(p=>[entry,...p]);
        setForm({ username:"", period:"", gross:"", allowance:"", deductions:"", adjustments:"", net:"", status:"Paid", released:"" });
        setOk("Payslip saved successfully."); setLoading(false); toast("Payslip saved ✓");
        setTimeout(()=>setOk(""),3000);
      }, ()=>{ setErr("Failed to save. Try again."); setLoading(false); });
    } else {
      setPayslips(p=>[entry,...p]);
      setForm({ username:"", period:"", gross:"", allowance:"", deductions:"", adjustments:"", net:"", status:"Paid", released:"" });
      setOk("Payslip saved. (Demo)"); setLoading(false); toast("Payslip saved ✓");
      setTimeout(()=>setOk(""),3000);
    }
  };

  const netPreview = form.gross ? calcNet(form) : null;

  return (
    <div style={{ padding:"28px 20px", maxWidth:1060, margin:"0 auto" }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20, flexWrap:"wrap", gap:10 }}>
        <div style={{ fontSize:20, fontWeight:800 }}>Payslips</div>
        <Btn onClick={()=>setShowForm(!showForm)}>+ Add Payslip</Btn>
      </div>

      {showForm && (
        <Card style={{ marginBottom:20 }}>
          <div style={{ fontSize:15, fontWeight:700, marginBottom:16 }}>New Payslip</div>
          {err && <Alert type="error">{err}</Alert>}
          {ok  && <Alert type="success">{ok}</Alert>}
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))", gap:14, marginBottom:14 }}>
            <div>
              <FieldLabel required>Contractor</FieldLabel>
              <select value={form.username} onChange={e=>set("username",e.target.value)}
                style={{ width:"100%", padding:"10px 13px", borderRadius:10, border:`1.5px solid ${C.border}`, fontSize:14, fontFamily:"inherit", outline:"none", background:"#fff" }}>
                <option value="">Select contractor...</option>
                {visible.filter(c=>c.status==="Active").map(c=><option key={c.username} value={c.username}>{c.name} (@{c.username})</option>)}
              </select>
            </div>
            <div><FieldLabel required>Pay Period</FieldLabel><FieldInput value={form.period} onChange={e=>set("period",e.target.value)} placeholder="e.g. May 16-31, 2025"/></div>
            <div><FieldLabel required>Gross Pay</FieldLabel><FieldInput value={form.gross} onChange={e=>set("gross",e.target.value)} placeholder="e.g. $560.00"/></div>
            <div><FieldLabel>Allowance</FieldLabel><FieldInput value={form.allowance||""} onChange={e=>set("allowance",e.target.value)} placeholder="e.g. $10.00"/></div>
            <div><FieldLabel>Deductions</FieldLabel><FieldInput value={form.deductions} onChange={e=>set("deductions",e.target.value)} placeholder="e.g. $28.00"/></div>
            <div><FieldLabel>Adjustments</FieldLabel><FieldInput value={form.adjustments} onChange={e=>set("adjustments",e.target.value)} placeholder="e.g. $50.00 or -$20.00"/></div>
            <div>
              <FieldLabel>Status</FieldLabel>
              <select value={form.status} onChange={e=>set("status",e.target.value)}
                style={{ width:"100%", padding:"10px 13px", borderRadius:10, border:`1.5px solid ${C.border}`, fontSize:14, fontFamily:"inherit", outline:"none", background:"#fff" }}>
                <option value="Paid">Paid</option>
                <option value="Pending">Pending</option>
              </select>
            </div>
            <div><FieldLabel>Date Released</FieldLabel><FieldInput type="date" value={form.released} onChange={e=>set("released",e.target.value)}/></div>
          </div>
          {netPreview!==null && (
            <div style={{ padding:"10px 14px", background:C.off, borderRadius:8, fontSize:13, marginBottom:14 }}>
              Net Pay Preview: <b style={{ color:C.blue, fontSize:15 }}>${netPreview.toFixed(2)}</b>
            </div>
          )}
          <div style={{ display:"flex", gap:10 }}>
            <Btn onClick={save} disabled={loading} style={{ padding:"10px 24px" }}>{loading?"Saving...":"Save Payslip"}</Btn>
            <Btn variant="secondary" onClick={()=>{ setShowForm(false); setErr(""); }} style={{ padding:"10px 24px" }}>Cancel</Btn>
          </div>
        </Card>
      )}

      {/* Filters */}
      <div style={{ display:"flex", gap:10, marginBottom:16, flexWrap:"wrap", alignItems:"center" }}>
        <input value={searchName} onChange={e=>setSearchName(e.target.value)} placeholder="Search name or username..."
          style={{ padding:"8px 13px", borderRadius:8, border:`1.5px solid ${C.border}`, fontSize:13, fontFamily:"inherit", outline:"none", width:220 }}/>
        <select value={filterClient} onChange={e=>setFilterClient(e.target.value)}
          style={{ padding:"8px 13px", borderRadius:8, border:`1.5px solid ${C.border}`, fontSize:13, fontFamily:"inherit", outline:"none", background:"#fff" }}>
          {clientsInScope.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
        <select value={filterPeriod} onChange={e=>setFilterPeriod(e.target.value)}
          style={{ padding:"8px 13px", borderRadius:8, border:`1.5px solid ${C.border}`, fontSize:13, fontFamily:"inherit", outline:"none", background:"#fff" }}>
          <option value="">All Periods</option>
          {allPeriods.map(p=><option key={p} value={p}>{p}</option>)}
        </select>
        {(searchName||filterClient!=="All"||filterPeriod) &&
          <button onClick={()=>{ setSearchName(""); setFilterClient("All"); setFilterPeriod(""); }}
            style={{ padding:"8px 12px", borderRadius:8, border:`1px solid ${C.border}`, background:"#fff", color:C.muted, fontSize:12, cursor:"pointer", fontFamily:"inherit" }}>
            Clear filters
          </button>
        }
        <span style={{ fontSize:12, color:C.muted, marginLeft:"auto" }}>{filtered.length} payslip{filtered.length!==1?"s":""}</span>
      </div>

      <Card style={{ padding:0, overflow:"hidden" }}>
        <div style={{ overflowX:"auto" }}>
          <table style={{ width:"100%", borderCollapse:"collapse" }}>
            <thead><tr style={{ background:C.off }}>
              {["Contractor","Client","Period","Gross Pay","Allowance","Deductions","Adjustments","Net Pay","Status","Released"].map(h=>(
                <th key={h} style={{ padding:"10px 14px", textAlign:"left", fontSize:11, fontWeight:700, color:C.muted, textTransform:"uppercase", letterSpacing:"0.5px", borderBottom:`1px solid ${C.border}`, whiteSpace:"nowrap" }}>{h}</th>
              ))}
            </tr></thead>
            <tbody>
              {filtered.length===0
                ? <tr><td colSpan={10} style={{ padding:32, textAlign:"center", color:C.muted, fontSize:14 }}>No payslips found.</td></tr>
                : filtered.map((p,i)=>{
                    const cInfo = visible.find(c=>c.username.toLowerCase()===(p.username||"").toLowerCase());
                    return (
                      <tr key={i} className="tr-hover" style={{ borderBottom:`1px solid ${C.border}` }}>
                        <td style={{ padding:"11px 14px" }}>
                          <div style={{ fontWeight:600, fontSize:13 }}>{p.name||cInfo&&cInfo.name||p.username}</div>
                          <div style={{ fontSize:11, color:C.muted }}>@{p.username}</div>
                        </td>
                        <td style={{ padding:"11px 14px" }}>
                          {cInfo && <span style={{ background:"#DBEAFE", color:"#1D4ED8", fontSize:10, fontWeight:700, padding:"2px 8px", borderRadius:20 }}>{cInfo.client}</span>}
                        </td>
                        <td style={{ padding:"11px 14px", fontSize:13 }}>{p.period}</td>
                        <td style={{ padding:"11px 14px", fontSize:13 }}>{fmtCur(p.gross)}</td>
                        <td style={{ padding:"11px 14px", fontSize:13 }}>{fmtCur(p.allowance)}</td>
                        <td style={{ padding:"11px 14px", fontSize:13 }}>{fmtCur(p.deductions)}</td>
                        <td style={{ padding:"11px 14px", fontSize:13 }}>{fmtCur(p.adjustments)}</td>
                        <td style={{ padding:"11px 14px", fontSize:13, fontWeight:700 }}>{fmtCur(p.net)}</td>
                        <td style={{ padding:"11px 14px" }}><SBadge s={p.status}/></td>
                        <td style={{ padding:"11px 14px", fontSize:12, color:C.muted }}>{fmtRelease(p.released)}</td>
