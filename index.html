                    );
                  })
              }
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}


// ── LEAVE CALENDAR ───────────────────────────────────────────────────
function ALeaveCalendar({ leaves, contractors, perms, user }) {
  const today = new Date();
  const [year,  setYear]  = useState(today.getFullYear());
  const [month, setMonth] = useState(today.getMonth());

  // Admin/superadmin see ALL contractors on leave calendar
  const allContrs = contractors.filter(c=>c.status==="Active"||!c.status);
  const CLIENT_COLORS = ["#2E86C1","#5BC8E8","#16A34A","#D97706","#7C3AED","#DC2626","#0E7490"];
  const clients = [...new Set(allContrs.map(c=>c.client).filter(Boolean))];
  const colorMap = {};
  clients.forEach((cl,i) => colorMap[cl] = CLIENT_COLORS[i % CLIENT_COLORS.length]);

  const daysInMonth = new Date(year, month+1, 0).getDate();
  const firstDay    = new Date(year, month, 1).getDay();
  const monthName   = new Date(year, month, 1).toLocaleString("en-US",{month:"long",year:"numeric"});

  const approvedLeaves = leaves.filter(l=>l.status==="Approved"||l.status==="Pending");

  const getLeavesForDay = (day) => {
    const pad = (n) => String(n).padStart(2,"0");
    const dStr = `${year}-${pad(month+1)}-${pad(day)}`;
    return approvedLeaves.filter(l => {
      const normDate = (v) => v ? String(v).substring(0,10) : "";
      const startStr = normDate(l.start);
      const endStr   = normDate(l.end||l.start);
      if (!startStr) return false;
      return dStr >= startStr && dStr <= endStr;
    });
  };

  const prevMonth = () => { if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1); };
  const nextMonth = () => { if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1); };

  const cells = [];
  for(let i=0;i<firstDay;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);

  const isToday = (d) => d && year===today.getFullYear() && month===today.getMonth() && d===today.getDate();

  return (
    <div style={{ padding:"28px 20px", maxWidth:1000, margin:"0 auto" }}>
      <div style={{ fontSize:20, fontWeight:800, marginBottom:20 }}>Leave Calendar</div>

      {/* Legend */}
      <div style={{ display:"flex", gap:12, flexWrap:"wrap", marginBottom:16 }}>
        {clients.map(cl=>(
          <div key={cl} style={{ display:"flex", alignItems:"center", gap:6 }}>
            <div style={{ width:12, height:12, borderRadius:3, background:colorMap[cl] }}/>
            <span style={{ fontSize:12, color:C.muted, fontWeight:600 }}>{cl}</span>
          </div>
        ))}
        <div style={{ display:"flex", alignItems:"center", gap:6 }}>
          <div style={{ width:12, height:12, borderRadius:3, background:C.amberBg, border:`1px solid ${C.amber}` }}/>
          <span style={{ fontSize:12, color:C.muted, fontWeight:600 }}>Pending</span>
        </div>
      </div>

      <Card>
        {/* Month nav */}
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:16 }}>
          <button onClick={prevMonth} style={{ background:C.off, border:`1px solid ${C.border}`, borderRadius:8, padding:"6px 14px", cursor:"pointer", fontSize:16, fontFamily:"inherit" }}>‹</button>
          <div style={{ fontSize:16, fontWeight:800, color:C.navy }}>{monthName}</div>
          <button onClick={nextMonth} style={{ background:C.off, border:`1px solid ${C.border}`, borderRadius:8, padding:"6px 14px", cursor:"pointer", fontSize:16, fontFamily:"inherit" }}>›</button>
        </div>

        {/* Day headers */}
        <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:2, marginBottom:4 }}>
          {["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>(
            <div key={d} style={{ textAlign:"center", fontSize:11, fontWeight:700, color:C.muted, textTransform:"uppercase", padding:"4px 0" }}>{d}</div>
          ))}
        </div>

        {/* Calendar grid */}
        <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:2 }}>
          {cells.map((d,i)=>{
            const dayLeaves = d ? getLeavesForDay(d) : [];
            return (
              <div key={i} style={{ minHeight:72, borderRadius:8, padding:"4px 6px", background:isToday(d)?"#EFF6FF":d?"#fff":"transparent", border:isToday(d)?`2px solid ${C.blue}`:`1px solid ${C.border}` }}>
                {d && (
                  <>
                    <div style={{ fontSize:12, fontWeight:isToday(d)?800:500, color:isToday(d)?C.blue:C.navy, marginBottom:3 }}>{d}</div>
                    {dayLeaves.slice(0,3).map((l,j)=>{
                      const c = allContrs.find(ct=>ct.username===l.username);
                      const bg = l.status==="Pending" ? C.amberBg : (colorMap[c&&c.client]||C.blue);
                      const col = l.status==="Pending" ? C.amber : "#fff";
                      return (
                        <div key={j} title={c?c.name:l.username} style={{ background:bg, color:col, fontSize:9, fontWeight:700, padding:"2px 5px", borderRadius:4, marginBottom:2, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
                          {c?String(c.name || c.username || "").split(" ")[0]:String(l.username || "").split("")[0]} {l.isHalfDay?"½":l.leaveType==="VL"?"VL":"SL"}
                        </div>
                      );
                    })}
                    {dayLeaves.length>3 && <div style={{ fontSize:9, color:C.muted, fontWeight:600 }}>+{dayLeaves.length-3} more</div>}
                  </>
                )}
              </div>
            );
          })}
        </div>
      </Card>
    </div>
  );
}


// ── HR CALENDAR (Birthdays + 6-Month Eval + Anniversaries) ──────────
function AHRCalendar({ contractors }) {
  const today = nowPHT();
  const [viewMonth, setViewMonth] = useState(today.getMonth());
  const [viewYear,  setViewYear]  = useState(today.getFullYear());
  const [filter,    setFilter]    = useState("all"); // all | birthday | eval | anniversary

  const EVENT_TYPES = {
    birthday:    { icon:"🎂", label:"Birthday",          color:"#EC4899" },
    eval:        { icon:"📋", label:"6-Month Evaluation", color:"#7C3AED" },
    anniversary: { icon:"🏆", label:"Work Anniversary",   color:C.blue   },
  };

  const getEventsForMonth = (month, year) => {
    const events = [];
    contractors.filter(c=>c.status==="Active"||!c.status).forEach(c => {

      // ── Birthday ──
      if (c.dob) {
        const dob = new Date(c.dob);
        if (!isNaN(dob.getTime()) && dob.getMonth()===month) {
          events.push({ type:"birthday", name:c.name, client:c.client, day:dob.getDate(),
            label:`Turning ${year - dob.getFullYear()}`, color:EVENT_TYPES.birthday.color });
        }
      }

      // ── 6-Month Evaluation ──
      if (c.startDate) {
        const start = new Date(c.startDate);
        if (!isNaN(start.getTime())) {
          // Every 6 months from start date
          let evalDate = new Date(start);
          evalDate.setMonth(evalDate.getMonth() + 6);
          while (evalDate.getFullYear() < year || (evalDate.getFullYear()===year && evalDate.getMonth() < month)) {
            evalDate.setMonth(evalDate.getMonth() + 6);
          }
          if (evalDate.getMonth()===month && evalDate.getFullYear()===year) {
            const months = Math.round((evalDate - start) / (1000*60*60*24*30.44));
            events.push({ type:"eval", name:c.name, client:c.client, day:evalDate.getDate(),
              label:`${months}-month eval`, color:EVENT_TYPES.eval.color });
          }
        }
      }

      // ── Work Anniversary ──
      if (c.startDate) {
        const start = new Date(c.startDate);
        if (!isNaN(start.getTime()) && start.getMonth()===month) {
          const years = year - start.getFullYear();
          if (years > 0) {
            events.push({ type:"anniversary", name:c.name, client:c.client, day:start.getDate(),
              label:`${years} year${years!==1?"s":""}`, color:EVENT_TYPES.anniversary.color });
          }
        }
      }
    });
    return events;
  };

  // Upcoming events (next 60 days from today)
  const getUpcoming = () => {
    const events = [];
    contractors.filter(c=>c.status==="Active"||!c.status).forEach(c => {

      // Birthday
      if (c.dob) {
        const dob = new Date(c.dob);
        if (!isNaN(dob.getTime())) {
          const thisYr = new Date(today.getFullYear(), dob.getMonth(), dob.getDate());
          const ev = thisYr >= today ? thisYr : new Date(today.getFullYear()+1, dob.getMonth(), dob.getDate());
          const diff = Math.ceil((ev - today) / 86400000);
          if (diff <= 60) {
            const age = today.getFullYear() - dob.getFullYear() + (ev.getFullYear() > today.getFullYear() ? 1 : 0);
            events.push({ type:"birthday", name:c.name, client:c.client, date:ev, diff, label:`Turning ${age}`, color:EVENT_TYPES.birthday.color });
          }
        }
      }

      // 6-Month Eval
      if (c.startDate) {
        const start = new Date(c.startDate);
        if (!isNaN(start.getTime())) {
          let evalDate = new Date(start);
          evalDate.setMonth(evalDate.getMonth() + 6);
          while (evalDate < today) evalDate.setMonth(evalDate.getMonth() + 6);
          const diff = Math.ceil((evalDate - today) / 86400000);
          if (diff <= 60) {
            const months = Math.round((evalDate - start) / (1000*60*60*24*30.44));
            events.push({ type:"eval", name:c.name, client:c.client, date:evalDate, diff, label:`${months}-month eval`, color:EVENT_TYPES.eval.color });
          }
        }
      }

      // Anniversary
      if (c.startDate) {
        const start = new Date(c.startDate);
        if (!isNaN(start.getTime())) {
          const thisYr = new Date(today.getFullYear(), start.getMonth(), start.getDate());
          const ev = thisYr >= today ? thisYr : new Date(today.getFullYear()+1, start.getMonth(), start.getDate());
          const diff = Math.ceil((ev - today) / 86400000);
          if (diff <= 60) {
            const years = today.getFullYear() - start.getFullYear() + (ev.getFullYear() > today.getFullYear() ? 1 : 0);
            if (years > 0) events.push({ type:"anniversary", name:c.name, client:c.client, date:ev, diff, label:`${years} year${years!==1?"s":""}`, color:EVENT_TYPES.anniversary.color });
          }
        }
      }
    });
    return events.sort((a,b)=>a.diff-b.diff);
  };

  const allEvents   = getEventsForMonth(viewMonth, viewYear);
  const filtered    = filter==="all" ? allEvents : allEvents.filter(e=>e.type===filter);
  const upcoming    = getUpcoming();
  const upFiltered  = filter==="all" ? upcoming : upcoming.filter(e=>e.type===filter);

  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const firstDay    = new Date(viewYear, viewMonth, 1).getDay();
  const monthName   = new Date(viewYear, viewMonth, 1).toLocaleString("en-US",{month:"long",year:"numeric"});
  const prevM = () => { if(viewMonth===0){setViewMonth(11);setViewYear(y=>y-1);}else setViewMonth(m=>m-1); };
  const nextM = () => { if(viewMonth===11){setViewMonth(0);setViewYear(y=>y+1);}else setViewMonth(m=>m+1); };
  const isToday = (d) => d && viewYear===today.getFullYear() && viewMonth===today.getMonth() && d===today.getDate();

  const getEventsForDay = (day) => filtered.filter(e => e.day===day);

  const cells = [];
  for(let i=0;i<firstDay;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);

  const btnStyle = (active) => ({ padding:"6px 14px", borderRadius:20, border:`1.5px solid ${active?C.blue:C.border}`, background:active?"#DBEAFE":"#fff", color:active?C.blue:C.muted, fontSize:12, fontWeight:active?700:500, cursor:"pointer", fontFamily:"inherit" });

  return (
    <div style={{ padding:"28px 20px", maxWidth:1060, margin:"0 auto" }}>
      <div style={{ fontSize:20, fontWeight:800, marginBottom:6 }}>HR Calendar</div>
      <div style={{ fontSize:14, color:C.muted, marginBottom:16 }}>Birthdays, 6-month evaluations, and work anniversaries.</div>

      {/* Filter pills */}
      <div style={{ display:"flex", gap:8, marginBottom:20, flexWrap:"wrap" }}>
        <button onClick={()=>setFilter("all")}         style={btnStyle(filter==="all")}>All Events</button>
        <button onClick={()=>setFilter("birthday")}    style={btnStyle(filter==="birthday")}>🎂 Birthdays</button>
        <button onClick={()=>setFilter("eval")}        style={btnStyle(filter==="eval")}>📋 6-Month Evals</button>
        <button onClick={()=>setFilter("anniversary")} style={btnStyle(filter==="anniversary")}>🏆 Anniversaries</button>
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"1fr 300px", gap:20, alignItems:"start" }}>
        {/* Calendar */}
        <Card>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:16 }}>
            <button onClick={prevM} style={{ background:C.off, border:`1px solid ${C.border}`, borderRadius:8, padding:"6px 14px", cursor:"pointer", fontSize:16 }}>‹</button>
            <div style={{ fontSize:15, fontWeight:800, color:C.navy }}>{monthName}</div>
            <button onClick={nextM} style={{ background:C.off, border:`1px solid ${C.border}`, borderRadius:8, padding:"6px 14px", cursor:"pointer", fontSize:16 }}>›</button>
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:2, marginBottom:4 }}>
            {["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>(
              <div key={d} style={{ textAlign:"center", fontSize:11, fontWeight:700, color:C.muted, textTransform:"uppercase", padding:"4px 0" }}>{d}</div>
            ))}
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:2 }}>
            {cells.map((d,i)=>{
              const evs = d ? getEventsForDay(d) : [];
              return (
                <div key={i} style={{ minHeight:72, borderRadius:8, padding:"4px 6px", background:isToday(d)?"#EFF6FF":d?"#fff":"transparent", border:isToday(d)?`2px solid ${C.blue}`:`1px solid ${C.border}` }}>
                  {d && (
                    <>
                      <div style={{ fontSize:12, fontWeight:isToday(d)?800:500, color:isToday(d)?C.blue:C.navy, marginBottom:3 }}>{d}</div>
                      {evs.map((e,j)=>(
                        <div key={j} title={`${e.name} · ${EVENT_TYPES[e.type].icon} ${e.label}`}
                          style={{ background:e.color+"22", color:e.color, fontSize:9, fontWeight:700, padding:"2px 5px", borderRadius:4, marginBottom:2, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
                          {EVENT_TYPES[e.type].icon} {String(e.name || "").split(" ")[0]}
                        </div>
                      ))}
                    </>
                  )}
                </div>
              );
            })}
          </div>
        </Card>

        {/* Upcoming events panel */}
        <div>
          <Card style={{ marginBottom:14 }}>
            <div style={{ fontSize:14, fontWeight:700, marginBottom:14 }}>Upcoming (60 days)</div>
            {upFiltered.length===0
              ? <div style={{ fontSize:13, color:C.muted }}>No upcoming events.</div>
              : upFiltered.map((e,i)=>(
                <div key={i} style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 0", borderBottom:i<upFiltered.length-1?`1px solid ${C.border}`:"none" }}>
                  <div style={{ width:36, height:36, borderRadius:10, background:e.color+"22", display:"flex", alignItems:"center", justifyContent:"center", fontSize:18, flexShrink:0 }}>
                    {EVENT_TYPES[e.type].icon}
                  </div>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize:13, fontWeight:700, color:C.navy, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{e.name}</div>
                    <div style={{ fontSize:11, color:e.color, fontWeight:600 }}>{EVENT_TYPES[e.type].icon} {e.label}</div>
                    <div style={{ fontSize:11, color:C.muted }}>{e.client}</div>
                  </div>
                  <div style={{ textAlign:"right", flexShrink:0 }}>
                    <div style={{ fontSize:12, fontWeight:700, color:e.color }}>{e.diff===0?"Today":e.diff===1?"Tomorrow":"In "+e.diff+"d"}</div>
                    <div style={{ fontSize:10, color:C.muted }}>{e.date.toLocaleDateString("en-PH",{month:"short",day:"numeric"})}</div>
                  </div>
                </div>
              ))
            }
          </Card>
          {/* Legend */}
          <Card style={{ padding:14 }}>
            <div style={{ fontSize:12, fontWeight:700, color:C.muted, marginBottom:10, textTransform:"uppercase", letterSpacing:"0.5px" }}>Legend</div>
            {Object.entries(EVENT_TYPES).map(([k,v])=>(
              <div key={k} style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8 }}>
                <div style={{ width:10, height:10, borderRadius:3, background:v.color, flexShrink:0 }}/>
                <span style={{ fontSize:12 }}>{v.icon} {v.label}</span>
              </div>
            ))}
            <div style={{ marginTop:10, paddingTop:10, borderTop:`1px solid ${C.border}`, fontSize:11, color:C.muted, lineHeight:1.5 }}>
              6-month evals recur every 6 months from each contractor's start date.
            </div>
          </Card>
        </div>
      </div>
    </div>
  );
}


// ── PAYROLL SUMMARY PAGE ─────────────────────────────────────────────
function APayrollSummary({ payslips, contractors, perms, user }) {
  const [filterPeriod,     setFilterPeriod]     = useState("");
  const [filterClient,     setFilterClient]     = useState("");
  const [filterIndividual, setFilterIndividual] = useState("");

  const visible   = getVisible(user, contractors, perms);
  const visUnames = new Set(visible.map(c=>c.username.toLowerCase()));
  const toNum = (v) => { if (!v) return 0; const n=parseFloat(String(v).replace(/[^0-9.-]/g,"")); return isNaN(n)?0:n; };

  const inScope = payslips.filter(p => p.username && visUnames.has(p.username.toLowerCase()));
  const allPeriods = [...new Set(inScope.map(p=>p.period).filter(Boolean))];
  const allClients = [...new Set(inScope.map(p=>{ const c=visible.find(ct=>ct.username.toLowerCase()===(p.username||"").toLowerCase()); return c?c.client:"Unknown"; }).filter(Boolean))].sort();
  const allIndividuals = [...new Set(inScope.map(p=>p.username).filter(Boolean))].sort().map(u=>{ const c=visible.find(ct=>ct.username.toLowerCase()===u.toLowerCase()); return { username:u, name:c?c.name:u }; });

  const scoped = inScope.filter(p => {
    if (filterPeriod && !(p.period||"").toLowerCase().includes(filterPeriod.toLowerCase())) return false;
    if (filterClient) { const c=visible.find(ct=>ct.username.toLowerCase()===(p.username||"").toLowerCase()); if (!c||c.client!==filterClient) return false; }
    if (filterIndividual && (p.username||"").toLowerCase()!==filterIndividual.toLowerCase()) return false;
    return true;
  });

  const totalGross  = scoped.reduce((s,p)=>s+toNum(p.gross),0);
  const totalAllow  = scoped.reduce((s,p)=>s+toNum(p.allowance),0);
  const totalDeduct = scoped.reduce((s,p)=>s+toNum(p.deductions),0);
  const totalAdj    = scoped.reduce((s,p)=>s+toNum(p.adjustments),0);
  const totalNet    = scoped.reduce((s,p)=>s+toNum(p.net),0);

  const byClient = {};
  scoped.forEach(p => {
    const c = visible.find(ct=>ct.username.toLowerCase()===(p.username||"").toLowerCase());
    const cl = c ? c.client : "Unknown";
    if (!byClient[cl]) byClient[cl] = { gross:0, net:0, count:0 };
    byClient[cl].gross += toNum(p.gross); byClient[cl].net += toNum(p.net); byClient[cl].count += 1;
  });

  const byIndividual = {};
  scoped.forEach(p => {
    const u = (p.username||"").toLowerCase();
    if (!byIndividual[u]) { const c=visible.find(ct=>ct.username.toLowerCase()===u); byIndividual[u]={ name:c?c.name:p.username, client:c?c.client:"", gross:0, net:0, allowance:0, deductions:0, adjustments:0, count:0 }; }
    byIndividual[u].gross+=toNum(p.gross); byIndividual[u].net+=toNum(p.net); byIndividual[u].allowance+=toNum(p.allowance); byIndividual[u].deductions+=toNum(p.deductions); byIndividual[u].adjustments+=toNum(p.adjustments); byIndividual[u].count+=1;
  });

  const CLIENT_COLORS = ["#2E86C1","#5BC8E8","#16A34A","#D97706","#7C3AED","#DC2626"];
  const ss = { padding:"8px 13px", borderRadius:8, border:`1.5px solid ${C.border}`, fontSize:13, fontFamily:"inherit", outline:"none", background:"#fff", minWidth:175 };
  const hasFilters = filterPeriod||filterClient||filterIndividual;

  return (
    <div style={{ padding:"28px 20px", maxWidth:1000, margin:"0 auto" }}>
      <div style={{ fontSize:20, fontWeight:800, marginBottom:6 }}>Payroll Summary</div>
      <div style={{ fontSize:14, color:C.muted, marginBottom:20 }}>Computed from payslip records in your scope.</div>

      <div style={{ display:"flex", gap:10, marginBottom:20, flexWrap:"wrap", alignItems:"center" }}>
        <select value={filterPeriod} onChange={e=>setFilterPeriod(e.target.value)} style={ss}>
          <option value="">All Periods</option>
          {allPeriods.map(p=><option key={p} value={p}>{p}</option>)}
        </select>
        <select value={filterClient} onChange={e=>{ setFilterClient(e.target.value); setFilterIndividual(""); }} style={ss}>
          <option value="">All Clients</option>
          {allClients.map(cl=><option key={cl} value={cl}>{cl}</option>)}
        </select>
        <select value={filterIndividual} onChange={e=>{ setFilterIndividual(e.target.value); setFilterClient(""); }} style={ss}>
          <option value="">All Contractors</option>
          {allIndividuals.map(i=><option key={i.username} value={i.username}>{i.name}</option>)}
        </select>
        {hasFilters && <button onClick={()=>{ setFilterPeriod(""); setFilterClient(""); setFilterIndividual(""); }} style={{ padding:"8px 14px", borderRadius:8, border:`1px solid ${C.border}`, background:"#fff", color:C.muted, fontSize:12, cursor:"pointer", fontFamily:"inherit" }}>Clear filters</button>}
        <span style={{ fontSize:12, color:C.muted, marginLeft:"auto" }}>{scoped.length} payslip{scoped.length!==1?"s":""}</span>
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))", gap:14, marginBottom:24 }}>
        {[
          { label:"Total Gross",       value:fmtCur(totalGross),  color:C.navy },
          { label:"Total Allowance",   value:fmtCur(totalAllow),  color:C.blue },
          { label:"Total Deductions",  value:fmtCur(totalDeduct), color:C.red },
          { label:"Total Adjustments", value:fmtCur(totalAdj),    color:C.amber },
          { label:"Total Net Pay",     value:fmtCur(totalNet),    color:C.green },
        ].map(s=>(
          <Card key={s.label} style={{ padding:18, borderLeft:`4px solid ${s.color}` }}>
            <div style={{ fontSize:11, fontWeight:700, color:C.muted, textTransform:"uppercase", letterSpacing:"0.5px", marginBottom:8 }}>{s.label}</div>
            <div style={{ fontSize:22, fontWeight:800, color:s.color }}>{s.value}</div>
          </Card>
        ))}
      </div>

      <Card style={{ marginBottom:20 }}>
        <div style={{ fontSize:15, fontWeight:700, marginBottom:16 }}>Breakdown by Client</div>
        {Object.keys(byClient).length===0
          ? <div style={{ color:C.muted, fontSize:14 }}>No payslip data for selected filters.</div>
          : <div style={{ overflowX:"auto" }}>
              <table style={{ width:"100%", borderCollapse:"collapse" }}>
                <thead><tr style={{ background:C.off }}>
                  {["Client","Payslips","Gross Pay","Net Pay","% of Total Net"].map(h=>(
                    <th key={h} style={{ padding:"10px 14px", textAlign:"left", fontSize:11, fontWeight:700, color:C.muted, textTransform:"uppercase", letterSpacing:"0.5px", borderBottom:`1px solid ${C.border}`, whiteSpace:"nowrap" }}>{h}</th>
                  ))}
                </tr></thead>
                <tbody>
                  {Object.entries(byClient).sort((a,b)=>b[1].net-a[1].net).map(([cl,data],i)=>(
                    <tr key={cl} className="tr-hover" style={{ borderBottom:`1px solid ${C.border}` }}>
                      <td style={{ padding:"12px 14px" }}><div style={{ display:"flex", alignItems:"center", gap:8 }}><div style={{ width:10, height:10, borderRadius:3, background:CLIENT_COLORS[i%CLIENT_COLORS.length] }}/><span style={{ fontWeight:600, fontSize:14 }}>{cl}</span></div></td>
                      <td style={{ padding:"12px 14px", fontSize:13, color:C.muted }}>{data.count}</td>
                      <td style={{ padding:"12px 14px", fontSize:13 }}>{fmtCur(data.gross)}</td>
                      <td style={{ padding:"12px 14px", fontWeight:700, color:C.blue }}>{fmtCur(data.net)}</td>
                      <td style={{ padding:"12px 14px" }}>
                        <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                          <div style={{ flex:1, height:6, background:C.off, borderRadius:3, overflow:"hidden" }}><div style={{ height:"100%", width:`${totalNet>0?Math.round(data.net/totalNet*100):0}%`, background:CLIENT_COLORS[i%CLIENT_COLORS.length], borderRadius:3 }}/></div>
                          <span style={{ fontSize:12, fontWeight:600, color:C.muted, width:36, textAlign:"right" }}>{totalNet>0?Math.round(data.net/totalNet*100):0}%</span>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
        }
      </Card>

      <Card>
        <div style={{ fontSize:15, fontWeight:700, marginBottom:16 }}>Breakdown by Contractor</div>
        {Object.keys(byIndividual).length===0
          ? <div style={{ color:C.muted, fontSize:14 }}>No payslip data for selected filters.</div>
          : <div style={{ overflowX:"auto" }}>
              <table style={{ width:"100%", borderCollapse:"collapse" }}>
                <thead><tr style={{ background:C.off }}>
                  {["Contractor","Client","Payslips","Gross Pay","Allowance","Deductions","Adjustments","Net Pay"].map(h=>(
                    <th key={h} style={{ padding:"10px 14px", textAlign:"left", fontSize:11, fontWeight:700, color:C.muted, textTransform:"uppercase", letterSpacing:"0.5px", borderBottom:`1px solid ${C.border}`, whiteSpace:"nowrap" }}>{h}</th>
                  ))}
                </tr></thead>
                <tbody>
                  {Object.entries(byIndividual).sort((a,b)=>b[1].net-a[1].net).map(([uname,data],i)=>(
                    <tr key={uname} className="tr-hover" style={{ borderBottom:`1px solid ${C.border}` }}>
                      <td style={{ padding:"11px 14px" }}><div style={{ fontWeight:600, fontSize:13 }}>{data.name}</div><div style={{ fontSize:11, color:C.muted }}>@{uname}</div></td>
                      <td style={{ padding:"11px 14px" }}>{data.client&&<span style={{ background:"#DBEAFE", color:"#1D4ED8", fontSize:10, fontWeight:700, padding:"2px 8px", borderRadius:20 }}>{data.client}</span>}</td>
                      <td style={{ padding:"11px 14px", fontSize:13, color:C.muted }}>{data.count}</td>
                      <td style={{ padding:"11px 14px", fontSize:13 }}>{fmtCur(data.gross)}</td>
                      <td style={{ padding:"11px 14px", fontSize:13 }}>{fmtCur(data.allowance)}</td>
                      <td style={{ padding:"11px 14px", fontSize:13 }}>{fmtCur(data.deductions)}</td>
                      <td style={{ padding:"11px 14px", fontSize:13 }}>{fmtCur(data.adjustments)}</td>
                      <td style={{ padding:"11px 14px", fontWeight:700, color:C.blue }}>{fmtCur(data.net)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
        }
      </Card>
    </div>
  );
}

function ALeaveApprovals({ user, leaves, setLeaves, setContractors, contractors, perms, onNotify }) {
  const [filter,       setFilter]       = useState("Pending");
  const [searchLeave,  setSearchLeave]  = useState("");
  const [rejectModal,  setRejectModal]  = useState(null); // holds leaveId being rejected
  const [rejectReason, setRejectReason] = useState("");
  const [rejectErr,    setRejectErr]    = useState("");

  const visible   = getVisible(user,contractors,perms);
  const myLeaves  = leaves.filter(l=>visible.find(c=>c.username===l.username));
  const filtered  = myLeaves
    .filter(l=>filter==="All"||l.status===filter)
    .filter(l=>!searchLeave||
      (l.name||"").toLowerCase().includes(searchLeave.toLowerCase())||
      (l.username||"").toLowerCase().includes(searchLeave.toLowerCase()));
  const pendingCt = myLeaves.filter(l=>l.status==="Pending").length;

  const action = (leaveId, act, reason) => {
    const leave = leaves.find(l=>l.leaveId===leaveId); if(!leave)return;
    const dated = user.name+" - "+formatPHT(nowPHT(),{month:"short",day:"numeric",year:"numeric"});
    if (!DEMO_MODE) callScript(
      act==="approve" ? "approveLeave" : "rejectLeave",
      act==="approve"
        ? { leaveId, adminName:user.name }
        : { leaveId, adminName:user.name, rejectReason:reason||"" },
      ()=>{}, ()=>{}
    );
    setLeaves(prev=>prev.map(l=>l.leaveId===leaveId?{...l,status:act==="approve"?"Approved":"Rejected",actionedBy:dated}:l));
    if (onNotify) onNotify("Leave "+(act==="approve"?"Approved":"Rejected"), leave.name+"'s "+leave.leaveType+" request was "+(act==="approve"?"approved":"rejected")+".");
    toast(leave.name+"'s "+leave.leaveType+" "+(act==="approve"?"approved ✓":"rejected"), act==="approve"?"success":"error");
    if (act==="approve") {
      setContractors(prev=>prev.map(c=>{
        if (c.username!==leave.username)return c;
        const hrs=parseFloat(leave.hours);
        if (leave.leaveType==="VL")return{...c,vlPending:Math.max(0,parseFloat((c.vlPending-hrs).toFixed(2))),vlUsed:parseFloat((c.vlUsed+hrs).toFixed(2))};
        return{...c,slPending:Math.max(0,parseFloat((c.slPending-hrs).toFixed(2))),slUsed:parseFloat((c.slUsed+hrs).toFixed(2))};
      }));
    } else {
      setContractors(prev=>prev.map(c=>{
        if (c.username!==leave.username)return c;
        const hrs=parseFloat(leave.hours);
        if (leave.leaveType==="VL")return{...c,vlPending:Math.max(0,parseFloat((c.vlPending-hrs).toFixed(2)))};
        return{...c,slPending:Math.max(0,parseFloat((c.slPending-hrs).toFixed(2)))};
      }));
    }
  };

  const openReject = (leaveId) => { setRejectModal(leaveId); setRejectReason(""); setRejectErr(""); };

  const confirmReject = () => {
    if (!rejectReason.trim()) { setRejectErr("Please provide a reason for rejection."); return; }
    action(rejectModal, "reject", rejectReason.trim());
    setRejectModal(null);
    setRejectReason("");
  };

  return (
    <div style={{ padding:"28px 20px", maxWidth:900, margin:"0 auto" }}>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:20, flexWrap:"wrap", gap:10 }}>
        <div style={{ display:"flex", alignItems:"center", gap:12 }}>
          <div style={{ fontSize:20, fontWeight:800 }}>Leave Approvals</div>
          {pendingCt>0&&<span style={{ background:C.amberBg, color:C.amber, fontSize:11, fontWeight:700, padding:"3px 10px", borderRadius:20 }}>{pendingCt} pending</span>}
        </div>
        <div style={{ display:"flex", gap:8, flexWrap:"wrap", alignItems:"center" }}>
          <input value={searchLeave} onChange={e=>setSearchLeave(e.target.value)} placeholder="Search contractor..."
            style={{ padding:"6px 12px", borderRadius:8, border:`1.5px solid ${C.border}`, fontSize:12, fontFamily:"inherit", outline:"none", width:180 }}/>
          {["All","Pending","Approved","Rejected"].map(f=>(
            <button key={f} onClick={()=>setFilter(f)} style={{ background:filter===f?C.navy:C.off, color:filter===f?"#fff":C.muted, border:`1px solid ${filter===f?C.navy:C.border}`, borderRadius:7, padding:"6px 14px", fontSize:12, fontWeight:600, cursor:"pointer", fontFamily:"inherit" }}>{f}</button>
          ))}
        </div>
      </div>
      {filtered.length===0
        ? <Card style={{ textAlign:"center", color:C.muted, padding:40, fontSize:14 }}>No {filter==="All"?"":filter.toLowerCase()+" "}leave requests.</Card>
        : filtered.map(l=>(
          <div key={l.leaveId} style={{ background:"#fff", borderRadius:10, padding:"18px 20px", marginBottom:12, border:`1px solid ${C.border}`, borderLeft:`4px solid ${l.leaveType==="VL"?C.blue:C.cyan}` }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", flexWrap:"wrap", gap:8, marginBottom:l.status==="Pending"?12:0 }}>
              <div>
                <div style={{ fontWeight:700, fontSize:15, color:C.navy, marginBottom:5 }}>{l.name} <span style={{ fontWeight:400, color:C.muted, fontSize:13 }}>@{l.username}</span></div>
                <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", fontSize:13, color:C.muted }}>
                  <span style={{ background:"#DBEAFE", color:"#1D4ED8", fontSize:10, fontWeight:700, padding:"2px 9px", borderRadius:20 }}>{l.leaveType}{l.isHalfDay?" - Half Day":""}</span>
                  {String(l.start).substring(0,10)}{l.end!==l.start?" to "+String(l.end).substring(0,10):""} - <b style={{ color:C.navy }}>{l.isHalfDay?"0.5 day":l.days+" day"+(l.days>1?"s":"")} ({l.hours} hrs)</b>
                  {l.reason&&<span>- "{l.reason}"</span>}
                  {l.approvalFileName&&<span style={{background:"#DCFCE7",color:"#16A34A",fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:20}}>📎 {l.approvalFileName}</span>}
                  {l.isLWOP&&<SBadge s="LWOP"/>}
                  {l.needsMedCert&&<span style={{ background:"#FEF3C7", color:"#92400E", fontSize:10, fontWeight:700, padding:"2px 8px", borderRadius:20 }}>Med Cert</span>}
                </div>
              </div>
              <div style={{ textAlign:"right" }}>
                <SBadge s={l.status}/>
                <div style={{ fontSize:11, color:C.muted, marginTop:4 }}>Filed {l.filedOn}</div>
                {l.actionedBy&&<div style={{ fontSize:11, color:C.muted }}>By: {l.actionedBy}</div>}
              </div>
            </div>
            {l.status==="Pending"&&(
              <div style={{ display:"flex", gap:8 }}>
                <Btn variant="success" onClick={()=>action(l.leaveId,"approve")} style={{ padding:"7px 16px", fontSize:13 }}>Approve</Btn>
                <Btn variant="danger"  onClick={()=>openReject(l.leaveId)}       style={{ padding:"7px 16px", fontSize:13 }}>Reject</Btn>
              </div>
            )}
          </div>
        ))
      }

      {/* Rejection reason modal */}
      {rejectModal && (
        <div style={{ position:"fixed", inset:0, background:"rgba(27,42,74,0.65)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:300, padding:16 }}>
          <div style={{ background:"#fff", borderRadius:16, padding:32, width:"100%", maxWidth:440, boxShadow:"0 24px 80px rgba(0,0,0,0.3)" }}>
            <div style={{ fontSize:18, fontWeight:800, color:C.navy, marginBottom:6 }}>Reject Leave Request</div>
            <div style={{ fontSize:13, color:C.muted, marginBottom:20, lineHeight:1.5 }}>
              Please provide a reason for rejection. This will be emailed to the contractor and CC'd to <b>hr@elitegrid.co</b>.
            </div>
            <FieldLabel required>Reason for Rejection</FieldLabel>
            <textarea
              value={rejectReason}
              onChange={e=>{ setRejectReason(e.target.value); setRejectErr(""); }}
              placeholder="e.g. Insufficient leave balance, project deadline conflict, overlapping team leave..."
              rows={4}
              style={{ width:"100%", padding:"10px 13px", borderRadius:10, border:`1.5px solid ${rejectErr?C.red:C.border}`, fontSize:13, fontFamily:"inherit", outline:"none", resize:"vertical", marginBottom:rejectErr?6:14, boxSizing:"border-box" }}
            />
            {rejectErr && <div style={{ fontSize:12, color:C.red, marginBottom:12 }}>{rejectErr}</div>}
            <div style={{ display:"flex", gap:10 }}>
              <Btn variant="danger" onClick={confirmReject} style={{ flex:1, padding:11 }}>Confirm Rejection</Btn>
              <Btn variant="secondary" onClick={()=>{ setRejectModal(null); setRejectReason(""); setRejectErr(""); }} style={{ flex:1, padding:11 }}>Cancel</Btn>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function APTOManagement({ user, contractors, setContractors, auditLog, setAuditLog, perms }) {
  const [sel,setSel]         = useState(null);
  const [adjField,setAdjField] = useState("vlAccrued");
  const [adjValue,setAdjValue] = useState("");
  const [adjReason,setAdjReason] = useState("");
  const [adjErr,setAdjErr]   = useState("");
  const [adjOk,setAdjOk]     = useState(false);
  const visible = getVisible(user,contractors,perms).filter(c=>c.status==="Active");

  const submitAdj = () => {
    setAdjErr("");
    if (!adjValue||isNaN(adjValue)) { setAdjErr("Please enter a valid number."); return; }
    if (!adjReason.trim())          { setAdjErr("A reason is required."); return; }
    const newVal = parseFloat(adjValue);
    if (adjField==="vlAccrued"&&newVal>200) { setAdjErr("VL cannot exceed 200 hours (25 day cap)."); return; }
    const oldVal = sel[adjField];
    const entry = { id:"AUD-"+Date.now(), admin:user.name, contractor:sel.username, field:adjField, oldVal, newVal, reason:adjReason, timestamp:formatPHTTime(nowPHT(),{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"}), notified:true };
    if (!DEMO_MODE) callScript("adjustPTO", {adminUsername:user.username||user._username, contractorUsername:sel.username, field:adjField, newValue:newVal, reason:adjReason}, ()=>{}, ()=>{});
    setAuditLog(prev=>[entry,...prev]);
    setContractors(prev=>prev.map(c=>c.username===sel.username?{...c,[adjField]:newVal}:c));
    setSel(prev=>({...prev,[adjField]:newVal}));
    setAdjOk(true); setAdjValue(""); setAdjReason("");
    setTimeout(()=>setAdjOk(false),3000);
  };

  return (
    <div style={{ padding:"28px 20px", maxWidth:960, margin:"0 auto" }}>
      <div style={{ fontSize:20, fontWeight:800, marginBottom:20 }}>PTO Management</div>
      <div style={{ display:"grid", gridTemplateColumns:sel?"1fr 360px":"1fr", gap:20, alignItems:"start" }}>
        <Card style={{ padding:0, overflow:"hidden" }}>
          <div style={{ padding:"16px 20px", fontWeight:700, fontSize:15, borderBottom:`1px solid ${C.border}` }}>Contractor Balances</div>
          <div style={{ overflowX:"auto" }}>
            <table style={{ width:"100%", borderCollapse:"collapse" }}>
              <thead><tr style={{ background:C.off }}>
                {["Name","Client","VL Available","VL Accrued","SL Available","Rate/mo",""].map(h=>(
                  <th key={h} style={{ padding:"9px 14px", textAlign:"left", fontSize:11, fontWeight:700, color:C.muted, textTransform:"uppercase", letterSpacing:"0.4px", borderBottom:`1px solid ${C.border}`, whiteSpace:"nowrap" }}>{h}</th>
                ))}
              </tr></thead>
              <tbody>
                {visible.map(c=>{
                  const vlAvail=Math.max(0,parseFloat((c.vlAccrued-c.vlUsed-c.vlPending).toFixed(2)));
                  const slAvail=Math.max(0,parseFloat((c.slTotal-c.slUsed-c.slPending).toFixed(2)));
                  const atCap=parseFloat(c.vlAccrued)>=200;
                  return (
                    <tr key={c.username} style={{ borderBottom:`1px solid ${C.border}`, background:(sel && sel.username===c.username)?"#F0F7FF":"#fff" }}>
                      <td style={{ padding:"12px 14px" }}>
                        <div style={{ fontWeight:600, fontSize:14 }}>{c.name}</div>
                        <div style={{ fontSize:12, color:C.muted }}>@{c.username}</div>
                      </td>
                      <td style={{ padding:"12px 14px" }}><span style={{ background:"#DBEAFE", color:"#1D4ED8", fontSize:10, fontWeight:700, padding:"2px 8px", borderRadius:20 }}>{c.client}</span></td>
                      <td style={{ padding:"12px 14px", fontWeight:700, color:C.blue }}>{vlAvail} hrs</td>
                      <td style={{ padding:"12px 14px", fontSize:13 }}>
                        {c.vlAccrued} hrs
                        {atCap&&<span style={{ marginLeft:6, background:C.amberBg, color:C.amber, fontSize:9, fontWeight:700, padding:"1px 6px", borderRadius:20 }}>CAP</span>}
                      </td>
                      <td style={{ padding:"12px 14px", fontWeight:700, color:C.cyan }}>{slAvail} hrs</td>
                      <td style={{ padding:"12px 14px", fontSize:13, color:C.muted }}>{c.vlMonthlyRate}/mo</td>
                      <td style={{ padding:"12px 14px" }}>
                        {canDo(user.role,"adjustPTO")&&(
                          <button onClick={()=>{setSel(c);setAdjErr("");setAdjOk(false);setAdjValue("");setAdjReason("");}}
                            style={{ background:C.off, border:`1px solid ${C.border}`, borderRadius:6, padding:"4px 10px", fontSize:11, color:C.blue, fontWeight:600, cursor:"pointer" }}>Adjust</button>
                        )}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </Card>
        {sel&&(
          <Card>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
              <div style={{ fontSize:15, fontWeight:700 }}>Adjust PTO</div>
              <button onClick={()=>setSel(null)} style={{ background:"none", border:"none", color:C.muted, fontSize:20, cursor:"pointer", lineHeight:1 }}>x</button>
            </div>
            <div style={{ fontSize:14, fontWeight:600, color:C.navy, marginBottom:2 }}>{sel.name}</div>
            <div style={{ fontSize:12, color:C.muted, marginBottom:16 }}>@{sel.username} - {sel.client}</div>
            <FieldLabel>Field to Adjust</FieldLabel>
            <select value={adjField} onChange={e=>{setAdjField(e.target.value);setAdjErr("");}} style={{ width:"100%", padding:"10px 13px", borderRadius:8, border:`1.5px solid ${C.border}`, fontSize:13, fontFamily:"inherit", outline:"none", marginBottom:14, background:"#fff" }}>
              {[["vlAccrued","VL Accrued"],["vlUsed","VL Used"],["vlPending","VL Pending"],["slTotal","SL Total"],["slUsed","SL Used"],["slPending","SL Pending"]].map(([k,l])=>(
                <option key={k} value={k}>{l} (current: {sel[k]} hrs)</option>
              ))}
            </select>
            <FieldLabel required>New Value (hrs)</FieldLabel>
            <FieldInput type="number" value={adjValue} onChange={e=>setAdjValue(e.target.value)} placeholder={`Current: ${sel[adjField]}`} style={{ marginBottom:14 }}/>
            <FieldLabel required>Reason</FieldLabel>
            <textarea value={adjReason} onChange={e=>setAdjReason(e.target.value)} rows={2} placeholder="Required - e.g. Missed May accrual correction" style={{ width:"100%", padding:"10px 13px", borderRadius:8, border:`1.5px solid ${C.border}`, fontSize:13, fontFamily:"inherit", outline:"none", resize:"vertical", boxSizing:"border-box", marginBottom:10 }}/>
            <div style={{ fontSize:11, color:"#92400E", background:C.amberBg, borderRadius:7, padding:"8px 12px", marginBottom:14 }}>Super Admin will be notified of this change.</div>
            {adjErr&&<Alert type="error">{adjErr}</Alert>}
            {adjOk &&<Alert type="success">Saved. Super Admin notified. (Demo)</Alert>}
            <Btn onClick={submitAdj} style={{ width:"100%", padding:11 }}>Save Adjustment</Btn>
          </Card>
        )}
      </div>
    </div>
  );
}

function AAnnouncements({ user, announcements, setAnnouncements }) {
  const [showForm,setShowForm] = useState(false);
  const [title,setTitle]       = useState("");
  const [body,setBody]         = useState("");
  const [tag,setTag]           = useState("HR");
  const [tagColor,setTagColor] = useState(C.cyan);
  const [err,setErr]           = useState("");
  const tagOptions = [["Payroll",C.blue],["HR",C.cyan],["Operations",C.blueDk],["General",C.navy]];

  const post = () => {
    if (!title.trim()||!body.trim()) { setErr("Title and body are required."); return; }
    const newAnn = { annId:"ANN-"+Date.now(), title, body, tag, tagColor, date:formatPHT(nowPHT(),{month:"short",day:"numeric",year:"numeric"}), postedBy:user.name };
    if (!DEMO_MODE) callScript("postAnnouncement", {title, body, tag, tagColor, postedBy:user.name}, ()=>{}, ()=>{});
    setAnnouncements(prev=>[newAnn,...prev]);
    setTitle(""); setBody(""); setShowForm(false); setErr("");
  };

  return (
    <div style={{ padding:"28px 20px", maxWidth:700, margin:"0 auto" }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20, flexWrap:"wrap", gap:10 }}>
        <div style={{ fontSize:20, fontWeight:800 }}>Announcements</div>
        {canDo(user.role,"postAnnouncement")&&<Btn onClick={()=>setShowForm(!showForm)}>+ Post Announcement</Btn>}
      </div>
      {showForm&&(
        <Card style={{ marginBottom:20 }}>
          <div style={{ fontSize:15, fontWeight:700, marginBottom:16 }}>New Announcement</div>
          {err&&<Alert type="error">{err}</Alert>}
          <FieldLabel required>Title</FieldLabel>
          <FieldInput value={title} onChange={e=>setTitle(e.target.value)} placeholder="Announcement title" style={{ marginBottom:14 }}/>
          <FieldLabel required>Body</FieldLabel>
          <textarea value={body} onChange={e=>setBody(e.target.value)} rows={3} placeholder="Announcement content..." style={{ width:"100%", padding:"10px 13px", borderRadius:8, border:`1.5px solid ${C.border}`, fontSize:14, fontFamily:"inherit", outline:"none", resize:"vertical", boxSizing:"border-box", marginBottom:14 }}/>
          <div style={{ marginBottom:16 }}>
            <FieldLabel>Tag</FieldLabel>
            <select value={tag} onChange={e=>{ const t=tagOptions.find(x=>x[0]===e.target.value); setTag(e.target.value); if(t)setTagColor(t[1]); }} style={{ width:"100%", padding:"10px 13px", borderRadius:8, border:`1.5px solid ${C.border}`, fontSize:13, fontFamily:"inherit", outline:"none", background:"#fff" }}>
              {tagOptions.map(([t])=><option key={t} value={t}>{t}</option>)}
            </select>
          </div>
          <div style={{ display:"flex", gap:10 }}>
            <Btn onClick={post} style={{ flex:1, padding:11 }}>Post</Btn>
            <Btn variant="secondary" onClick={()=>{setShowForm(false);setErr("");}} style={{ flex:1, padding:11 }}>Cancel</Btn>
          </div>
        </Card>
      )}
      <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
        {announcements.map((a,i)=>(
          <Card key={i} style={{ position:"relative" }}>
            {canDo(user.role,"deleteAnnouncement")&&(
              <button onClick={()=>setAnnouncements(prev=>prev.filter((_,idx)=>idx!==i))}
                style={{ position:"absolute", top:16, right:16, background:C.redBg, border:"1px solid #FECACA", borderRadius:6, padding:"3px 10px", fontSize:11, color:C.red, fontWeight:600, cursor:"pointer" }}>Delete</button>
            )}
            <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:10 }}>
              <span style={{ background:a.tagColor, color:"#fff", fontSize:10, fontWeight:700, padding:"3px 10px", borderRadius:20 }}>{a.tag}</span>
              <span style={{ fontSize:12, color:C.muted }}>{a.date}</span>
              <span style={{ fontSize:12, color:C.muted }}>- {a.postedBy}</span>
            </div>
            <div style={{ fontWeight:700, fontSize:16, color:C.navy, marginBottom:8 }}>{a.title}</div>
            <div style={{ fontSize:14, color:"#4A5568", lineHeight:1.65 }}>{a.body}</div>
          </Card>
        ))}
      </div>
    </div>
  );
}

// ── EMAIL BLAST ───────────────────────────────────────────
function AEmailBlast({ user, contractors, perms }) {
  const [subject,        setSubject]       = useState("");
  const [body,           setBody]          = useState("");
  const [targetGroup,    setTargetGroup]   = useState("all");
  const [selectedClients,setSelectedClients]= useState([]);
  const [selectedUsers,  setSelectedUsers] = useState([]);
  const [search,         setSearch]        = useState("");
  const [err,            setErr]           = useState("");
  const [sent,           setSent]          = useState(false);
  const [loading,        setLoading]       = useState(false);

  const ALL_CLIENTS_WITH_INTERNAL = [...ALL_CLIENTS, "Internal"];
  const active = getVisible(user,contractors,perms).filter(c=>c.status==="Active"&&c.role==="contractor");
  const clientsInScope = [...new Set(active.map(c=>c.client))];

  const recipients = (() => {
    if (targetGroup==="individual") {
      return active.filter(c=>selectedUsers.includes(c.username));
    }
    if (targetGroup==="byClient") {
      return active.filter(c=>selectedClients.includes(c.client));
    }
    return active; // all
  })();

  const filteredForList = active.filter(c=>
    c.name.toLowerCase().includes(search.toLowerCase()) ||
    c.username.toLowerCase().includes(search.toLowerCase()) ||
    c.client.toLowerCase().includes(search.toLowerCase())
  );

  const toggleClient = (cl) => setSelectedClients(p=>p.includes(cl)?p.filter(c=>c!==cl):[...p,cl]);
  const toggleUser   = (un) => setSelectedUsers(p=>p.includes(un)?p.filter(u=>u!==un):[...p,un]);
  const selectAll    = () => setSelectedUsers(filteredForList.map(c=>c.username));
  const clearAll     = () => setSelectedUsers([]);

  const send = () => {
    setErr("");
    if (!subject.trim()) { setErr("Please enter a subject."); return; }
    if (!body.trim())    { setErr("Please enter a message."); return; }
    if (recipients.length===0) { setErr("No recipients selected."); return; }
    setLoading(true);
    setTimeout(()=>{ setSent(true); setLoading(false); },800);
  };

  const reset = () => { setSubject(""); setBody(""); setTargetGroup("all"); setSelectedClients([]); setSelectedUsers([]); setSearch(""); setSent(false); setErr(""); };

  if (sent) return (
    <div style={{ padding:"28px 20px", maxWidth:700, margin:"0 auto" }}>
      <Card style={{ textAlign:"center", padding:48 }}>
        <div style={{ fontSize:48, marginBottom:16 }}>✓</div>
        <div style={{ fontSize:20, fontWeight:800, color:C.green, marginBottom:8 }}>Email Sent</div>
        <div style={{ fontSize:14, color:C.muted, marginBottom:24 }}>Sent to <b>{recipients.length} contractor{recipients.length!==1?"s":""}</b> from <b style={{color:C.blue}}>hr@elitegrid.co</b></div>
        <div style={{ background:C.off, borderRadius:10, padding:16, marginBottom:24, textAlign:"left", maxHeight:200, overflowY:"auto" }}>
          <div style={{ fontSize:12, fontWeight:700, color:C.muted, textTransform:"uppercase", letterSpacing:"0.5px", marginBottom:8 }}>Recipients</div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>
            {recipients.map(c=>(
              <div key={c.username} style={{ display:"flex", alignItems:"center", gap:6, background:"#fff", border:`1px solid ${C.border}`, borderRadius:8, padding:"5px 10px" }}>
                <Avatar name={c.name} photoUrl={c.photoUrl} size={22}/>
                <span style={{ fontSize:12, fontWeight:600 }}>{c.name}</span>
              </div>
            ))}
          </div>
        </div>
        <Btn onClick={reset} style={{ padding:"10px 28px" }}>Send Another</Btn>
      </Card>
    </div>
  );

  return (
    <div style={{ padding:"28px 20px", maxWidth:960, margin:"0 auto" }}>
      <div style={{ fontSize:20, fontWeight:800, marginBottom:6 }}>Email Blast</div>
      <div style={{ fontSize:14, color:C.muted, marginBottom:24 }}>Send an email to contractors from hr@elitegrid.co.</div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 320px", gap:20, alignItems:"start" }}>
        {/* Compose */}
        <Card>
          <div style={{ fontSize:15, fontWeight:700, marginBottom:16 }}>Compose Email</div>
          {err&&<Alert type="error">{err}</Alert>}
          <FieldLabel required>Subject</FieldLabel>
          <FieldInput value={subject} onChange={e=>setSubject(e.target.value)} placeholder="e.g. Important Payroll Update" style={{ marginBottom:14 }}/>
          <FieldLabel required>Message</FieldLabel>
          <textarea value={body} onChange={e=>setBody(e.target.value)} rows={8} placeholder="Write your message here..." style={{ width:"100%", padding:"10px 13px", borderRadius:10, border:`1.5px solid ${C.border}`, fontSize:14, fontFamily:"inherit", outline:"none", resize:"vertical", boxSizing:"border-box", marginBottom:20 }}/>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:10 }}>
            <div style={{ fontSize:13, color:C.muted }}>Sending to <b style={{ color:C.navy }}>{recipients.length} contractor{recipients.length!==1?"s":""}</b></div>
            <Btn onClick={send} disabled={loading} style={{ padding:"10px 24px" }}>{loading?"Sending...":"Send Email"}</Btn>
          </div>
        </Card>

        {/* Recipients */}
        <Card>
          <div style={{ fontSize:15, fontWeight:700, marginBottom:14 }}>Recipients</div>
          {/* Target group tabs */}
          <div style={{ display:"flex", gap:6, marginBottom:16, flexWrap:"wrap" }}>
            {[["all","All Active"],["byClient","By Client"],["individual","Individual"]].map(([val,label])=>(
              <button key={val} onClick={()=>{ setTargetGroup(val); setSelectedClients([]); setSelectedUsers([]); }}
                style={{ padding:"6px 12px", borderRadius:20, border:`1.5px solid ${targetGroup===val?C.blue:C.border}`, background:targetGroup===val?"#DBEAFE":"#fff", color:targetGroup===val?C.blue:C.muted, fontSize:12, fontWeight:targetGroup===val?700:500, cursor:"pointer", fontFamily:"inherit" }}>
                {label}
              </button>
            ))}
          </div>

          {/* By client selection */}
          {targetGroup==="byClient" && (
            <div style={{ marginBottom:14 }}>
              <div style={{ fontSize:12, fontWeight:600, color:C.muted, marginBottom:8 }}>Select clients:</div>
              <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
                {clientsInScope.map(cl=>(
                  <button key={cl} onClick={()=>toggleClient(cl)}
                    style={{ padding:"5px 12px", borderRadius:20, border:`1.5px solid ${selectedClients.includes(cl)?C.blue:C.border}`, background:selectedClients.includes(cl)?"#DBEAFE":"#fff", color:selectedClients.includes(cl)?C.blue:C.muted, fontSize:12, fontWeight:selectedClients.includes(cl)?700:500, cursor:"pointer", fontFamily:"inherit" }}>
                    {cl}
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* Individual selection with search */}
          {targetGroup==="individual" && (
            <div style={{ marginBottom:14 }}>
              <div style={{ display:"flex", gap:8, marginBottom:8, alignItems:"center" }}>
                <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search name, username, client..."
                  style={{ flex:1, padding:"7px 12px", borderRadius:8, border:`1.5px solid ${C.border}`, fontSize:12, fontFamily:"inherit", outline:"none" }}/>
                <button onClick={selectAll} style={{ padding:"6px 10px", borderRadius:8, border:`1px solid ${C.blue}`, background:"#DBEAFE", color:C.blue, fontSize:11, fontWeight:700, cursor:"pointer", fontFamily:"inherit", whiteSpace:"nowrap" }}>All</button>
                <button onClick={clearAll} style={{ padding:"6px 10px", borderRadius:8, border:`1px solid ${C.border}`, background:"#fff", color:C.muted, fontSize:11, cursor:"pointer", fontFamily:"inherit" }}>Clear</button>
              </div>
              <div style={{ maxHeight:220, overflowY:"auto", border:`1px solid ${C.border}`, borderRadius:8 }}>
                {filteredForList.map(c=>(
                  <div key={c.username} onClick={()=>toggleUser(c.username)}
                    style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 12px", cursor:"pointer", background:selectedUsers.includes(c.username)?"#EFF6FF":"transparent", borderBottom:`1px solid ${C.border}` }}>
                    <input type="checkbox" checked={selectedUsers.includes(c.username)} onChange={()=>{}} style={{ cursor:"pointer", accentColor:C.blue }}/>
                    <Avatar name={c.name} photoUrl={c.photoUrl} size={26}/>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontSize:12, fontWeight:600, color:C.navy }}>{c.name}</div>
                      <div style={{ fontSize:10, color:C.muted }}>@{c.username} · {c.client}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Preview count */}
          <div style={{ fontSize:13, fontWeight:700, color:C.navy, marginBottom:8 }}>
            {targetGroup==="all"?"Sending to all "+active.length+" active contractors":
             targetGroup==="byClient"?recipients.length+" contractors from selected clients":
             selectedUsers.length+" contractors selected"}
          </div>
          {targetGroup!=="individual" && recipients.length>0 && (
            <div style={{ maxHeight:180, overflowY:"auto" }}>
              {recipients.map(c=>(
                <div key={c.username} style={{ display:"flex", alignItems:"center", gap:8, padding:"6px 0", borderBottom:`1px solid ${C.border}` }}>
                  <Avatar name={c.name} photoUrl={c.photoUrl} size={26}/>
                  <div>
                    <div style={{ fontSize:12, fontWeight:600, color:C.navy }}>{c.name}</div>
                    <div style={{ fontSize:10, color:C.muted }}>{c.email}</div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </Card>
      </div>
    </div>
  );
}


function AClients({ user, contractors, clients, setClients }) {
  const [selected,   setSelected]   = useState(null);
  const [showForm,   setShowForm]   = useState(false);
  const [editTarget, setEditTarget] = useState(null);
  const [search,     setSearch]     = useState("");
  const [filterSt,   setFilterSt]   = useState("All");

  const isSA = normalizeRoleStr(user.role) === "superadmin";

  const STATUS_COLORS = {
    Active:   [C.greenBg, C.green],
    Inactive: [C.off,     C.muted],
    Prospect: ["#EDE9FE","#7C3AED"],
    "On Hold":[C.amberBg, C.amber],
  };

  const filtered = clients
    .filter(c => filterSt==="All" || c.status===filterSt)
    .filter(c => c.name.toLowerCase().includes(search.toLowerCase()) || c.code.toLowerCase().includes(search.toLowerCase()));

  const getAssigned = (code) => contractors.filter(c=>c.client===code&&c.status==="Active");

  const getBillingTotal = (code) => {
    const assigned = getAssigned(code);
    let total = 0;
    assigned.forEach(c => {
      const match = c.rate.match(/[\d.]+/);
      if (match) total += parseFloat(match[0]);
    });
    return total > 0 ? `$${total.toFixed(2)}/hr combined` : "See billing amount";
  };

  const archiveClient = (clientId) => {
    if (!isSA) return;
    setClients(prev => prev.map(c => c.clientId===clientId ? {...c, status:"Inactive"} : c));
    if (selected && selected.clientId === clientId) setSelected(prev => ({...prev, status:"Inactive"}));
  };

  const statusBadge = (s) => {
    const [bg,col] = STATUS_COLORS[s]||[C.off,C.muted];
    return <span style={{ background:bg, color:col, fontSize:10, fontWeight:700, padding:"3px 10px", borderRadius:20, display:"inline-block" }}>{s}</span>;
  };

  return (
    <div style={{ padding:"28px 20px", maxWidth:1100, margin:"0 auto" }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20, flexWrap:"wrap", gap:10 }}>
        <div style={{ fontSize:20, fontWeight:800 }}>Client Database</div>
        <Btn onClick={()=>{ setEditTarget(null); setShowForm(true); }}>+ Add Client</Btn>
      </div>

      <div style={{ display:"flex", gap:10, marginBottom:16, flexWrap:"wrap", alignItems:"center" }}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search by name or code..." style={{ padding:"8px 13px", borderRadius:8, border:`1.5px solid ${C.border}`, fontSize:13, fontFamily:"inherit", outline:"none", width:220 }}/>
        {["All","Active","Inactive","Prospect","On Hold"].map(f=>(
          <button key={f} onClick={()=>setFilterSt(f)} style={{ background:filterSt===f?C.navy:C.off, color:filterSt===f?"#fff":C.muted, border:`1px solid ${filterSt===f?C.navy:C.border}`, borderRadius:7, padding:"6px 14px", fontSize:12, fontWeight:600, cursor:"pointer", fontFamily:"inherit" }}>{f}</button>
        ))}
      </div>

      <div style={{ display:"grid", gridTemplateColumns:selected?"1fr 400px":"1fr", gap:20, alignItems:"start" }}>

        {/* CLIENT LIST */}
        <Card style={{ padding:0, overflow:"hidden" }}>
          <div style={{ overflowX:"auto" }}>
            <table style={{ width:"100%", borderCollapse:"collapse" }}>
              <thead><tr style={{ background:C.off }}>
                {["Client","Code","Type","Billing Date","Timezone","POC","Status",""].map(h=>(
                  <th key={h} style={{ padding:"10px 14px", textAlign:"left", fontSize:11, fontWeight:700, color:C.muted, textTransform:"uppercase", letterSpacing:"0.5px", borderBottom:`1px solid ${C.border}`, whiteSpace:"nowrap" }}>{h}</th>
                ))}
              </tr></thead>
              <tbody>
                {filtered.length===0
                  ? <tr><td colSpan={8} style={{ padding:32, textAlign:"center", color:C.muted, fontSize:14 }}>No clients found.</td></tr>
                  : filtered.map(c=>(
                    <tr key={c.clientId}
                      onClick={()=>setSelected((selected && selected.clientId===c.clientId)?null:c)}
                      style={{ borderBottom:`1px solid ${C.border}`, cursor:"pointer", background:(selected && selected.clientId===c.clientId)?"#F0F7FF":"#fff" }}>
                      <td style={{ padding:"13px 14px" }}>
                        <div style={{ fontWeight:700, fontSize:14, color:C.navy }}>{c.name}</div>
                        <div style={{ fontSize:12, color:C.muted, marginTop:2 }}>{getAssigned(c.code).length} contractor{getAssigned(c.code).length!==1?"s":""} assigned</div>
                      </td>
                      <td style={{ padding:"13px 14px" }}><span style={{ background:"#DBEAFE", color:"#1D4ED8", fontSize:11, fontWeight:700, padding:"3px 9px", borderRadius:20 }}>{c.code}</span></td>
                      <td style={{ padding:"13px 14px", fontSize:13, color:C.muted, whiteSpace:"nowrap" }}>{c.engagementType}</td>
                      <td style={{ padding:"13px 14px", fontSize:13, color:C.muted }}>{c.billingDate ? `${c.billingDate}${c.billingDate===1?"st":c.billingDate===2?"nd":c.billingDate===3?"rd":"th"} of month` : "TBD"}</td>
                      <td style={{ padding:"13px 14px", fontSize:13, color:C.muted }}>{c.timezone}</td>
                      <td style={{ padding:"13px 14px" }}>
                        <div style={{ fontSize:13, fontWeight:600, color:C.navy }}>{c.pocName}</div>
                        <div style={{ fontSize:11, color:C.muted }}>{c.pocEmail}</div>
                      </td>
                      <td style={{ padding:"13px 14px" }}>{statusBadge(c.status)}</td>
                      <td style={{ padding:"13px 14px" }}>
                        <div style={{ display:"flex", gap:6 }}>
                          <button onClick={e=>{e.stopPropagation();setEditTarget(c);setShowForm(true);}} style={{ background:C.off, border:`1px solid ${C.border}`, borderRadius:6, padding:"4px 10px", fontSize:11, color:C.blue, fontWeight:600, cursor:"pointer" }}>Edit</button>
                          {isSA && c.status!=="Inactive" && <button onClick={e=>{e.stopPropagation();archiveClient(c.clientId);}} style={{ background:C.redBg, border:"1px solid #FECACA", borderRadius:6, padding:"4px 10px", fontSize:11, color:C.red, fontWeight:600, cursor:"pointer" }}>Deactivate</button>}
                        </div>
                      </td>
                    </tr>
                  ))
                }
              </tbody>
            </table>
          </div>
        </Card>

        {/* SIDE PANEL */}
        {selected && (
          <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
            <Card>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:16 }}>
                <div>
                  <div style={{ fontSize:18, fontWeight:800, color:C.navy, marginBottom:4 }}>{selected.name}</div>
                  <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                    <span style={{ background:"#DBEAFE", color:"#1D4ED8", fontSize:11, fontWeight:700, padding:"3px 9px", borderRadius:20 }}>{selected.code}</span>
                    {statusBadge(selected.status)}
                  </div>
                </div>
                <button onClick={()=>setSelected(null)} style={{ background:"none", border:"none", color:C.muted, fontSize:20, cursor:"pointer", lineHeight:1 }}>x</button>
              </div>

              {[
                ["Engagement Type", selected.engagementType],
                ["Billing Date",    selected.billingDate ? `${selected.billingDate}${selected.billingDate===1?"st":selected.billingDate===2?"nd":selected.billingDate===3?"rd":"th"} of every month` : "TBD"],
                ["Billing Amount",  selected.billingAmount],
                ["Timezone",        selected.timezone],
                ["Start Date",      selected.startDate || "Not set"],
              ].map(([l,v])=>(
                <div key={l} style={{ display:"flex", justifyContent:"space-between", padding:"10px 0", borderBottom:`1px solid ${C.border}` }}>
                  <span style={{ fontSize:13, color:C.muted }}>{l}</span>
                  <span style={{ fontSize:13, fontWeight:600, color:C.navy, textAlign:"right" }}>{v}</span>
                </div>
              ))}

              <div style={{ marginTop:14 }}>
                <div style={{ fontSize:11, fontWeight:700, color:C.muted, textTransform:"uppercase", letterSpacing:"0.6px", marginBottom:8 }}>Point of Contact</div>
                <div style={{ background:C.off, borderRadius:8, padding:12 }}>
                  <div style={{ fontWeight:700, fontSize:14, color:C.navy, marginBottom:4 }}>{selected.pocName}</div>
                  <div style={{ fontSize:13, color:C.blue }}>{selected.pocEmail}</div>
                  <div style={{ fontSize:13, color:C.muted, marginTop:2 }}>{selected.pocPhone}</div>
                </div>
              </div>

              {selected.notes && (
                <div style={{ marginTop:14 }}>
                  <div style={{ fontSize:11, fontWeight:700, color:C.muted, textTransform:"uppercase", letterSpacing:"0.6px", marginBottom:8 }}>Notes</div>
                  <div style={{ fontSize:13, color:"#4A5568", lineHeight:1.6, background:C.off, borderRadius:8, padding:12 }}>{selected.notes}</div>
                </div>
              )}
            </Card>

            {/* ASSIGNED CONTRACTORS */}
            <Card>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
                <div style={{ fontSize:14, fontWeight:700 }}>Assigned Contractors</div>
                <span style={{ fontSize:12, color:C.muted }}>{getAssigned(selected.code).length} active</span>
              </div>
              {getAssigned(selected.code).length===0
                ? <div style={{ fontSize:13, color:C.muted, padding:"8px 0" }}>No active contractors on this account.</div>
                : getAssigned(selected.code).map(c=>(
                  <div key={c.username} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 0", borderBottom:`1px solid ${C.border}` }}>
                    <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                      <div style={{ width:34, height:34, borderRadius:"50%", background:`linear-gradient(135deg,${C.cyan},${C.blueDk})`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:12, fontWeight:800, color:"#fff", flexShrink:0 }}>
                        {String(c.name || c.username || "").split(" ").map(n=>n[0]).join("").slice(0,2)}
                      </div>
                      <div>
                        <div style={{ fontSize:13, fontWeight:600, color:C.navy }}>{c.name}</div>
                        <div style={{ fontSize:11, color:C.muted }}>{c.position} - {c.tier}</div>
                      </div>
                    </div>
                    <div style={{ fontSize:13, fontWeight:700, color:C.blue }}>{fmtRate(c.rate)}</div>
                  </div>
                ))
              }
              {getAssigned(selected.code).length > 0 && (
                <div style={{ marginTop:12, padding:"10px 14px", background:`linear-gradient(135deg,${C.navy},${C.navyLt})`, borderRadius:8, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                  <span style={{ fontSize:13, color:"#8AAABF" }}>Estimated billing total</span>
                  <span style={{ fontSize:14, fontWeight:800, color:C.cyan }}>{getBillingTotal(selected.code)}</span>
                </div>
              )}
            </Card>
          </div>
        )}
      </div>

      {/* ADD / EDIT MODAL */}
      {showForm && (
        <ClientModal
          user={user}
          existing={editTarget}
          onClose={()=>{ setShowForm(false); setEditTarget(null); }}
          onSave={c=>{
            if (editTarget) {
              if (!DEMO_MODE) callScript("updateClient", c, ()=>{}, ()=>{});
              setClients(prev=>prev.map(x=>x.clientId===c.clientId?c:x));
              setSelected(c);
            } else {
              const newClient = {...c, clientId:"CL-"+Date.now()};
              if (!DEMO_MODE) callScript("addClient", newClient, ()=>{}, ()=>{});
              setClients(prev=>[...prev, newClient]);
            }
            setShowForm(false); setEditTarget(null);
          }}
        />
      )}
    </div>
  );
}

function ClientModal({ user, existing, onClose, onSave }) {
  const blank = { name:"", code:"", status:"Active", engagementType:"Fixed Monthly Retainer", billingDate:1, billingAmount:"", timezone:"ET", pocName:"", pocEmail:"", pocPhone:"", startDate:"", notes:"" };
  const [form, setForm] = useState(existing||blank);
  const [err,  setErr]  = useState("");
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  const save = () => {
    if (!form.name.trim()||!form.code.trim()) { setErr("Client name and code are required."); return; }
    if (!form.pocName.trim()||!form.pocEmail.trim()) { setErr("POC name and email are required."); return; }
    onSave(form);
  };

  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(27,42,74,0.65)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:200, padding:16, overflowY:"auto" }} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{ background:"#fff", borderRadius:16, padding:32, width:"100%", maxWidth:620, boxShadow:"0 24px 80px rgba(0,0,0,0.3)", maxHeight:"92vh", overflowY:"auto" }}>
        <div style={{ fontSize:18, fontWeight:800, color:C.navy, marginBottom:4 }}>{existing?"Edit Client":"Add New Client"}</div>
        <div style={{ fontSize:13, color:C.muted, marginBottom:20 }}>Fill in the client details below.</div>
        {err && <Alert type="error">{err}</Alert>}

        {/* Basic info */}
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))", gap:14, marginBottom:14 }}>
          <div>
            <FieldLabel required>Client Name</FieldLabel>
            <FieldInput value={form.name} onChange={e=>set("name",e.target.value)} placeholder="e.g. Mission First Ops"/>
          </div>
          <div>
            <FieldLabel required>Client Code</FieldLabel>
            <FieldInput value={form.code} onChange={e=>set("code",e.target.value.toUpperCase())} placeholder="e.g. MFO"/>
          </div>
          <div>
            <FieldLabel>Status</FieldLabel>
            <select value={form.status} onChange={e=>set("status",e.target.value)} style={{ width:"100%", padding:"10px 13px", borderRadius:8, border:`1.5px solid ${C.border}`, fontSize:14, fontFamily:"inherit", outline:"none", background:"#fff" }}>
              {["Active","Inactive","Prospect","On Hold"].map(s=><option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <div>
            <FieldLabel>Engagement Type</FieldLabel>
            <select value={form.engagementType} onChange={e=>set("engagementType",e.target.value)} style={{ width:"100%", padding:"10px 13px", borderRadius:8, border:`1.5px solid ${C.border}`, fontSize:14, fontFamily:"inherit", outline:"none", background:"#fff" }}>
              {["Fixed Monthly Retainer","Hourly","Project-Based"].map(s=><option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <div>
            <FieldLabel>Billing Date (day of month)</FieldLabel>
            <input type="number" min={1} max={31} value={form.billingDate} onChange={e=>set("billingDate",parseInt(e.target.value)||1)} style={{ width:"100%", padding:"10px 13px", borderRadius:8, border:`1.5px solid ${C.border}`, fontSize:14, fontFamily:"inherit", outline:"none", boxSizing:"border-box" }}/>
          </div>
          <div>
            <FieldLabel>Billing Amount / Rate</FieldLabel>
            <FieldInput value={form.billingAmount} onChange={e=>set("billingAmount",e.target.value)} placeholder="e.g. $2,800/mo or $45/hr"/>
          </div>
          <div>
            <FieldLabel>US Timezone</FieldLabel>
            <select value={form.timezone} onChange={e=>set("timezone",e.target.value)} style={{ width:"100%", padding:"10px 13px", borderRadius:8, border:`1.5px solid ${C.border}`, fontSize:14, fontFamily:"inherit", outline:"none", background:"#fff" }}>
              {["ET","CT","MT","PT"].map(t=><option key={t} value={t}>{t}</option>)}
            </select>
          </div>
          <div>
            <FieldLabel>Start Date</FieldLabel>
            <FieldInput type="date" value={form.startDate} onChange={e=>set("startDate",e.target.value)}/>
          </div>
        </div>

        {/* POC */}
        <div style={{ background:C.off, borderRadius:10, padding:16, marginBottom:14 }}>
          <div style={{ fontSize:13, fontWeight:700, color:C.navy, marginBottom:12 }}>Point of Contact</div>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))", gap:14 }}>
            <div>
              <FieldLabel required>POC Name</FieldLabel>
              <FieldInput value={form.pocName} onChange={e=>set("pocName",e.target.value)} placeholder="Full name"/>
            </div>
            <div>
              <FieldLabel required>POC Email</FieldLabel>
              <FieldInput type="email" value={form.pocEmail} onChange={e=>set("pocEmail",e.target.value)} placeholder="email@client.com"/>
            </div>
            <div>
              <FieldLabel>POC Phone</FieldLabel>
              <FieldInput value={form.pocPhone} onChange={e=>set("pocPhone",e.target.value)} placeholder="+1 555-000-0000"/>
            </div>
          </div>
        </div>

        {/* Notes */}
        <div style={{ marginBottom:20 }}>
          <FieldLabel>Notes / Remarks</FieldLabel>
          <textarea value={form.notes} onChange={e=>set("notes",e.target.value)} rows={3} placeholder="Special instructions, contract details, reminders..." style={{ width:"100%", padding:"10px 13px", borderRadius:8, border:`1.5px solid ${C.border}`, fontSize:14, fontFamily:"inherit", outline:"none", resize:"vertical", boxSizing:"border-box" }}/>
        </div>

        <div style={{ display:"flex", gap:10 }}>
          <Btn onClick={save} style={{ flex:1, padding:12 }}>{existing?"Save Changes":"Add Client"}</Btn>
          <Btn variant="secondary" onClick={onClose} style={{ flex:1, padding:12 }}>Cancel</Btn>
        </div>
      </div>
    </div>
  );
}
